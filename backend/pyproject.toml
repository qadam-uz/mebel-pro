[project]
name = "mebel-pro-backend"
version = "0.1.0"
description = "Mebel Pro — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "markdown>=3.10.2",
    "boto3>=1.43.6",
    "argon2-cffi>=25.1.0",
    "reportlab>=4.5.1",
    "defusedxml>=0.7.1",
    "cutting-engine==0.3.2",
    "pillow>=12.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-markdown>=3.10.2.20260508",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]
"app/migrations/**" = ["E501", "F401"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/migrations/"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]  # boto3-stubs not pulled in; used for the S3 client only
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]  # no stubs bundled; used only for cutting PDF byte generation
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["defusedxml.*"]  # no bundled py.typed marker; used only for safe XML parsing
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"

[tool.coverage.run]
omit = ["app/migrations/*", "tests/*"]
