# Production stack — standalone, NOT an overlay.
#
# Usage on the server (from this directory):
#
#   docker compose -f compose.prod.yaml up -d --build
#
# Key differences from compose.yaml (dev):
#   - NO local `postgres` / `minio` services. The VPS already runs them in
#     an external Docker network called `infra-net` (also used by other
#     projects on the same box, e.g. taqsim). The backend joins that
#     network and reaches them by service name: `postgres`, `minio`.
#   - Adds a `caddy` edge — the only published service (80/443; auto-HTTPS
#     per host). Routes by subdomain derived from BASE_DOMAIN. See ./Caddyfile.
#   - Built images (no source bind-mounts, no autoreload). `web` is the
#     nginx image serving the built SPA bundle.
#   - Resource limits + log rotation, so a runaway query/leak can't OOM
#     the host and JSON logs can't fill the disk.
#   - The repo's docs/ tree is bind-mounted into `backend` at /docs — the
#     live docs site at admin.<BASE_DOMAIN>/docs reads it on every request.
#
# Required env in deploy/.env (create it on the server, chmod 600):
#   ENV, DEBUG, POSTGRES_* (creds on the SHARED postgres), MINIO_* (creds on
#   the SHARED minio), DOCS_AUTH_*, BASE_DOMAIN, ACME_EMAIL.

name: mebel-pro

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      ENV: prod
      DEBUG: "false"
      # Shared infra reachable by service name on `infra-net`.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mebel}
      MINIO_USE_SSL: "false"
      DOCS_DIR: /docs
      DOCS_AUTH_USERNAME: ${DOCS_AUTH_USERNAME}
      DOCS_AUTH_PASSWORD: ${DOCS_AUTH_PASSWORD}
      OTP_DEV_CODES: ${OTP_DEV_CODES:-[]}
      ALLOW_PROD_OTP_DEV_CODES: ${ALLOW_PROD_OTP_DEV_CODES:-false}
      OTP_RATE_LIMITS_ENABLED: ${OTP_RATE_LIMITS_ENABLED:-true}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_PHONE_SENDS_PER_HOUR: ${OTP_PHONE_SENDS_PER_HOUR:-5}
      OTP_PHONE_SENDS_PER_DAY: ${OTP_PHONE_SENDS_PER_DAY:-10}
      OTP_IP_SENDS_PER_HOUR: ${OTP_IP_SENDS_PER_HOUR:-30}
      OTP_IP_SENDS_PER_DAY: ${OTP_IP_SENDS_PER_DAY:-50}
      OTP_GLOBAL_SENDS_PER_HOUR: ${OTP_GLOBAL_SENDS_PER_HOUR:-150}
      OTP_GLOBAL_SENDS_PER_DAY: ${OTP_GLOBAL_SENDS_PER_DAY:-1000}
      OTP_CODE_PEPPER: ${OTP_CODE_PEPPER:-}
      TELEGRAM_GATEWAY_ACCESS_TOKEN: ${TELEGRAM_GATEWAY_ACCESS_TOKEN:-}
      TELEGRAM_GATEWAY_API_BASE_URL: ${TELEGRAM_GATEWAY_API_BASE_URL:-https://gatewayapi.telegram.org}
      TELEGRAM_GATEWAY_TIMEOUT_SECONDS: ${TELEGRAM_GATEWAY_TIMEOUT_SECONDS:-5}
      # Must match the pinned `default` network subnet below — the per-IP OTP
      # limits only see real client IPs when the edge's X-Forwarded-For is
      # trusted. infra-net is shared with other projects and stays untrusted.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-["172.29.0.0/24"]}
    volumes:
      # Live docs site reads this on every request — no build step. The repo
      # is present on the host (the deploy pulls it).
      - ../docs:/docs:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    networks:
      - default
      - infra-net

  web:
    build:
      context: ../web
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  edge:
    build:
      context: .
      dockerfile: edge.Dockerfile
    restart: unless-stopped
    depends_on:
      - web
      - backend
    environment:
      # The apex. Caddy serves apex + app.* + workshop.* + admin.* derived
      # from it. Each gets a Let's Encrypt cert automatically (DNS must
      # point here and ports 80/443 must be reachable).
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN must be set in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"        # HTTP — also the ACME HTTP-01 challenge / HTTPS redirect
      - "443:443"      # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      # Caddyfile is baked into the image (see edge.Dockerfile) — not mounted,
      # so config changes ship as a new image and recreate the edge.
      - caddy-data:/data       # certs + ACME state — must persist
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  caddy-data:
  caddy-config:

networks:
  # Pinned subnet so TRUSTED_PROXY_CIDRS (backend env above) can trust the
  # edge's X-Forwarded-For deterministically. If you change one, change both.
  # Before the first deploy, confirm the subnet is free on the VPS:
  #   docker network inspect $(docker network ls -q) | grep 172.29
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24

  # Created out-of-band on the VPS:
  #   docker network create infra-net
  # The shared `postgres` and `minio` services are attached to it; we join
  # it here so the backend can resolve them by name.
  infra-net:
    external: true
