# Production stack — standalone, NOT an overlay.
#
# Usage on the server (from this directory):
#
#   docker compose -f compose.prod.yaml up -d --build
#
# Key differences from compose.yaml (dev):
#   - NO local `postgres` / `minio` services. The VPS already runs them in
#     an external Docker network called `infra-net`. The backend joins that
#     network and reaches them by service name: `postgres`, `minio`.
#   - Adds a Caddy `edge` — the only published service, and only on
#     127.0.0.1:8080, plain HTTP. Routes by subdomain derived from
#     BASE_DOMAIN (see ./Caddyfile). TLS is terminated in front of it by the
#     host-level nginx + certbot that serves every project on the box
#     (reference config: ./nginx-host.conf.example).
#   - Built images (no source bind-mounts, no autoreload). `web` is the
#     nginx image serving the built SPA bundle.
#   - Resource limits + log rotation, so a runaway query/leak can't OOM
#     the host and JSON logs can't fill the disk.
#   - The repo's docs/ tree is bind-mounted into `backend` at /docs — the
#     live docs site at admin.<BASE_DOMAIN>/docs reads it on every request.
#
# Required env in deploy/.env (create it on the server, chmod 600):
#   ENV, DEBUG, POSTGRES_* (creds on the SHARED postgres), MINIO_* (creds on
#   the SHARED minio), DOCS_AUTH_*, BASE_DOMAIN.

name: mebel-pro

services:
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      ENV: prod
      DEBUG: "false"
      # Shared infra reachable by service name on `infra-net`.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mebel}
      MINIO_USE_SSL: "false"
      DOCS_DIR: /docs
      DOCS_AUTH_USERNAME: ${DOCS_AUTH_USERNAME}
      DOCS_AUTH_PASSWORD: ${DOCS_AUTH_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_API_TIMEOUT_SECONDS: ${TELEGRAM_API_TIMEOUT_SECONDS:-5}
      TELEGRAM_LOGIN_CODE_PEPPER: ${TELEGRAM_LOGIN_CODE_PEPPER:-}
      TELEGRAM_LOGIN_DEV_MODE: ${TELEGRAM_LOGIN_DEV_MODE:-false}
      ALLOW_PROD_TELEGRAM_LOGIN_DEV_MODE: ${ALLOW_PROD_TELEGRAM_LOGIN_DEV_MODE:-false}
      TELEGRAM_LOGIN_RATE_LIMITS_ENABLED: ${TELEGRAM_LOGIN_RATE_LIMITS_ENABLED:-true}
      TELEGRAM_LOGIN_TOKENS_PER_IP_PER_HOUR: ${TELEGRAM_LOGIN_TOKENS_PER_IP_PER_HOUR:-30}
      TELEGRAM_LOGIN_TOKENS_PER_IP_PER_DAY: ${TELEGRAM_LOGIN_TOKENS_PER_IP_PER_DAY:-100}
      TELEGRAM_LOGIN_CODE_REDEEMS_PER_IP: ${TELEGRAM_LOGIN_CODE_REDEEMS_PER_IP:-10}
      TELEGRAM_LOGIN_CODE_REDEEM_WINDOW_SECONDS: ${TELEGRAM_LOGIN_CODE_REDEEM_WINDOW_SECONDS:-60}
      CLIENT_APP_BASE_URL: ${CLIENT_APP_BASE_URL:-}
      # Must match the pinned `default` network subnet below. The chain is
      # client → host nginx (sets X-Forwarded-For to the client) → docker
      # gateway 172.29.0.1 → Caddy edge (appends 172.29.0.1) → backend. The
      # backend takes the right-most hop outside these CIDRs, so the gateway
      # is skipped and the real client IP wins — the per-IP limits are inert
      # without it. infra-net is shared with other projects and stays untrusted.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-["172.29.0.0/24"]}
    volumes:
      # Live docs site reads this on every request — no build step. The repo
      # is present on the host (the deploy pulls it).
      - ../docs:/docs:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    networks:
      - default
      - infra-net

  web:
    build:
      context: ../web
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    # Project-unique alias the Caddyfile proxies to. Defensive: the edge sits
    # on `default` only today, but a bare `web` becomes ambiguous the moment a
    # container joins a network shared with another project — that once made
    # every mebel-pro SPA serve a neighbour's frontend. Project-specific names,
    # always.
    networks:
      default:
        aliases:
          - mebel-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  edge:
    build:
      context: .
      dockerfile: edge.Dockerfile
    restart: unless-stopped
    depends_on:
      - web
      - backend
    environment:
      # The apex. Caddy routes apex + app.* + workshop.* + admin.* derived
      # from it (Host header as forwarded by the host nginx).
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN must be set in deploy/.env}
    ports:
      # Loopback only, plain HTTP. The host nginx owns 80/443 and TLS for the
      # whole box and proxies here; binding 127.0.0.1 keeps the edge
      # unreachable from the internet, which is also what makes trusting the
      # gateway's X-Forwarded-For in the Caddyfile safe.
      - "127.0.0.1:8080:80"
    volumes:
      # Caddyfile is baked into the image (see edge.Dockerfile) — not mounted,
      # so config changes ship as a new image and recreate the edge.
      - caddy-data:/data       # Caddy runtime state (no certs — TLS is the host nginx's)
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      # `default` only: reaches web/backend, and keeps both the edge's own IP
      # and its loopback-port gateway (172.29.0.1) inside 172.29.0.0/24, so
      # TRUSTED_PROXY_CIDRS matches.
      - default

volumes:
  caddy-data:
  caddy-config:

networks:
  # Pinned subnet so TRUSTED_PROXY_CIDRS (backend env above) can trust the
  # edge's X-Forwarded-For deterministically, and the Caddyfile can trust the
  # gateway (172.29.0.1) the host nginx arrives from. If you change one,
  # change all three.
  # Before the first deploy, confirm the subnet is free on the VPS:
  #   docker network inspect $(docker network ls -q) | grep 172.29
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24

  # Created out-of-band on the VPS:
  #   docker network create infra-net
  # The shared `postgres` and `minio` services are attached to it; we join
  # it here so the backend can resolve them by name.
  infra-net:
    external: true
