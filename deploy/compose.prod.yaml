# Production stack — standalone, NOT an overlay of compose.yaml.
#
# Driven by deploy/scripts/deploy.sh, which CI runs over SSH for every green
# push to main; its steps are the canonical order of operations. By hand on
# the server, from this directory:
#
#   docker compose -f compose.prod.yaml ps
#   docker compose -f compose.prod.yaml logs -f backend
#
# What makes it prod:
#   - backend / web / edge are PREBUILT images from GHCR, built once by CI
#     (.github/workflows/ci.yml → `images`). backend and web are tagged with
#     the full commit SHA (IMAGE_TAG); the edge with a tag derived from its own
#     build inputs (EDGE_IMAGE_TAG, scripts/edge-tag.sh), so a deploy that
#     doesn't touch the Caddyfile leaves the edge container running instead of
#     restarting it. deploy.sh pins both in deploy/.env, so manual commands
#     resolve the deployed images too. There is deliberately no `build:` key
#     anywhere in this file: with one present, compose can quietly fall back
#     to building on this small shared box (the PackingSolver compile alone is
#     ~7 min). The server only ever pulls.
#   - postgres + minio belong to this stack, with named volumes — nothing else
#     on the box provides or uses them. deploy.sh never pulls their images (or
#     mc's): compose fetches them only when missing, so a moved
#     `postgres:17-alpine` can't restart the database mid-deploy. Bumping one
#     is a deliberate act — deploy/AGENTS.md.
#   - The serving backend never migrates. deploy.sh runs `alembic upgrade
#     head` as a separate, gated one-off container while the previous backend
#     keeps serving, and only then swaps the containers.
#   - A Caddy `edge` is the only published service — 127.0.0.1:8080, plain
#     HTTP. Routes by subdomain derived from BASE_DOMAIN (see ./Caddyfile).
#     TLS is terminated in front of it by the host-level nginx + certbot that
#     serves every project on the box (reference config:
#     ./nginx-host.conf.example).
#   - Resource limits + log rotation, so a runaway query/leak can't OOM the
#     host and JSON logs can't fill the disk.
#   - The repo's docs/ tree is bind-mounted into `backend` at /docs — the live
#     docs site at admin.<BASE_DOMAIN>/docs reads it on every request, from
#     the checkout deploy.sh resets to the deployed commit.
#
# DATA SAFETY. The database and the uploaded files live in the named volumes
# `prod-postgres-data` and `prod-minio-data` (on disk: mebel-pro_prod-…).
# They survive `up`, `pull`, `--remove-orphans`, container recreation and
# `docker image prune`. Only `docker compose down -v` and `docker volume rm`
# destroy them — never run either on the server. (There are no backups yet —
# see deploy/AGENTS.md.)
#
# The postgres image applies POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
# only when it initialises an EMPTY volume. Changing POSTGRES_PASSWORD in .env
# later does not change the database's password — it only locks the backend
# out. Rotate it inside the DB first (ALTER ROLE … PASSWORD …), then in .env.
#
# Required env in deploy/.env (from .env.prod.example, chmod 600):
#   POSTGRES_*, MINIO_* (initialise this stack's own data services, and are
#   the credentials the backend connects with), DOCS_AUTH_* (required and
#   non-empty — an empty pair would open /docs), TELEGRAM_*,
#   CLIENT_APP_BASE_URL, BASE_DOMAIN — plus IMAGE_TAG and EDGE_IMAGE_TAG,
#   which deploy.sh manages. The tunables (DB_POOL_*, LOGIN_IP_*,
#   PUBLIC_LINK_*, the TELEGRAM_LOGIN_* limits) fall back to the template's
#   values when unset.

name: mebel-pro

services:
  # This stack's own Postgres. No published port: only the backend (and
  # deploy.sh's one-off migration container) reach it, by service name on the
  # project network.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in deploy/.env}
    volumes:
      - prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `$$` leaves the expansion to the container's shell, so the check uses
      # exactly the user/db the container was started with. Over TCP, not the
      # socket: while initialising an empty volume the image runs a temporary
      # socket-only server, which a socket check would report as ready just
      # before it restarts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  # This stack's own MinIO (decor photos, logos, receipts). Same "one set of
  # creds" wiring as dev: MinIO's root user IS the access key the backend uses.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    # S3 API only, on the project network. No console port: nothing outside
    # this stack needs MinIO, and the box's other project already holds
    # 127.0.0.1:9001.
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID must be set in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY must be set in deploy/.env}
    volumes:
      - prod-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M

  # One-shot: make sure the bucket exists, then exit (idempotent). Behind the
  # `setup` profile so a plain `up` never starts it — a one-shot that exits
  # doesn't mix with `up --wait`. deploy.sh runs it explicitly
  # (`run --rm --no-deps createbuckets`) once minio is healthy.
  createbuckets:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    profiles: ["setup"]
    depends_on:
      minio:
        condition: service_healthy
    # Same commands as dev, but the creds arrive as env and are expanded by
    # the container's shell (`$$`) instead of being interpolated into the
    # command line: a secret with shell metacharacters can't break it, and it
    # never shows up in the host's process list.
    environment:
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:?MINIO_ACCESS_KEY_ID must be set in deploy/.env}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:?MINIO_SECRET_ACCESS_KEY must be set in deploy/.env}
      MINIO_BUCKET: ${MINIO_BUCKET:-mebel}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY_ID" "$$MINIO_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    restart: "no"

  backend:
    image: ghcr.io/qadam-uz/mebel-pro-backend:${IMAGE_TAG:?IMAGE_TAG is set by deploy/scripts/deploy.sh}
    # Serve only — never migrate here. The image's default CMD
    # (backend/Dockerfile) is `alembic upgrade head && uvicorn …`; dev replaces
    # it with its own autoreload command, prod with this. Migrations are
    # deploy.sh's separate, gated step. A container that migrated on start
    # would turn a failed migration into an outage (it replaces the old
    # container first) and would crash-loop after a rollback: an older image
    # can't `alembic upgrade head` against a database at a newer revision.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENV: prod
      DEBUG: "false"
      # This stack's own data services, by service name.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mebel}
      MINIO_USE_SSL: "false"
      DOCS_DIR: /docs
      # `:?` also rejects an EMPTY value: the backend compares Basic-auth
      # credentials verbatim, so an empty pair would let anyone into /docs and
      # the OpenAPI UIs. Fail the deploy instead.
      DOCS_AUTH_USERNAME: ${DOCS_AUTH_USERNAME:?DOCS_AUTH_USERNAME must be set (non-empty) in deploy/.env}
      DOCS_AUTH_PASSWORD: ${DOCS_AUTH_PASSWORD:?DOCS_AUTH_PASSWORD must be set (non-empty) in deploy/.env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_API_TIMEOUT_SECONDS: ${TELEGRAM_API_TIMEOUT_SECONDS:-5}
      TELEGRAM_LOGIN_CODE_PEPPER: ${TELEGRAM_LOGIN_CODE_PEPPER:-}
      TELEGRAM_LOGIN_DEV_MODE: ${TELEGRAM_LOGIN_DEV_MODE:-false}
      ALLOW_PROD_TELEGRAM_LOGIN_DEV_MODE: ${ALLOW_PROD_TELEGRAM_LOGIN_DEV_MODE:-false}
      TELEGRAM_LOGIN_RATE_LIMITS_ENABLED: ${TELEGRAM_LOGIN_RATE_LIMITS_ENABLED:-true}
      TELEGRAM_LOGIN_TOKENS_PER_IP_PER_HOUR: ${TELEGRAM_LOGIN_TOKENS_PER_IP_PER_HOUR:-30}
      TELEGRAM_LOGIN_TOKENS_PER_IP_PER_DAY: ${TELEGRAM_LOGIN_TOKENS_PER_IP_PER_DAY:-100}
      TELEGRAM_LOGIN_CODE_REDEEMS_PER_IP: ${TELEGRAM_LOGIN_CODE_REDEEMS_PER_IP:-10}
      TELEGRAM_LOGIN_CODE_REDEEM_WINDOW_SECONDS: ${TELEGRAM_LOGIN_CODE_REDEEM_WINDOW_SECONDS:-60}
      LOGIN_IP_THROTTLE_ENABLED: ${LOGIN_IP_THROTTLE_ENABLED:-true}
      LOGIN_IP_MAX_FAILURES: ${LOGIN_IP_MAX_FAILURES:-20}
      LOGIN_IP_WINDOW_SECONDS: ${LOGIN_IP_WINDOW_SECONDS:-900}
      PUBLIC_LINK_THROTTLE_ENABLED: ${PUBLIC_LINK_THROTTLE_ENABLED:-true}
      PUBLIC_LINK_LOOKUPS_PER_IP: ${PUBLIC_LINK_LOOKUPS_PER_IP:-60}
      PUBLIC_LINK_WINDOW_SECONDS: ${PUBLIC_LINK_WINDOW_SECONDS:-60}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MAX_OVERFLOW: ${DB_POOL_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-10}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      CLIENT_APP_BASE_URL: ${CLIENT_APP_BASE_URL:-}
      # Must match the pinned `default` network subnet below. The chain is
      # client → host nginx (sets X-Forwarded-For to the client) → docker
      # gateway 172.29.0.1 → Caddy edge (appends 172.29.0.1) → backend. The
      # backend takes the right-most hop outside these CIDRs, so the gateway
      # is skipped and the real client IP wins — the per-IP limits are inert
      # without it.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-["172.29.0.0/24"]}
    volumes:
      # Live docs site reads this on every request — no build step. The repo
      # checkout is present on the host (deploy.sh resets it to the deployed
      # commit).
      - ../docs:/docs:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

  web:
    image: ghcr.io/qadam-uz/mebel-pro-web:${IMAGE_TAG:?IMAGE_TAG is set by deploy/scripts/deploy.sh}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    # Project-unique alias the Caddyfile proxies to. Defensive: the edge sits
    # on `default` only today, but a bare `web` becomes ambiguous the moment a
    # container joins a network shared with another project — that once made
    # every mebel-pro SPA serve a neighbour's frontend. Project-specific names,
    # always.
    networks:
      default:
        aliases:
          - mebel-web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  edge:
    # Content-addressed tag (scripts/edge-tag.sh), not the commit SHA: the
    # same edge inputs give the same tag, so compose leaves a running edge
    # alone unless its config really changed. Restarting it would be a 1–2 s
    # gap of refused connections (host nginx 502s) that no retry covers.
    image: ghcr.io/qadam-uz/mebel-pro-edge:${EDGE_IMAGE_TAG:?EDGE_IMAGE_TAG is set by deploy/scripts/deploy.sh}
    restart: unless-stopped
    depends_on:
      - web
      - backend
    environment:
      # The apex. Caddy routes apex + my.* + workshop.* + admin.* derived
      # from it (Host header as forwarded by the host nginx).
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN must be set in deploy/.env}
    ports:
      # Loopback only, plain HTTP. The host nginx owns 80/443 and TLS for the
      # whole box and proxies here; binding 127.0.0.1 keeps the edge
      # unreachable from the internet, which is also what makes trusting the
      # gateway's X-Forwarded-For in the Caddyfile safe.
      - "127.0.0.1:8080:80"
    volumes:
      # The Caddyfile is baked into the image (see edge.Dockerfile) — not
      # mounted: a config change arrives as a new image (new content tag) and
      # recreates the edge.
      - caddy-data:/data       # Caddy runtime state (no certs — TLS is the host nginx's)
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      # `default` only: reaches web/backend, and keeps both the edge's own IP
      # and its loopback-port gateway (172.29.0.1) inside 172.29.0.0/24, so
      # TRUSTED_PROXY_CIDRS matches.
      - default

volumes:
  # The data (see DATA SAFETY above). Prefixed `prod-` so they can never be
  # confused with the dev file's `postgres-data` / `minio-data` — both files
  # declare `name: mebel-pro`, so the names would otherwise collide.
  prod-postgres-data:
  prod-minio-data:
  caddy-data:
  caddy-config:

networks:
  # Pinned subnet so TRUSTED_PROXY_CIDRS (backend env above) can trust the
  # edge's X-Forwarded-For deterministically, and the Caddyfile can trust the
  # gateway (172.29.0.1) the host nginx arrives from. If you change one,
  # change all three.
  # Before the first deploy, confirm the subnet is free on the VPS:
  #   docker network inspect $(docker network ls -q) | grep 172.29
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
