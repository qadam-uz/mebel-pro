# Dev stack — standalone, self-contained. Runs everything on the host:
# local Postgres + local MinIO + backend (autoreload) + web (Vite dev server).
#
# Usage from this directory (`deploy/`):
#
#   docker compose up --build                          # full stack with HMR
#   docker compose up -d postgres minio createbuckets  # data services only
#   docker compose logs -f backend
#   docker compose down                                # add -v to drop volumes
#
# Build contexts are `../backend` and `../web`; env comes from `deploy/.env`
# (copy `.env.dev.example`). For production use `compose.prod.yaml` — these files
# are deliberately NOT overlays, they are two separate stacks; keep service
# names and env-var names consistent so the contract for `backend` and `web`
# stays the same in both.

name: mebel-pro

services:
  # Local Postgres for development. In prod the backend connects to the
  # shared Postgres on the external `infra-net` network instead — see
  # `compose.prod.yaml`.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mebel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mebel}
      POSTGRES_DB: ${POSTGRES_DB:-mebel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mebel} -d ${POSTGRES_DB:-mebel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  # Local MinIO. The container's `MINIO_ROOT_USER` / `MINIO_ROOT_PASSWORD`
  # (the env-var names MinIO insists on for its admin creds) are wired to the
  # same MINIO_ACCESS_KEY_ID / MINIO_SECRET_ACCESS_KEY the backend uses — one
  # set of creds in .env.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-mebel}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-mebel-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console (http://localhost:9001)

  # One-shot: ensure the bucket exists, then exit. `Exited (0)` is success.
  createbuckets:
    image: minio/mc:RELEASE.2024-01-18T07-03-39Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY_ID:-mebel} ${MINIO_SECRET_ACCESS_KEY:-mebel-secret} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-mebel}
      "
    restart: "no"

  # Backend, source-mounted, autoreload. Python deps live in the image's
  # system interpreter (see ../backend/Dockerfile), outside /app, so the
  # source bind-mount can't shadow them. A pyproject/uv.lock change reaches
  # the container via `up --build` — no volume to go stale.
  #
  # `cutting-engine` is the one deliberate exception: dev mounts the sibling
  # checkout (`CUTTING_ENGINE_SRC`, default `../../cutting-engine`) at
  # /opt/cutting-engine and puts its `src/` first on PYTHONPATH, so local engine
  # work is exercised by the running API without cutting a PyPI release. The
  # image's pinned wheel stays installed and takes over automatically whenever
  # no checkout is mounted. Prod (compose.prod.yaml) never mounts it — there the
  # pinned wheel from uv.lock is the only engine.
  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENV: dev
      DEBUG: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mebel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mebel}
      POSTGRES_DB: ${POSTGRES_DB:-mebel}
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID:-mebel}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY:-mebel-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-mebel}
      MINIO_USE_SSL: "false"
      DOCS_DIR: /docs
      DOCS_AUTH_USERNAME: ${DOCS_AUTH_USERNAME:-docs}
      DOCS_AUTH_PASSWORD: ${DOCS_AUTH_PASSWORD:-docs}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_API_TIMEOUT_SECONDS: ${TELEGRAM_API_TIMEOUT_SECONDS:-5}
      TELEGRAM_LOGIN_CODE_PEPPER: ${TELEGRAM_LOGIN_CODE_PEPPER:-dev-telegram-login-code-pepper-change-in-prod}
      TELEGRAM_LOGIN_DEV_MODE: ${TELEGRAM_LOGIN_DEV_MODE:-true}
      ALLOW_PROD_TELEGRAM_LOGIN_DEV_MODE: ${ALLOW_PROD_TELEGRAM_LOGIN_DEV_MODE:-false}
      TELEGRAM_LOGIN_RATE_LIMITS_ENABLED: ${TELEGRAM_LOGIN_RATE_LIMITS_ENABLED:-true}
      TELEGRAM_LOGIN_TOKENS_PER_IP_PER_HOUR: ${TELEGRAM_LOGIN_TOKENS_PER_IP_PER_HOUR:-30}
      TELEGRAM_LOGIN_TOKENS_PER_IP_PER_DAY: ${TELEGRAM_LOGIN_TOKENS_PER_IP_PER_DAY:-100}
      TELEGRAM_LOGIN_CODE_REDEEMS_PER_IP: ${TELEGRAM_LOGIN_CODE_REDEEMS_PER_IP:-10}
      TELEGRAM_LOGIN_CODE_REDEEM_WINDOW_SECONDS: ${TELEGRAM_LOGIN_CODE_REDEEM_WINDOW_SECONDS:-60}
      CLIENT_APP_BASE_URL: ${CLIENT_APP_BASE_URL:-http://localhost:5173}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-["127.0.0.1/32","::1/128"]}
      # Ahead of site-packages, so a mounted cutting-engine checkout wins over
      # the image's pinned wheel. A missing directory is ignored by Python.
      PYTHONPATH: /opt/cutting-engine/src
    # `fastapi dev` is uvicorn with autoreload, but it watches only the working
    # directory — an edit under the mounted engine would need a manual restart.
    # Call uvicorn directly instead so the engine checkout is watched too, and
    # leave that reload dir out when nothing is mounted there.
    command:
      - sh
      - -c
      - |
        set -e
        alembic upgrade head
        reload_dirs="--reload-dir /app"
        if [ -d /opt/cutting-engine/src ]; then
          reload_dirs="$$reload_dirs --reload-dir /opt/cutting-engine/src"
        fi
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload $$reload_dirs
    volumes:
      - ../backend:/app
      - ../docs:/docs:ro
      - ${CUTTING_ENGINE_SRC:-../../cutting-engine}:/opt/cutting-engine:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Dev frontend: Vite dev server (HMR). Not built — runs the node image and
  # `pnpm dev` against the source bind-mount.
  web:
    image: node:22-slim
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    command: ["sh", "-c", "corepack enable && pnpm install && pnpm dev --host 0.0.0.0 --port 5173"]
    environment:
      # Dev-server proxy target: the backend service on the compose network
      # (Vite runs inside this container, so localhost would point at itself).
      API_PROXY_TARGET: "http://backend:8000"
    volumes:
      - ../web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  minio-data:
  web-node-modules:
