# Base stack: Postgres + MinIO + backend (FastAPI) + web (built SPA behind nginx).
#
#   Dev   : `docker compose up`                       (adds compose.override.yaml automatically)
#   Prod  : `docker compose -f compose.yaml -f compose.prod.yaml up -d`
#
# Run from this directory (deploy/). Build contexts are ../backend and ../web.
# Environment comes from `.env` in this directory — copy `.env.example`.

name: mebel-pro

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mebel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mebel}
      POSTGRES_DB: ${POSTGRES_DB:-mebel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mebel} -d ${POSTGRES_DB:-mebel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object store for the `files` module (material images, logos,
  # receipts, cutting PDFs). Pin a known-good RELEASE tag — bump deliberately.
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mebel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-mebel}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket the backend expects, then exit.
  createbuckets:
    image: minio/mc:RELEASE.2024-01-18T07-03-39Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-mebel} ${MINIO_ROOT_PASSWORD:-mebel} &&
      mc mb --ignore-existing local/${S3_BUCKET:-mebel}
      "
    restart: "no"

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENV: ${ENV:-prod}
      DEBUG: ${DEBUG:-false}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-mebel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mebel}
      POSTGRES_DB: ${POSTGRES_DB:-mebel}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-mebel}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-mebel}
      S3_BUCKET: ${S3_BUCKET:-mebel}
      S3_USE_SSL: "false"
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:5173"]}
      DOCS_AUTH_USERNAME: ${DOCS_AUTH_USERNAME:-docs}
      DOCS_AUTH_PASSWORD: ${DOCS_AUTH_PASSWORD:-docs}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ../web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres-data:
  minio-data:
