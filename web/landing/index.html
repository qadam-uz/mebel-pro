<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Mebel Pro — o'lchamga kesilgan mebel panellari uchun onlayn platforma. Tez orada ishga tushadi." />
  <meta name="theme-color" content="#FAF7F2" />
  <meta property="og:title" content="Mebel Pro — tez orada" />
  <meta property="og:description"
    content="O'lchamga kesilgan mebel panellari — onlayn buyurtma. Birinchi reliz ustida ishlamoqdamiz." />
  <meta property="og:type" content="website" />
  <title>Mebel Pro — tez orada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #faf7f2;
      --elev: #ffffff;
      --sunk: #f2eee6;
      --ink-12: #1a1614;
      --ink-10: #3f362f;
      --ink-8: #5c4f44;
      --ink-6: #847569;
      --line: #e5ddd0;
      --accent: #a6471f;
      --accent-tint: #f4e5dc;
      --success: #2e5e4e;
      --f-display: 'Source Serif 4', 'Charter', 'Iowan Old Style', Georgia, serif;
      --f-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --f-mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink-12);
      font-family: var(--f-ui);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    .page {
      position: relative;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px 24px;
      overflow: hidden;
    }

    .grid-decor {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 14px;
      padding: 6vw;
      opacity: 0.35;
      pointer-events: none;
    }

    .grid-decor span {
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .grid-decor span:nth-child(3n) {
      border-color: var(--accent-tint);
    }

    .hero {
      position: relative;
      z-index: 1;
      width: min(100%, 680px);
      text-align: center;
    }

    .mark {
      width: 60px;
      height: 60px;
      margin: 0 auto 22px;
      display: block;
    }

    .mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .eyebrow {
      display: inline-block;
      font: 600 11.5px var(--f-ui);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--accent);
      background: var(--accent-tint);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    h1.word {
      font-family: var(--f-display);
      font-weight: 600;
      font-size: clamp(40px, 9vw, 76px);
      letter-spacing: -0.025em;
      color: var(--ink-12);
      margin: 0 0 16px;
      line-height: 1.05;
    }

    .lead {
      font-family: var(--f-display);
      font-size: clamp(17px, 3.4vw, 22px);
      color: var(--ink-10);
      margin: 0 auto;
      max-width: 32ch;
    }

    .count-wrap {
      margin: 34px auto 0;
    }

    .count-label {
      font: 500 12px var(--f-ui);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-6);
      margin-bottom: 12px;
    }

    .count {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .unit {
      background: var(--elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 8px 10px;
      min-width: 78px;
    }

    .unit .n {
      font-family: var(--f-mono);
      font-weight: 700;
      font-size: clamp(26px, 6vw, 34px);
      color: var(--ink-12);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .unit .l {
      font: 500 11px var(--f-ui);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-6);
      margin-top: 8px;
    }

    .launched {
      font-family: var(--f-display);
      font-size: 20px;
      color: var(--success);
    }

    .foot {
      position: relative;
      z-index: 1;
      margin-top: 48px;
      font: 500 12px var(--f-mono);
      color: var(--ink-6);
    }

    @media (max-width: 640px) {
      .grid-decor {
        gap: 10px;
        padding: 10vw 7vw;
      }

      .unit {
        min-width: 64px;
        flex: 1;
      }
    }

    @media (max-width: 380px) {
      .count {
        gap: 8px;
      }

      .unit {
        padding: 12px 4px 8px;
        min-width: 0;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="grid-decor" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <section class="hero">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="mpg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#A6471F" />
              <stop offset="1" stop-color="#8C3814" />
            </linearGradient>
          </defs>
          <g fill="url(#mpg)">
            <rect x="2" y="2" width="11.6" height="28" rx="2.2" />
            <rect x="16" y="2" width="14" height="12.6" rx="2.2" />
            <rect x="16.4" y="17.4" width="13" height="12" rx="2.2" transform="rotate(-3.5 22.9 23.4)" />
          </g>
        </svg>
      </div>
      <span class="eyebrow">Tez orada</span>
      <h1 class="word">Mebel Pro</h1>
      <p class="lead">Mebel va yog'och panellarini kesish ishlarini tizimlashtiruvchi yangi platforma</p>

      <div class="count-wrap">
        <div class="count-label">Birinchi relizgacha</div>
        <div class="count" id="count">
          <div class="unit">
            <div class="n" data-k="d">—</div>
            <div class="l">kun</div>
          </div>
          <div class="unit">
            <div class="n" data-k="h">—</div>
            <div class="l">soat</div>
          </div>
          <div class="unit">
            <div class="n" data-k="m">—</div>
            <div class="l">daqiqa</div>
          </div>
          <div class="unit">
            <div class="n" data-k="s">—</div>
            <div class="l">soniya</div>
          </div>
        </div>
        <div class="launched" id="launched" hidden>Platforma ishga tushdi.</div>
      </div>

    </section>

    <footer class="foot">© 2026 Mebel Pro · Toshkent, O'zbekiston</footer>
  </main>

  <script>
    // First release target.
    var TARGET = new Date(2026, 5, 15, 0, 0, 0).getTime()
    var pad = function (n) {
      return String(n).padStart(2, '0')
    }
    function tick() {
      var diff = TARGET - Date.now()
      if (diff <= 0) {
        document.getElementById('count').hidden = true
        document.getElementById('launched').hidden = false
        return
      }
      var s = Math.floor(diff / 1000)
      var set = function (k, v) {
        document.querySelector('[data-k="' + k + '"]').textContent = v
      }
      set('d', String(Math.floor(s / 86400)))
      set('h', pad(Math.floor((s % 86400) / 3600)))
      set('m', pad(Math.floor((s % 3600) / 60)))
      set('s', pad(s % 60))
    }
    tick()
    setInterval(tick, 1000)
  </script>
</body>

</html>
