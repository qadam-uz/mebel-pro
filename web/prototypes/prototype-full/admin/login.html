<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kirish — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
</head>
<body>
<div class="auth-wrap">
  <!-- ===== Sign-in ===== -->
  <div class="auth-card" id="card-login">
    <span class="brand">
      <span class="mk">M</span>
      <span style="font-family:var(--f-display);font-size:19px;font-weight:600">Mebel Pro<small style="display:block;font-family:var(--f-ui);font-size:11px;color:var(--ink-6);font-weight:500;letter-spacing:.04em;text-transform:uppercase">Superadmin</small></span>
    </span>
    <h1>Operator paneliga kirish</h1>
    <p class="sub">Bu panel platforma operatorlari uchun.</p>

    <div class="lockout" id="lockout" hidden></div>
    <div class="err-msg" id="login-err" hidden>Login yoki parol noto'g'ri.</div>

    <form onsubmit="doLogin(event)" novalidate>
      <div class="field"><label>Login</label><input id="lg-login" value="nuriddin" autocomplete="username" required /></div>
      <div class="field"><label>Parol</label><input id="lg-pass" type="password" placeholder="••••••••" autocomplete="current-password" required /></div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" id="lg-btn">Kirish</button>
    </form>

    <div class="meta">
      Platforma operatorlari backend CLI orqali yaratiladi (chicken-and-egg).<br>
      5 ta noto'g'ri urinishdan keyin 15 daqiqaga bloklanadi.
    </div>
  </div>
</div>

<script src="../assets/app.js"></script>
<script>
// Demo: ?locked=1 shows lockout. Empty/"temp" password logs in with a
// non-blocking password-reset warning in the app shell.
const qp = new URLSearchParams(location.search);
let attempts = 0;
let lockedUntil = null;

if (qp.get('locked') === '1') { lock(); }

function lock() {
  const until = new Date(Date.now() + 15 * 60 * 1000);
  lockedUntil = until;
  const hh = String(until.getHours()).padStart(2, '0');
  const mm = String(until.getMinutes()).padStart(2, '0');
  const el = document.getElementById('lockout');
  el.textContent = `Juda ko'p urinish. ${hh}:${mm} da qayta urinib ko'ring.`;
  el.hidden = false;
  document.getElementById('lg-btn').disabled = true;
}
function doLogin(e) {
  e.preventDefault();
  if (lockedUntil && lockedUntil > new Date()) return;
  const pass = document.getElementById('lg-pass').value;
  // Demo auth: empty/"temp" → password-reset warning; "wrong" → generic error.
  if (!pass || pass.toLowerCase() === 'temp') {
    document.getElementById('login-err').hidden = true;
    toast('Vaqtinchalik parol qabul qilindi');
    try { sessionStorage.setItem('mp.admin.password-reset-required', '1'); } catch (_) {}
    setTimeout(() => location.href = 'dashboard.html?reset=1', 500);
    return;
  }
  if (pass.toLowerCase() === 'wrong') {
    attempts++;
    document.getElementById('login-err').hidden = false;
    if (attempts >= 5) lock();
    return;
  }
  document.getElementById('login-err').hidden = true;
  toast('Kirildi');
  setTimeout(() => location.href = 'dashboard.html', 600);
}
</script>
</body>
</html>
