<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Manufacturerlar — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Manufacturerlar</h1>
        <p class="sub">Material identity ishlab chiqaruvchi bilan birga yuradi. Yangi brand avval shu yerda ochiladi.</p>
      </div>
      <div class="tools">
        <button class="btn btn-acc" type="button" onclick="openMfr(null)"><i class="ic" data-icon="plus"></i> Manufacturer</button>
      </div>
    </div>

    <div class="filters">
      <label class="filter-label" for="q">Qidirish</label>
      <div class="input"><input id="q" aria-label="Manufacturer nomi" placeholder="Manufacturer nomi..." oninput="render()" /></div>
      <label class="filter-label" for="country-filter">Country</label>
      <mp-select id="country-filter" onchange="cFilter = this.value; render()"></mp-select>
      <label class="filter-label" for="status-filter">Holat</label>
      <mp-select id="status-filter" onchange="sFilter = this.value; render()">
        <option value="all">Hammasi</option>
        <option value="active">Faol</option>
        <option value="inactive">Faol emas</option>
      </mp-select>
    </div>

    <div id="page-body"></div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal" id="m-mfr" aria-labelledby="mfr-title">
  <div class="modal-h"><h3 id="mfr-title">Yangi manufacturer</h3><button class="x" data-close-modal="m-mfr" aria-label="Yopish"><i class="ic" data-icon="x"></i></button></div>
  <div class="modal-b">
    <div class="field">
      <label for="f-name">Nomi</label>
      <input id="f-name" placeholder="Egger" data-initial-focus />
    </div>
    <div class="field">
      <label for="f-country">Country</label>
      <input id="f-country" placeholder="Austria" />
    </div>
    <div class="field">
      <label for="f-note">Izoh (ixtiyoriy)</label>
      <textarea id="f-note" rows="3" placeholder="LDSP · asosiy brand"></textarea>
    </div>
  </div>
  <div class="modal-f">
    <button class="btn btn-outline" data-close-modal="m-mfr">Bekor</button>
    <button class="btn btn-acc" type="button" id="mfr-save" onclick="saveMfr()">Yaratish</button>
  </div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

const body = document.getElementById('page-body');
const state = demoState();
let sFilter = 'all', cFilter = 'all', editing = null;

const materialCount = mfrId => SEED.materials.filter(m => m.manufacturerId === mfrId).length;

function countries() {
  return [...new Set(SEED.manufacturers.map(m => m.country).filter(Boolean))].sort();
}

function renderCountryFilter() {
  const sel = document.getElementById('country-filter');
  const current = cFilter;
  sel.innerHTML = `<option value="all">Country · hammasi</option>` +
    countries().map(c => `<option value="${c}">${c}</option>`).join('');
  sel.value = current;
}

function render() {
  renderCountryFilter();
  if (state === 'loading') {
    body.innerHTML = `<div class="card"><table class="tbl"><thead><tr><th>Manufacturer</th><th>Country</th><th class="right">Materiallar</th><th>Holat</th><th>Izoh</th><th></th></tr></thead><tbody>${skRows(6, 5)}</tbody></table></div>`;
    return;
  }
  if (state === 'error') {
    body.innerHTML = errState('Manufacturerlar ro\'yxatini yuklab bo\'lmadi.', 'tr-8d41a0');
    return;
  }
  const q = (document.getElementById('q')?.value || '').toLowerCase();
  const rows = SEED.manufacturers.filter(m =>
    (sFilter === 'all' || m.status === sFilter) &&
    (cFilter === 'all' || m.country === cFilter) &&
    (!q || m.name.toLowerCase().includes(q) || (m.country || '').toLowerCase().includes(q)));

  if (!rows.length) {
    body.innerHTML = emptyState('factory', 'Manufacturer topilmadi', 'Filtr yoki qidiruvni o\'zgartiring. Yangi materialdan oldin manufacturer qo\'shiladi.');
    return;
  }

  body.innerHTML = `<div class="card"><table class="tbl">
    <thead><tr><th>Manufacturer</th><th>Country</th><th class="right">Materiallar</th><th>Holat</th><th>Izoh</th><th></th></tr></thead>
    <tbody>${rows.map(m => `<tr>
      <td class="nm">${m.name}<small>${m.id}</small></td>
      <td>${m.country || '<span class="muted">—</span>'}</td>
      <td class="amt">${materialCount(m.id)}</td>
      <td>${m.status === 'active' ? '<span class="pill p-ok"><span class="pd"></span>Faol</span>' : '<span class="pill p-dn"><span class="pd"></span>Faol emas</span>'}</td>
      <td><small style="color:var(--ink-8)">${m.note || '—'}</small></td>
      <td class="menu-cell">
        <div class="menu-wrap">
          <button class="menu-btn" type="button" data-menu-toggle aria-label="${m.name} amallari"><i data-icon="more-horizontal"></i></button>
          <div class="menu" role="menu">
            <button class="mi" type="button" onclick="openMfr('${m.id}')"><i data-icon="edit"></i> Tahrirlash</button>
            ${m.status === 'active'
              ? `<button class="mi danger" type="button" onclick="confirmAction({title:'Manufacturerni faol emas qilish',msg:'${m.name} yangi material yaratish pickeridan yashiriladi. Mavjud materiallar history sifatida saqlanadi.',okText:'Faol emas qilish',danger:true},()=>toast('Faol emas qilindi · ${m.name}'))"><i data-icon="ban"></i> Faol emas qilish</button>`
              : `<button class="mi" type="button" onclick="confirmAction({title:'Manufacturerni faollashtirish',msg:'${m.name} yana yangi materiallar uchun ochiladi.',okText:'Faollashtirish'},()=>toast('Faollashtirildi · ${m.name}'))"><i data-icon="check-circle"></i> Faollashtirish</button>`}
            <div class="sep"></div>
            <a class="mi" href="materials.html"><i data-icon="package"></i> Materiallarni ko'rish</a>
          </div>
        </div>
      </td>
    </tr>`).join('')}</tbody></table></div>`;
}

function openMfr(id) {
  editing = id ? SEED.manufacturers.find(m => m.id === id) : null;
  document.getElementById('mfr-title').textContent = editing ? 'Manufacturer tahrirlash' : 'Yangi manufacturer';
  document.getElementById('mfr-save').textContent = editing ? 'Saqlash' : 'Yaratish';
  document.getElementById('f-name').value = editing?.name || '';
  document.getElementById('f-country').value = editing?.country || '';
  document.getElementById('f-note').value = editing?.note || '';
  openModal('m-mfr');
}

function saveMfr() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('Manufacturer nomi kerak', 'warn'); document.getElementById('f-name').focus(); return; }
  if (editing) {
    editing.name = name;
    editing.country = document.getElementById('f-country').value.trim();
    editing.note = document.getElementById('f-note').value.trim();
  } else {
    SEED.manufacturers.push({
      id: 'mfr-' + name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Math.random().toString(36).slice(2, 5),
      name,
      country: document.getElementById('f-country').value.trim(),
      note: document.getElementById('f-note').value.trim(),
      status: 'active'
    });
  }
  closeModal('m-mfr');
  toast((editing ? 'Saqlandi · ' : 'Yaratildi · ') + name);
  editing = null;
  render();
}

render();
</script>
</body>
</html>
