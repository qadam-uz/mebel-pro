<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Asosiy — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Platforma asosiy</h1>
        <div class="date">Loyiha kuni · <b>19-may 2026</b> · platforma sog'ligi va insidentlar</div>
      </div>
      <div class="tools">
        <button class="btn btn-ghost btn-sm" type="button" onclick="toast('Yangilandi')"><i class="ic" data-icon="refresh"></i> Yangilash</button>
      </div>
    </div>

    <div id="page-body"></div>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

const body = document.getElementById('page-body');
const state = demoState();

if (state === 'loading') {
  body.innerHTML = `
    <div class="kpis">${'<div class="kpi"><div class="sk-line w-60"></div><div class="sk" style="height:34px;width:70%;margin:10px 0"></div><div class="sk-line w-80"></div></div>'.repeat(4)}</div>
    <div class="card"><div class="card-b" style="padding:22px">${'<div class="sk-line"></div>'.repeat(6)}</div></div>`;
} else if (state === 'error') {
  body.innerHTML = errState('Platforma ko\'rsatkichlarini yuklab bo\'lmadi.', 'tr-9f2a4c');
} else {
  // ---- Health counts only — NO money / revenue anywhere (OQ4) ----
  const ws = SEED.workshops;
  const activeWs = ws.filter(w => w.status === 'active').length;
  const blockedWs = ws.filter(w => w.status === 'blocked').length;
  const totalBranches = ws.reduce((a, w) => a + (w.branches || 0), 0);
  const totalClients = SEED.clients.length;
  const failedJobs = SEED.jobs.filter(j => j.lastResult === 'failed');
  const openErrors = SEED.errors.filter(e => !e.resolved);
  const err24h = SEED.errors.reduce((a, e) => a + e.count24h, 0);

  body.innerHTML = `
    <div class="kpis">
      <div class="kpi" onclick="location.href='workshops.html'">
        <div class="lbl">Faol ustaxonalar</div>
        <div class="v num">${activeWs} <small>/ ${ws.length}</small></div>
        <div class="d"><span class="muted">${blockedWs} bloklangan</span><a href="workshops.html" style="color:var(--accent);font-weight:600;text-decoration:none">ro'yxat <i class="ic" data-icon="arrow-right"></i></a></div>
      </div>
      <div class="kpi">
        <div class="lbl">Filiallar · mijozlar</div>
        <div class="v num">${totalBranches} <small>filial</small></div>
        <div class="d"><span class="muted">${totalClients} mijoz platformada</span></div>
      </div>
      <div class="kpi ${err24h > 10 ? 'warn' : ''}" onclick="location.href='errors.html'">
        <div class="lbl">Xatoliklar · 24 soat</div>
        <div class="v num" ${err24h > 10 ? 'style="color:var(--warn)"' : ''}>${err24h}</div>
        <div class="d"><span class="${err24h > 10 ? 'warn' : 'muted'}"><b>${openErrors.length} ta</b> ochiq kod</span><a href="errors.html" style="color:var(--accent);font-weight:600;text-decoration:none">monitor <i class="ic" data-icon="arrow-right"></i></a></div>
      </div>
      <div class="kpi ${failedJobs.length ? 'bad' : ''}" onclick="location.href='jobs.html'">
        <div class="lbl">Background ish</div>
        <div class="v num ${failedJobs.length ? 'danger-text' : ''}">${failedJobs.length} <small>failed</small></div>
        <div class="d"><span class="${failedJobs.length ? 'danger-text' : 'muted'}"><b>${failedJobs[0]?.name || 'hammasi ok'}</b></span><a href="jobs.html" style="color:var(--accent);font-weight:600;text-decoration:none">ko'rish <i class="ic" data-icon="arrow-right"></i></a></div>
      </div>
    </div>

    <div class="two-col">
      <div style="display:flex;flex-direction:column;gap:18px">
        <div class="card">
          <div class="card-h"><h2>So'nggi ustaxonalar</h2><a class="more" href="workshops.html">hammasi <i class="ic" data-icon="arrow-right"></i></a></div>
          <div class="card-b" style="padding:0 22px 18px">
            <table class="tbl">
              <thead><tr><th>Ustaxona</th><th>Egasi</th><th>Filial</th><th>Yaratildi</th><th>Holat</th></tr></thead>
              <tbody id="ws-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:18px">
        ${failedJobs.length ? `
        <div class="card">
          <div class="card-h"><h2>Failed ish</h2><a class="more" href="jobs.html">hammasi <i class="ic" data-icon="arrow-right"></i></a></div>
          <div class="card-b" style="padding-top:0">
            <div class="banner danger"><div class="ic"><i data-icon="alert"></i></div><div class="grow"><b>${failedJobs[0].name}</b> · ${failedJobs[0].lastRun}</div></div>
            <p style="margin:8px 0 12px;font-size:12.5px;color:var(--ink-8)">${failedJobs[0].error || failedJobs[0].summary}</p>
            <button class="btn btn-acc btn-block" type="button" onclick="confirmAction({title:'Ishni qaytadan ishga tushirish',msg:'${failedJobs[0].name} ishi qo\\'lda qayta ishga tushiriladi.',okText:'Ishga tushirish'},()=>toast('Ish boshlandi'))"><i class="ic" data-icon="refresh"></i> Qaytadan ishga tushirish</button>
          </div>
        </div>` : ''}

        <div class="card">
          <div class="card-h"><h2>So'nggi xatoliklar</h2><a class="more" href="errors.html">monitor <i class="ic" data-icon="arrow-right"></i></a></div>
          <div class="card-b" style="padding-top:0" id="err-body"></div>
        </div>
      </div>
    </div>`;

  document.getElementById('ws-body').innerHTML = ws.slice().reverse().slice(0, 5).map(w => `
    <tr class="clickable" onclick="location.href='workshop-detail.html?id=${w.id}'">
      <td class="nm">${w.name}</td>
      <td><small style="color:var(--ink-6)">${w.ownerName}</small></td>
      <td class="num">${w.branches}</td>
      <td class="num" style="font-size:11.5px;color:var(--ink-6)">${w.createdOn}</td>
      <td>${w.status === 'active' ? '<span class="pill p-ok"><span class="pd"></span>Faol</span>' : `<span class="pill p-bad"><span class="pd"></span>Bloklangan</span>`}</td>
    </tr>`).join('');

  document.getElementById('err-body').innerHTML = SEED.errors.map(e => `
    <a class="row-item clickable" style="text-decoration:none;color:inherit" href="errors.html?code=${e.code}">
      <div><div class="nm">${e.code} ${e.spike ? '<span class="pill p-bad" style="font-size:9.5px;margin-left:4px"><span class="pd"></span>spike</span>' : ''}</div><small style="color:var(--ink-6)">${e.module} · ${e.count24h} ta 24 soatda${e.resolved ? ' · tasdiqlangan' : ''}</small></div>
      <div class="meta ${e.count24h > 10 ? 'warn-text' : ''}">${e.count24h}</div>
    </a>`).join('');
}
</script>
</body>
</html>
