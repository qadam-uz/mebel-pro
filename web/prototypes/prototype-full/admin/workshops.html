<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ustaxonalar — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Ustaxonalar</h1>
        <p class="sub">Platformada ro'yxatdan o'tgan barcha ustaxonalar.</p>
      </div>
      <div class="tools">
        <button class="btn btn-acc" type="button" onclick="openModal('m-new')">+ Yangi ustaxona</button>
      </div>
    </div>

    <div class="filters" id="filters" hidden>
      <div class="input"><input id="q" placeholder="Ustaxona nomi yoki egasi..." oninput="render()" /></div>
      <div class="chips" id="status-chips">
        <button class="chip on" data-st="all">Hammasi</button>
        <button class="chip" data-st="active">Faol</button>
        <button class="chip" data-st="blocked">Bloklangan</button>
      </div>
    </div>

    <div id="page-body"></div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal wide" id="m-new">
  <div class="modal-h"><h3>Yangi ustaxona + egasi · atomik yaratish</h3><button class="x" data-close-modal="m-new">✕</button></div>
  <div class="modal-b">
    <h4 style="font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-6);margin:0 0 10px">Ustaxona ma'lumotlari</h4>
    <div class="field-row">
      <div class="field"><label>Ustaxona nomi</label><input id="w-name" placeholder="Furniture House" /></div>
      <div class="field"><label>Telefon</label><input placeholder="+998 71 ..." /></div>
    </div>
    <div class="field"><label>Manzil</label><input placeholder="Toshkent, ..." /></div>

    <h4 style="font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-6);margin:20px 0 10px">Egasi (atomik yaratiladi · is_owner)</h4>
    <div class="field-row">
      <div class="field"><label>F.I.O</label><input id="o-name" placeholder="Hasan Karimov" /></div>
      <div class="field"><label>Telefon</label><input placeholder="+998 90 ..." /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Login</label><input id="o-login" placeholder="hasan" /></div>
      <div class="field"><label>Vaqtinchalik parol</label>
        <div style="display:flex;gap:8px">
          <input id="o-pass" value="TempPass2026!" style="flex:1" />
          <button class="btn btn-outline btn-sm" type="button" onclick="document.getElementById('o-pass').value=genTempPassword();toast('Parol qayta yaratildi')">↻ Qayta</button>
          <button class="btn btn-outline btn-sm" type="button" onclick="navigator.clipboard?.writeText(document.getElementById('o-pass').value).then(()=>toast('Nusxalandi'))">Nusxa</button>
        </div>
      </div>
    </div>
    <div class="banner info"><div class="ic">i</div><div class="grow">Parol yaratilgandan keyin bir marta ko'rsatiladi (force_password_change yoqilgan). Egasi birinchi kirishda parol o'rnatadi.</div></div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal="m-new">Bekor</button><button class="btn btn-acc" type="button" onclick="createWorkshop()">Yaratish</button></div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

const body = document.getElementById('page-body');
const state = demoState();
let stFilter = 'all';

function render() {
  if (state === 'loading') {
    body.innerHTML = `<div class="card"><table class="tbl"><thead><tr><th>Ustaxona</th><th>Egasi</th><th>Filial</th><th>Buyurtma · 30 kun</th><th>Yaratildi</th><th>Holat</th><th></th></tr></thead><tbody>${skRows(7, 5)}</tbody></table></div>`;
    return;
  }
  if (state === 'error') { body.innerHTML = errState('Ustaxonalar ro\'yxatini yuklab bo\'lmadi.', 'tr-1a77e0'); return; }

  document.getElementById('filters').hidden = false;
  const q = (document.getElementById('q')?.value || '').toLowerCase();
  let rows = SEED.workshops.filter(w =>
    (stFilter === 'all' || w.status === stFilter) &&
    (!q || w.name.toLowerCase().includes(q) || w.ownerName.toLowerCase().includes(q)));

  if (!rows.length) {
    body.innerHTML = emptyState('▥', 'Ustaxona topilmadi', 'Filtr yoki qidiruvni o\'zgartirib ko\'ring.');
    return;
  }

  body.innerHTML = `<div class="card"><table class="tbl">
    <thead><tr><th>Ustaxona</th><th>Egasi</th><th>Filial</th><th>Buyurtma · 30 kun</th><th>Yaratildi</th><th>Holat</th><th></th></tr></thead>
    <tbody>${rows.map(w => `
      <tr class="clickable" onclick="location.href='workshop-detail.html?id=${w.id}'">
        <td><div style="display:flex;align-items:center;gap:11px"><div style="width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,#A6471F,#8C3814);color:#fff;font:700 13px/1 var(--f-display);display:grid;place-items:center">${w.mk}</div><div class="nm">${w.name}</div></div></td>
        <td><div class="nm" style="font-weight:500">${w.ownerName}<small style="color:var(--ink-6);font:400 11px var(--f-mono)">${w.ownerPhone}</small></div></td>
        <td>${w.branches}</td>
        <td class="num">${w.orders30d}</td>
        <td class="num" style="font-size:11.5px;color:var(--ink-6)">${w.createdOn}</td>
        <td>${w.status === 'active' ? '<span class="pill p-ok"><span class="pd"></span>Faol</span>' : `<span class="pill p-bad"><span class="pd"></span>Bloklangan</span>`}</td>
        <td onclick="event.stopPropagation()">
          <div class="menu-wrap">
            <button class="menu-btn" data-menu-toggle aria-label="Amallar">⋯</button>
            <div class="menu" role="menu">
              <a class="mi" href="workshop-detail.html?id=${w.id}">Tafsilotlar</a>
              ${w.status === 'active'
                ? `<button class="mi danger" onclick="confirmAction({title:'Ustaxonani bloklash',msg:'Egasi va xodimlar sessiyalari darhol yopiladi va keyingi kirish rad etiladi. Ochiq buyurtmalar muzlatiladi (xodimlar kira olmaydi). Mijozlarga ta\\'sir qilmaydi.',reasonField:true,reasonLabel:'Bloklash sababi',danger:true,okText:'Bloklash'},()=>toast('${w.name} bloklandi','danger'))">Bloklash</button>`
                : `<button class="mi" onclick="confirmAction({title:'Ustaxonani blokdan chiqarish',msg:'Sessiyalar TIKLANMAYDI — egasi va xodimlar qaytadan kirishlari kerak. Buyurtmalar yana harakatlanadi.',okText:'Blokdan chiqarish'},()=>toast('${w.name} blokdan chiqarildi'))">Blokdan chiqarish</button>`}
            </div>
          </div>
        </td>
      </tr>`).join('')}</tbody></table></div>`;
}

document.getElementById('status-chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  document.querySelectorAll('#status-chips .chip').forEach(c => c.classList.remove('on'));
  b.classList.add('on');
  stFilter = b.dataset.st;
  render();
});

function createWorkshop() {
  const wn = document.getElementById('w-name').value || 'Yangi ustaxona';
  const ol = document.getElementById('o-login').value || 'egasi';
  const op = document.getElementById('o-pass').value;
  closeModal('m-new');
  setTimeout(() => showSecret({
    title: `${wn} yaratildi`,
    note: 'Quyidagi ma\'lumot faqat bir marta ko\'rsatiladi — egasiga yetkazib bering.',
    rows: [
      { k: 'Ustaxona', v: wn },
      { k: 'Egasi login', v: ol },
      { k: 'Vaqtinchalik parol', v: op }
    ],
    hint: 'Egasi birinchi kirishda yangi parol o\'rnatadi (force_password_change).'
  }), 240);
}

render();
</script>
</body>
</html>
