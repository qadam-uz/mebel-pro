<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Xatolik monitor — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Xatolik monitor</h1>
        <p class="sub">Application errorlar, kod bo'yicha guruhlanadi · spike bo'lganda operatorga ogohlantirish keladi.</p>
      </div>
    </div>

    <div class="filters" id="filters" hidden>
      <select id="f-mod" onchange="render()"><option value="all">Hamma modullar</option><option>orders</option><option>inventory</option><option>cutting</option><option>identity</option></select>
      <select id="f-thr" onchange="render()">
        <option value="0">Har qanday count</option>
        <option value="3">24 soat ≥ 3</option>
        <option value="10">24 soat ≥ 10</option>
      </select>
      <div class="chips" id="r-chips">
        <button class="chip on" data-r="all">Hammasi</button>
        <button class="chip" data-r="open">Ochiq</button>
        <button class="chip" data-r="resolved">Tasdiqlangan</button>
      </div>
    </div>

    <div id="page-body"></div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal wide" id="m-detail">
  <div class="modal-h"><h3 id="d-title">Xatolik tafsiloti</h3><button class="x" data-close-modal="m-detail">✕</button></div>
  <div class="modal-b">
    <div class="banner danger"><div class="ic">!</div><div class="grow" id="d-msg"></div></div>
    <h4 style="font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-6);margin:14px 0 8px">Stack</h4>
    <pre style="background:var(--deep);color:#D6CDBE;padding:14px 16px;border-radius:8px;font:500 12px/1.5 var(--f-mono);overflow:auto;max-height:240px;white-space:pre-wrap" id="d-stack"></pre>
    <h4 style="font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-6);margin:14px 0 8px">Kontekst (maxfiy maydonlar maskalangan)</h4>
    <table class="tbl"><tbody id="d-ctx"></tbody></table>
  </div>
  <div class="modal-f">
    <button class="btn btn-outline" data-close-modal="m-detail">Yopish</button>
    <button class="btn btn-acc" type="button" id="d-resolve">Tasdiqlandi</button>
  </div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

const body = document.getElementById('page-body');
const state = demoState();
// Live, mutable copy so "Resolve" toggles a working flag reflected in the row.
const errs = SEED.errors.map(e => ({ ...e }));
const errByCode = {};
errs.forEach(e => errByCode[e.code] = e);
let rFilter = 'all';

const preselect = new URLSearchParams(location.search).get('code');

function workshopsLabel(arr) {
  if (arr == null) return '<span style="color:var(--ink-6)">— tegishli emas (tenant-attributable emas)</span>';
  if (!arr.length) return '<span style="color:var(--ink-6)">—</span>';
  return arr.map(id => SEED.lookup.workshopById(id)?.name || id).join(', ');
}

function render() {
  if (state === 'loading') {
    body.innerHTML = `<div class="card"><table class="tbl"><thead><tr><th>Kod</th><th>Modul</th><th class="right">24 soat</th><th class="right">7 kun</th><th>Oxirgi</th><th>Tavsif</th><th></th></tr></thead><tbody>${skRows(7, 4)}</tbody></table></div>`;
    return;
  }
  if (state === 'error') { body.innerHTML = errState('Xatolik monitorini yuklab bo\'lmadi.', 'tr-b50f18'); return; }

  document.getElementById('filters').hidden = false;
  const modF = document.getElementById('f-mod').value;
  const thr = +document.getElementById('f-thr').value;
  let rows = errs.filter(e =>
    (modF === 'all' || e.module === modF) &&
    (e.count24h >= thr) &&
    (rFilter === 'all' || (rFilter === 'open' ? !e.resolved : e.resolved)));

  if (!rows.length) {
    // Documented canon empty copy (platform.md): "No errors recorded — nice."
    body.innerHTML = emptyState('✓', 'No errors recorded — nice.', 'Bu filtr bo\'yicha xatolik yo\'q.');
    return;
  }

  body.innerHTML = `<div class="card"><table class="tbl">
    <thead><tr><th>Kod</th><th>Modul</th><th class="right">24 soat</th><th class="right">7 kun</th><th>Oxirgi</th><th>Tavsif</th><th></th></tr></thead>
    <tbody>${rows.map(e => `
      <tr class="clickable" data-code="${e.code}" onclick="showErr('${e.code}')">
        <td class="nm">${e.code} ${e.spike ? '<span class="pill p-bad" style="font-size:9.5px;margin-left:4px"><span class="pd"></span>spike</span>' : ''}${e.resolved ? ' <span class="pill p-ok" style="font-size:9.5px;margin-left:4px"><span class="pd"></span>tasdiqlangan</span>' : ''}</td>
        <td><small style="color:var(--ink-8);font-size:12px">${e.module}</small></td>
        <td class="amt ${e.count24h > 10 ? 'warn-text' : ''}">${e.count24h}</td>
        <td class="amt">${e.count7d}</td>
        <td><span class="num" style="font-size:11.5px;color:var(--ink-6)">${e.last}</span></td>
        <td><small style="color:var(--ink-8);font-size:12px">${e.msg}</small></td>
        <td onclick="event.stopPropagation()">
          <div class="menu-wrap">
            <button class="menu-btn" data-menu-toggle aria-label="Amallar">⋯</button>
            <div class="menu" role="menu">
              <button class="mi" onclick="showErr('${e.code}')">Tafsilotlar</button>
              <button class="mi" onclick="toggleResolve('${e.code}')">${e.resolved ? 'Ochiq deb belgilash' : 'Tasdiqlash (resolve)'}</button>
            </div>
          </div>
        </td>
      </tr>`).join('')}</tbody></table></div>`;
}

function toggleResolve(code) {
  const e = errByCode[code];
  if (!e) return;
  if (e.resolved) { e.resolved = false; toast('Ochiq deb belgilandi'); render(); return; }
  confirmAction({ title: 'Tasdiqlanganga o\'tkazish', msg: `&quot;${code}&quot; kodi tasdiqlangan deb belgilanadi (ro'yxatda aks etadi).`, okText: 'Tasdiqlash' }, () => {
    e.resolved = true;
    toast('Tasdiqlandi');
    render();
  });
}

function showErr(code) {
  const e = errByCode[code];
  if (!e) return;
  document.getElementById('d-title').textContent = code + (e.spike ? '  · spike' : '');
  document.getElementById('d-msg').textContent = e.msg;
  document.getElementById('d-stack').textContent = e.stack || '(stack mavjud emas)';
  const ctx = Object.entries(e.context || {}).map(([k, v]) => `<tr><td class="muted" style="width:180px">${k}</td><td class="num">${v}</td></tr>`).join('');
  document.getElementById('d-ctx').innerHTML = `
    <tr><td class="muted" style="width:180px">Trace ID</td><td class="num">${e.traceId}</td></tr>
    <tr><td class="muted">Modul</td><td>${e.module}</td></tr>
    <tr><td class="muted">Ta'sirlangan ustaxonalar</td><td>${workshopsLabel(e.affectedWorkshops)}</td></tr>
    <tr><td class="muted">Foydalanuvchi</td><td>${e.affectedUser ? (SEED.lookup.userById(e.affectedUser)?.name || e.affectedUser) : '<span style="color:var(--ink-6)">— tegishli emas</span>'}</td></tr>
    ${ctx}`;
  const rb = document.getElementById('d-resolve');
  rb.textContent = e.resolved ? 'Ochiq deb belgilash' : 'Tasdiqlandi';
  rb.onclick = () => { closeModal('m-detail'); setTimeout(() => toggleResolve(code), 50); };
  openModal('m-detail');
}

document.getElementById('r-chips').addEventListener('click', ev => {
  const b = ev.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('#r-chips .chip').forEach(c => c.classList.remove('on'));
  b.classList.add('on'); rFilter = b.dataset.r; render();
});

render();
if (preselect && errByCode[preselect]) setTimeout(() => showErr(preselect), 200);
</script>
</body>
</html>
