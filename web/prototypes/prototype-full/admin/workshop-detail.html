<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ustaxona — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <button class="back" type="button" onclick="location.href='workshops.html'">← Ustaxonalar</button>
    <div id="wrap"></div>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

const id = new URLSearchParams(location.search).get('id') || 'ws-01';
const state = demoState();
const w = SEED.lookup.workshopById(id);
const wrap = document.getElementById('wrap');

// Permission summary helper (IN1 — never a role name; granted permissions + branches)
function permSummary(u) {
  if (u.isOwner) return '<span class="pill p-ok" style="font-size:10px"><span class="pd"></span>is_owner</span> <small style="color:var(--ink-6)">barcha ruxsatlar · barcha filiallar</small>';
  const g = u.grants || {};
  const keys = Object.keys(g);
  if (!keys.length) return '<small style="color:var(--ink-6)">ruxsat berilmagan</small>';
  const labelOf = k => (SEED.permissions.find(p => p.key === k) || {}).label || k;
  const branches = [...new Set(keys.flatMap(k => g[k]))].map(b => SEED.lookup.branchById(b)?.name || b);
  return `<small style="color:var(--ink-10)">${keys.map(labelOf).join(', ')}</small><small style="display:block;color:var(--ink-6);font-size:11px">Filiallar: ${branches.join(', ')}</small>`;
}

if (state === 'loading') {
  wrap.innerHTML = `<div class="card" style="max-width:720px;margin-top:8px"><div class="card-b" style="padding:24px">${'<div class="sk-line"></div>'.repeat(6)}</div></div>`;
} else if (state === 'error') {
  wrap.innerHTML = errState('Ustaxona ma\'lumotlarini yuklab bo\'lmadi.', 'tr-7d33aa');
} else if (!w) {
  wrap.innerHTML = emptyState('∅', 'Ustaxona topilmadi', 'Bu ID bo\'yicha ustaxona mavjud emas.');
} else {
  const isBlocked = w.status === 'blocked';

  wrap.innerHTML = `
    <div class="page-head" style="margin-top: 8px">
      <div>
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:54px;height:54px;border-radius:10px;background:linear-gradient(135deg,#A6471F,#8C3814);color:#fff;font:700 22px/1 var(--f-display);display:grid;place-items:center;flex:none">${w.mk}</div>
          <div>
            <h1>${w.name}</h1>
            <p class="sub">${w.branches} filial · ${w.orders30d} buyurtma (30 kun) · ${w.createdOn} dan</p>
            <div style="margin-top: 6px">${isBlocked ? `<span class="pill p-bad"><span class="pd"></span>Bloklangan · ${w.blockedReason || ''}</span>` : '<span class="pill p-ok"><span class="pd"></span>Faol</span>'}</div>
          </div>
        </div>
      </div>
      <div class="tools">
        ${isBlocked
          ? `<button class="btn btn-acc" type="button" onclick="confirmAction({title:'Ustaxonani blokdan chiqarish',msg:'Sessiyalar TIKLANMAYDI — egasi va xodimlar qaytadan kirishlari kerak. Buyurtmalar yana harakatlanadi.',okText:'Blokdan chiqarish'},()=>toast('Ustaxona blokdan chiqarildi'))">Blokdan chiqarish</button>`
          : `<button class="btn btn-danger" type="button" onclick="confirmAction({title:'Ustaxonani bloklash',msg:'Egasi va xodimlar sessiyalari darhol yopiladi va keyingi kirish rad etiladi. Ochiq buyurtmalar muzlatiladi. Mijozlarga ta\\'sir qilmaydi.',reasonField:true,reasonLabel:'Bloklash sababi',danger:true,okText:'Bloklash'},()=>toast('Ustaxona bloklandi','danger'))">Ustaxonani bloklash</button>`}
      </div>
    </div>

    ${isBlocked ? `<div class="banner danger"><div class="ic">!</div><div class="grow"><b>Ustaxona bloklangan → buyurtmalar muzlatilgan.</b> Xodimlar kira olmaydi, hech qanday avtomatik o'tish bo'lmaydi. Blokdan chiqarilganda sessiyalar tiklanmaydi.</div></div>` : ''}

    <div class="tabs" data-tabs="ws">
      <button class="tab on" data-target="t-profile" onclick="switchTab('ws','t-profile')">Profil</button>
      <button class="tab" data-target="t-branches" onclick="switchTab('ws','t-branches')">Filiallar</button>
      <button class="tab" data-target="t-staff" onclick="switchTab('ws','t-staff')">Xodimlar</button>
    </div>

    <section id="t-profile" data-panel-group="ws">
      <div class="card" style="max-width: 720px">
        <div class="card-h"><h2>Ustaxona profili</h2><span class="sub">faqat ko'rish · operator tahrirlamaydi</span></div>
        <div class="card-b" style="padding-top: 0">
          <div class="banner info"><div class="ic">i</div><div class="grow">Ustaxona profili va egasining ma'lumotlari (nom · telefon · login) egasining hududi. Operatorda tahrirlash yo'li yo'q — faqat <b>provision</b>, <b>bloklash</b>, <b>blokdan chiqarish</b>.</div></div>
          <div class="row-item"><div><div class="nm">Ustaxona nomi</div></div><div class="meta">${w.name}</div></div>
          <div class="row-item"><div><div class="nm">Egasi</div></div><div class="meta">${w.ownerName}</div></div>
          <div class="row-item"><div><div class="nm">Egasi telefoni</div></div><div class="meta">${w.ownerPhone}</div></div>
          <div class="row-item"><div><div class="nm">Filiallar soni</div><small style="color:var(--ink-6)">filiallar tabidan ko'rinadi</small></div><div class="meta">${w.branches}</div></div>
          <div class="row-item"><div><div class="nm">Yaratildi</div></div><div class="meta">${w.createdOn}</div></div>
          <div class="row-item"><div><div class="nm">Holat</div></div><div class="meta">${isBlocked ? 'Bloklangan' : 'Faol'}</div></div>
        </div>
      </div>
    </section>

    <section id="t-branches" data-panel-group="ws" hidden>
      <div class="card">
        <div class="card-h"><h2>Filiallar (read-only)</h2></div>
        <div class="card-b" style="padding: 0 22px 18px">
          <table class="tbl">
            <thead><tr><th>Nom</th><th>Manzil</th><th>Status</th></tr></thead>
            <tbody>${SEED.branches.map(b => `<tr><td class="nm">${b.name}</td><td>${b.addr}</td><td>${b.status === 'active' ? '<span class="pill p-ok"><span class="pd"></span>Faol</span>' : '<span class="pill p-warn"><span class="pd"></span>Vaqtincha yopiq</span>'}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="t-staff" data-panel-group="ws" hidden>
      <div class="card">
        <div class="card-h"><h2>Xodimlar (read-only)</h2><span class="sub">rol yo'q — is_owner + berilgan ruxsatlar</span></div>
        <div class="card-b" style="padding: 0 22px 18px">
          <table class="tbl">
            <thead><tr><th>Xodim</th><th>Ruxsatlar / filiallar</th><th>Holat</th></tr></thead>
            <tbody>${SEED.users.map(u => `<tr><td class="nm">${u.name}<small>${u.login}</small></td><td>${permSummary(u)}</td><td>${u.status === 'active' ? '<span class="pill p-ok"><span class="pd"></span>Faol</span>' : '<span class="pill p-bad"><span class="pd"></span>Bloklangan</span>'}</td></tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
    </section>
  `;
}
</script>
</body>
</html>
