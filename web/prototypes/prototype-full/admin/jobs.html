<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Background ish — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
<style>
  .job-fail td { background: var(--danger-tint); }
  .job-fail td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
</style>
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Background ish · scheduler</h1>
        <p class="sub">In-process scheduler · v1 da aniq ikkita ish. Tashqi navbat / Celery / cron yo'q.</p>
      </div>
    </div>

    <div id="page-body"></div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal" id="m-log">
  <div class="modal-h"><h3 id="log-title">Ish jurnali</h3><button class="x" data-close-modal="m-log"><i class="ic" data-icon="x"></i> </button></div>
  <div class="modal-b">
    <pre id="log-body" style="background:var(--deep);color:#CBD5E1;padding:14px 16px;border-radius:8px;font:500 12px/1.5 var(--f-mono);overflow:auto;max-height:60vh"></pre>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal="m-log">Yopish</button></div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

const body = document.getElementById('page-body');
const state = demoState();
const jobsById = {};
SEED.jobs.forEach(j => jobsById[j.id] = j);

function render() {
  if (state === 'loading') {
    body.innerHTML = `<div class="card"><table class="tbl"><thead><tr><th>Ish nomi</th><th>Jadval</th><th>Oxirgi ishlashi</th><th>Natija</th><th>Xulosa</th><th></th></tr></thead><tbody>${skRows(6, 2)}</tbody></table></div>`;
    return;
  }
  if (state === 'error') { body.innerHTML = errState('Ishlar ro\'yxatini yuklab bo\'lmadi.', 'tr-9f2a4c'); return; }
  if (!SEED.jobs.length) { body.innerHTML = emptyState('⌥', 'Ish yo\'q', 'Scheduler hozircha bo\'sh.'); return; }

  body.innerHTML = `<div class="card"><table class="tbl">
    <thead><tr><th>Ish nomi</th><th>Jadval</th><th>Oxirgi ishlashi</th><th>Natija</th><th>Xulosa</th><th></th></tr></thead>
    <tbody>${SEED.jobs.map(j => {
      const failed = j.lastResult === 'failed';
      return `<tr class="${failed ? 'job-fail' : ''}">
        <td class="nm">${j.name}${j.running ? ' <span class="pill p-cut" style="font-size:9.5px"><span class="pd"></span>ishlamoqda</span>' : ''}</td>
        <td><small style="color:var(--ink-8);font:400 12px var(--f-mono)">${j.schedule}</small></td>
        <td><span class="num" style="font-size:11.5px;color:var(--ink-6)">${j.lastRun}</span></td>
        <td>${failed ? '<span class="pill p-bad"><span class="pd"></span>Failed</span>' : '<span class="pill p-ok"><span class="pd"></span>Muvaffaqiyatli</span>'}</td>
        <td><small style="color:${failed ? 'var(--danger)' : 'var(--ink-8)'};font-size:12px">${failed ? (j.error || j.summary) : j.summary}</small></td>
        <td>
          <div class="menu-wrap">
            <button class="menu-btn" data-menu-toggle aria-label="Amallar">⋯</button>
            <div class="menu" role="menu">
              <button class="mi" onclick="showLog('${j.id}')">Jurnalni ko'rish</button>
              ${j.running
                ? `<button class="mi" disabled style="opacity:.4;cursor:not-allowed" title="Ish hozir ishlamoqda">Hozir ishlamoqda</button>`
                : `<button class="mi" onclick="confirmAction({title:'Ishni hozir ishga tushirish',msg:'&quot;${j.name}&quot; rejadan tashqari hozir ishga tushiriladi.',okText:'Ishga tushirish'},()=>toast('Ish ishga tushdi'))">Hozir ishga tushirish</button>`}
              ${failed && j.retriable && !j.running
                ? `<button class="mi danger" onclick="confirmAction({title:'Muvaffaqiyatsiz ishni qayta urinish',msg:'&quot;${j.name}&quot; oxirgi ishlashida xato berdi — qo\\'lda qayta urinib ko\\'rasizmi?',okText:'Qayta urinish'},()=>toast('Ish qayta ishga tushdi'))">Qayta urinish (failed)</button>`
                : ''}
            </div>
          </div>
        </td>
      </tr>`; }).join('')}</tbody></table></div>`;
}

function showLog(id) {
  const j = jobsById[id];
  if (!j) return;
  document.getElementById('log-title').textContent = j.id;
  document.getElementById('log-body').textContent =
    `[INFO] Job ${j.id} started · ${j.lastRun}\n` +
    (j.lastResult === 'failed'
      ? `[ERROR] ${j.error}\n[ERROR] Job aborted after ${j.durationMs}ms`
      : `[INFO] ${j.summary}\n[INFO] Completed in ${j.durationMs}ms`);
  openModal('m-log');
}

render();
</script>
</body>
</html>
