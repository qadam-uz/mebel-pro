<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bildirishnomalar — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
<style>
  .note { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; padding: 14px 18px; background: var(--elev); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; align-items: center; cursor: pointer; text-decoration: none; color: inherit; }
  .note:hover, .note:focus-visible { border-color: var(--ink-12); outline: none; }
  .note.unread { background: var(--accent-soft); }
  .note .ic { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: #fff; font: 700 14px var(--f-display); }
  .note .ic.error { background: var(--danger); }
  .note .ic.job { background: var(--warn); }
  .note .t { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-6); white-space: nowrap; }
</style>
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Bildirishnomalar</h1>
        <p class="sub">Platforma operatori uchun ogohlantirishlar — faqat error spike va failed ish.</p>
      </div>
      <div class="tools">
        <button class="btn btn-outline btn-sm" type="button" id="mark-all">Hammasini o'qilgan</button>
      </div>
    </div>

    <div class="filters" id="filters" hidden>
      <div class="chips" id="rd-chips">
        <button class="chip on" data-r="all">Hammasi</button>
        <button class="chip" data-r="unread">O'qilmagan</button>
        <button class="chip" data-r="read">O'qilgan</button>
      </div>
    </div>

    <div id="page-body" style="max-width:800px"></div>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

const body = document.getElementById('page-body');
const state = demoState();
let notes = window.adminNotifications();   // error-spike + failed-job only
let rFilter = 'all';

function render() {
  if (state === 'loading') {
    body.innerHTML = Array.from({ length: 4 }).map(() =>
      `<div class="note"><div class="sk" style="width:40px;height:40px;border-radius:8px"></div><div style="flex:1"><div class="sk-line w-60"></div><div class="sk-line w-80" style="margin:0"></div></div><div class="sk-line w-40" style="width:48px"></div></div>`).join('');
    return;
  }
  if (state === 'error') { body.innerHTML = errState('Bildirishnomalarni yuklab bo\'lmadi.', 'tr-9f2a4c'); return; }

  document.getElementById('filters').hidden = false;
  const rows = notes.filter(n => rFilter === 'all' || (rFilter === 'unread' ? !n.read : n.read));

  if (!rows.length) {
    body.innerHTML = emptyState('✓', rFilter === 'unread' ? "O'qilmagan bildirishnoma yo'q" : 'Yangilik yo\'q', 'Error spike yoki failed ish bo\'lganda bu yerda paydo bo\'ladi.');
    return;
  }

  body.innerHTML = rows.map((n, i) => `
    <a class="note ${n.read ? '' : 'unread'}" href="${n.link}" data-i="${i}" tabindex="0">
      <div class="ic ${n.kind}">${n.kind === 'job' ? 'J' : 'E'}</div>
      <div>
        <div style="font:600 14px var(--f-ui);color:var(--ink-12)">${n.title}</div>
        <div style="font-size:12.5px;color:var(--ink-8);margin-top:2px">${n.body}</div>
      </div>
      <div class="t">${n.t}</div>
    </a>`).join('');
}

document.getElementById('rd-chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('#rd-chips .chip').forEach(c => c.classList.remove('on'));
  b.classList.add('on'); rFilter = b.dataset.r; render();
});

document.getElementById('mark-all').addEventListener('click', () => {
  notes = notes.map(n => ({ ...n, read: true }));
  toast("Hammasi o'qilgan deb belgilandi");
  render();
});

render();
</script>
</body>
</html>
