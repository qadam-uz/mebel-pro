<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Krom navbati — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Krom yopishtirish navbati</h1>
        <p class="sub">Sizga tayinlangan, krom yopishtirilishi kerak bo'lgan buyurtmalar.</p>
      </div>
    </div>

    <div class="queue-grid">
      <section class="queue-col">
        <h2>Krom kutmoqda <span class="ct" id="queue-count">0</span></h2>
        <div id="queue"></div>
      </section>
    </div>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

// Current worker (demo): Olim Hojiyev — sees only edge_banding orders
// ASSIGNED to him. One action only: "Krom tugadi". No claim, no priority.
const ME = 'u04';
const queue = SEED.orders.filter(o => o.state === 'edge_banding' && o.assignedEdger === ME);

document.getElementById('queue-count').textContent = queue.length;

function edgeLine(o) {
  const c = SEED.lookup.cuttingById(o.cuttingId);
  const el = c ? (SEED.lookup.chosenAlgo(c)?.edgeLen || {}) : {};
  const parts = Object.entries(el).map(([t, m]) => `${t} mm: ${m} m`);
  return parts.length ? parts.join(' · ') : 'krom rejasi';
}

document.getElementById('queue').innerHTML = queue.length === 0
  ? `<div class="empty"><div class="ic">∅</div><h3>Sizga tayinlangani yo'q</h3><p>Krom kutayotgan ishingiz yo'q.</p></div>`
  : queue.map(o => {
    const cl = SEED.lookup.clientById(o.clientId);
    return `<div class="q-card">
      <div class="top">
        <div><div class="id">${o.id}</div><h4>${o.title}</h4><div class="meta">${cl?.name || ''} · <b>${edgeLine(o)}</b> · muddat ${o.dueAt || '—'}</div></div>
        <span class="assigned-tag">Sizga</span>
      </div>
      <div class="act"><button class="btn btn-acc" type="button" onclick="confirmAction({title:'Krom tugadi',msg:'${o.id} · krom yopishtirildi, buyurtma Tayyor holatiga o\\'tadi.'},()=>{toast('Krom tugadi · ${o.id}');setTimeout(()=>location.reload(),700)})">✓ Krom tugadi</button><a class="btn btn-outline" href="order-detail.html?id=${o.id}">Tafsilotlar</a></div>
    </div>`;
  }).join('');
</script>
</body>
</html>
