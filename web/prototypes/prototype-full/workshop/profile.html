<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Profil — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Mening profilim</h1>
        <p class="sub" id="pr-sub">—</p>
      </div>
      <div class="tools">
        <button class="btn btn-danger" type="button" onclick="confirmAction({title:'Chiqib ketish',msg:'Boshqaruv kabinetidan chiqasiz.',okText:'Chiqish',danger:true},()=>{toast('Chiqildi');setTimeout(()=>location.href='login.html',500)})">Chiqib ketish</button>
      </div>
    </div>

    <div class="tabs" data-tabs="pr">
      <button class="tab on" data-target="t-profile" onclick="switchTab('pr','t-profile')">Profil</button>
      <button class="tab" data-target="t-password" onclick="switchTab('pr','t-password')">Parolni o'zgartirish</button>
      <button class="tab" data-target="t-sess" onclick="switchTab('pr','t-sess')">Sessiyalar</button>
    </div>

    <section id="t-profile" data-panel-group="pr">
      <div class="card" style="max-width: 640px">
        <div class="card-h"><h2>Ma'lumotlar</h2></div>
        <div class="card-b" id="pr-info"></div>
      </div>
      <div class="card" style="max-width: 640px;margin-top:14px">
        <div class="card-h"><h2>Ruxsatlar</h2></div>
        <div class="card-b" id="pr-grants"></div>
      </div>
    </section>

    <section id="t-password" data-panel-group="pr" hidden>
      <div class="card" style="max-width: 480px">
        <div class="card-h"><h2>Parolni o'zgartirish</h2></div>
        <div class="card-b">
          <div class="banner info"><div class="ic">i</div><div class="grow">Parol o'zgartirilgandan keyin barcha boshqa sessiyalar yopiladi.</div></div>
          <div class="field"><label>Joriy parol</label><input type="password" /></div>
          <div class="field"><label>Yangi parol</label><input type="password" /><span class="hint">Kamida 8 belgi · katta + kichik + raqam</span></div>
          <div class="field"><label>Yangi parolni qaytaring</label><input type="password" /></div>
          <div class="flex-end"><button class="btn btn-acc" type="button" onclick="clearPasswordResetRequired('workshop');toast('Parol o\'zgartirildi')">O'zgartirish</button></div>
        </div>
      </div>
    </section>

    <section id="t-sess" data-panel-group="pr" hidden>
      <div class="card" style="max-width: 640px">
        <div class="card-h"><h2>Faol sessiyalar</h2><button class="btn btn-danger btn-sm" type="button" onclick="confirmAction({title:'Hammasi yopilsin',okText:'Yopish',danger:true},()=>toast('Boshqa sessiyalar yopildi'))">Hammasi yopilsin</button></div>
        <div class="card-b" style="padding-top: 0">
          <div class="row-item"><div><div class="nm">MacBook · Chrome <span class="pill p-ok" style="font-size:9.5px;margin-left:4px"><span class="pd"></span>Joriy</span></div><small style="color:var(--ink-6)">Toshkent · 15-may, 09:42</small></div><div class="meta muted">—</div></div>
          <div class="row-item"><div><div class="nm">iPhone · Safari</div><small style="color:var(--ink-6)">Toshkent · 14-may, 18:30</small></div><div class="meta"><button class="btn btn-outline btn-sm" type="button" onclick="this.closest('.row-item').remove();toast('Sessiya yopildi')">Yopish</button></div></div>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

// IN1: no role. Show an is_owner indicator + an explicit granted-permissions
// / branches summary, driven by the acting user (ME).
const me = ME;
document.getElementById('pr-sub').textContent =
  `${me.name} · ${me.isOwner ? 'Egasi' : 'Xodim'} · Furniture House`;

document.getElementById('pr-info').innerHTML = `
  <div class="row-item"><div><div class="nm">F.I.O</div></div><div class="meta">${me.name}</div></div>
  <div class="row-item"><div><div class="nm">Login</div></div><div class="meta">${me.login || '—'}</div></div>
  <div class="row-item"><div><div class="nm">Telefon</div></div><div class="meta">${me.phone || '—'}</div></div>
  <div class="row-item"><div><div class="nm">Asosiy filial</div></div><div class="meta">${SEED.lookup.branchById(me.homeBranchId)?.name || '—'}</div></div>
  <div class="row-item"><div><div class="nm">Egasi</div></div><div class="meta">${me.isOwner ? '<span class="pill p-ok"><span class="pd"></span>Ha · barcha ruxsatlar</span>' : '<span class="pill p-dn"><span class="pd"></span>Yo\'q</span>'}</div></div>
  <div class="row-item"><div><div class="nm">Ustaxona</div></div><div class="meta">Furniture House</div></div>`;

const gEl = document.getElementById('pr-grants');
if (me.isOwner) {
  gEl.innerHTML = `<div class="banner info"><div class="ic">i</div><div class="grow">Egasi sifatida barcha filialda barcha ruxsatga avtomatik egasiz.</div></div>`;
} else {
  const grants = me.grants || {};
  const keys = Object.keys(grants);
  if (!keys.length) {
    gEl.innerHTML = `<p class="muted" style="font-size:13px;margin:0">Sizga hali hech qanday ruxsat berilmagan — ustaxona egasiga murojaat qiling.</p>`;
  } else {
    const permLabel = k => (SEED.permissions.find(p => p.key === k)?.label) || k;
    gEl.innerHTML = keys.map(k => `<div class="row-item"><div><div class="nm">${permLabel(k)}</div><small style="color:var(--ink-6);font:400 11px var(--f-mono)">${k}</small></div><div class="meta">${grants[k].map(b => SEED.lookup.branchById(b)?.name || b).join(', ')}</div></div>`).join('');
  }
}

if (new URLSearchParams(location.search).get('tab') === 'password') {
  switchTab('pr', 't-password');
}
</script>
</body>
</html>
