<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chizma navbati — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Kesish navbati</h1>
        <p class="sub">Sizga tayinlangan buyurtmalar. Boshqaning ishini bu yerda ko'rmaysiz.</p>
      </div>
    </div>

    <div class="queue-grid">
      <section class="queue-col">
        <h2>Kesishni kutmoqda <span class="ct" id="queue-count">0</span></h2>
        <div id="queue"></div>
      </section>

      <section class="queue-col">
        <h2>Kesilmoqda <span class="ct" id="active-count">0</span></h2>
        <div id="active"></div>
      </section>
    </div>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

// Current worker (demo): Bahodir Tursunov — sees only orders ASSIGNED to him.
const ME = 'u03';

// Awaiting cut: confirmed orders assigned to me. In progress: cutting orders
// assigned to me. No "claim from queue", no priority reorder, no driver.
const queue = SEED.orders.filter(o => o.state === 'confirmed' && o.assignedCutter === ME);
const active = SEED.orders.filter(o => o.state === 'cutting' && o.assignedCutter === ME);

document.getElementById('queue-count').textContent = queue.length;
document.getElementById('active-count').textContent = active.length;

function partsLine(o) {
  const c = SEED.lookup.cuttingById(o.cuttingId);
  return c ? `${c.parts} qism · ${c.panels} panel` : 'chizma yo\'q';
}

document.getElementById('queue').innerHTML = queue.length === 0
  ? `<div class="empty"><div class="ic"><i data-icon="inbox"></i></div><h3>Sizga tayinlangani yo'q</h3><p>Hozircha tinch — yaxshi!</p></div>`
  : queue.map(o => {
    const cl = SEED.lookup.clientById(o.clientId);
    return `<div class="q-card">
      <div class="top">
        <div>
          <h4>${o.id}</h4>
          <div class="meta">${cl?.name || ''} · <b>${partsLine(o)}</b> · muddat ${o.dueAt || '—'}</div>
        </div>
        <span class="assigned-tag">Sizga</span>
      </div>
      <div class="act">
        <button class="btn btn-acc" type="button" onclick="confirmAction({title:'Kesish tugadi',msg:'${o.id} · ishlatilgan listlar yoziladi, material stockdan chiqariladi.'},()=>{toast('Kesish tugadi · ${o.id}');setTimeout(()=>location.reload(),700)})"><i class="ic" data-icon="check"></i> Kesish tugadi</button>
        <a class="btn btn-outline" href="order-detail.html?id=${o.id}">Tafsilotlar</a>
      </div>
    </div>`;
  }).join('');

document.getElementById('active').innerHTML = active.length === 0
  ? `<div class="empty" style="border-style:dashed"><div class="ic"><i data-icon="inbox"></i></div><p>Hozir kesilayotgan ishingiz yo'q.</p></div>`
  : active.map(o => {
    const cl = SEED.lookup.clientById(o.clientId);
    return `<div class="q-card">
      <div class="top">
        <div>
          <h4>${o.id}</h4>
          <div class="meta">${cl?.name || ''} · <b>${partsLine(o)}</b></div>
        </div>
        <span class="pill p-cut"><span class="pd"></span>Kesilmoqda</span>
      </div>
      <div class="act">
        <button class="btn btn-acc" type="button" onclick="confirmAction({title:'Kesish tugadi',msg:'Ishlatilgan listlar yoziladi va material stockdan chiqariladi.'},()=>{toast('Kesish tugadi · ${o.id}');setTimeout(()=>location.reload(),700)})"><i class="ic" data-icon="check"></i> Kesish tugadi</button>
        <a class="btn btn-outline" href="order-detail.html?id=${o.id}">Chizmani ko'rish</a>
      </div>
    </div>`;
  }).join('');
</script>
</body>
</html>
