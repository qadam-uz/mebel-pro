<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ombor — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Ombor</h1>
        <p class="sub">Filiallarda mavjud listlar va materiallar.</p>
      </div>
      <div class="tools">
        <button class="btn btn-outline btn-sm" type="button" onclick="openModal('m-adjust')">± Tuzatish</button>
        <button class="btn btn-acc" type="button" onclick="openModal('m-stockin')">+ Kirim yozish</button>
      </div>
    </div>

    <div class="tabs" data-tabs="inv">
      <button class="tab on" data-target="t-stock" onclick="switchTab('inv','t-stock')">Joriy ombor</button>
      <button class="tab" data-target="t-tx" onclick="switchTab('inv','t-tx')">Tranzaksiyalar</button>
      <button class="tab" data-target="t-sup" onclick="switchTab('inv','t-sup')">Yetkazib beruvchilar</button>
    </div>

    <section id="t-stock" data-panel-group="inv">
      <div class="filters">
        <div class="input"><input id="m-search" placeholder="Material qidirish..." oninput="renderStock()" /></div>
        <select id="br-filter" onchange="onBranchChange()"></select>
        <button class="chip ghost" id="low-only" onclick="this.classList.toggle('on');renderStock()">Faqat past zaxiralar</button>
      </div>

      <div class="card">
        <table class="tbl">
          <thead>
            <tr><th>Material</th><th>Filial</th><th class="right">Mavjud (on_hand)</th><th class="right">Min</th><th>Holat</th><th></th></tr>
          </thead>
          <tbody id="stock-body"></tbody>
        </table>
      </div>
    </section>

    <section id="t-tx" data-panel-group="inv" hidden>
      <div class="card">
        <table class="tbl">
          <thead>
            <tr><th>Vaqt</th><th>Turi</th><th>Material</th><th>Filial</th><th class="right">Miqdor</th><th>Keyin</th><th>Buyurtma</th><th>Kim qildi</th></tr>
          </thead>
          <tbody id="tx-body"></tbody>
        </table>
      </div>
    </section>

    <section id="t-sup" data-panel-group="inv" hidden>
      <div class="page-head" style="margin:0 0 14px">
        <div></div>
        <div class="tools"><button class="btn btn-acc btn-sm" type="button" onclick="openModal('m-supplier')">+ Yetkazib beruvchi</button></div>
      </div>
      <div class="card">
        <table class="tbl">
          <thead><tr><th>Nomi</th><th>Telefon</th><th>Izoh</th><th>Holat</th><th></th></tr></thead>
          <tbody id="sup-body"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal" id="m-stockin">
  <div class="modal-h"><h3>Kirim yozish (stock_in)</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <div class="field"><label>Filial</label><select id="si-branch" onchange="fillMatSelect('mat-select', this.value)"></select></div>
    <div class="field"><label>Material</label><select id="mat-select"></select></div>
    <div class="field"><label>Miqdor</label><input type="number" value="20" min="1" /></div>
    <div class="field">
      <label>Yetkazib beruvchi</label>
      <div style="display:flex;gap:8px">
        <select id="sup-select" style="flex:1"></select>
        <button class="btn btn-outline btn-sm" type="button" onclick="document.getElementById('new-sup-wrap').hidden=!document.getElementById('new-sup-wrap').hidden">+ Yangi</button>
      </div>
    </div>
    <div id="new-sup-wrap" hidden style="border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:4px">
      <div class="field-row">
        <div class="field"><label>Nomi</label><input id="new-sup-name" placeholder="Yangi yetkazib beruvchi" /></div>
        <div class="field"><label>Telefon</label><input placeholder="+998 ..." /></div>
      </div>
      <button class="btn btn-acc btn-sm" type="button" onclick="addSupplierInline()">Qo'shish</button>
    </div>
    <div class="field"><label>Hujjat (ixtiyoriy)</label><input type="file" /></div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-stockin');toast('Kirim yozildi')">Yozish</button></div>
</div>

<div class="modal" id="m-adjust">
  <div class="modal-h"><h3>Stock tuzatish (adjust)</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <div class="banner warn"><div class="ic">!</div><div class="grow">Tuzatish 0 dan past tushmaydi. Sabab kerak.</div></div>
    <div class="field"><label>Filial</label><select id="adj-branch" onchange="fillMatSelect('adj-mat', this.value)"></select></div>
    <div class="field"><label>Material</label><select id="adj-mat"></select></div>
    <div class="field"><label>Imzo (signed delta · "+10" yoki "−3")</label><input value="-3" /></div>
    <div class="field"><label>Sabab *</label><textarea rows="2" placeholder="Yorilgan partiya"></textarea></div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-adjust');toast('Stock tuzatildi')">Tasdiqlash</button></div>
</div>

<div class="modal" id="m-supplier">
  <div class="modal-h"><h3>Yetkazib beruvchi qo'shish</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <div class="field"><label>Nomi</label><input placeholder="Egger Distribution UZ" /></div>
    <div class="field"><label>Telefon</label><input placeholder="+998 ..." /></div>
    <div class="field"><label>Izoh (ixtiyoriy)</label><input placeholder="LDSP · asosiy" /></div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-supplier');toast('Yetkazib beruvchi qo\'shildi')">Qo'shish</button></div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

const unit = m => m.kind === 'edge' ? 'm' : 'list';

// CR4: only branches the user can scope to (manage_inventory / owner).
const MY_BR = myBranches().filter(id => isOwner() || can('manage_inventory', id));
const canMutate = bid => isOwner() || can('manage_inventory', bid);

// Branch filter offers only the user's branches.
(() => {
  const sel = document.getElementById('br-filter');
  const brs = SEED.branches.filter(b => MY_BR.includes(b.id));
  sel.innerHTML = (brs.length > 1 ? `<option value="all">${isOwner() ? 'Barcha filiallar' : 'Mening filiallarim'}</option>` : '') +
    brs.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
  // Modal branch selects scoped the same way.
  ['si-branch', 'adj-branch'].forEach(mid => {
    const m = document.getElementById(mid);
    if (m) m.innerHTML = brs.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
  });
})();

const NO_BRANCHES = MY_BR.length === 0;

// PU6: material selects scoped to a branch's ACTIVE branchMaterials.
window.fillMatSelect = (selId, branchId) => {
  const sel = document.getElementById(selId);
  if (!sel) return;
  const rows = SEED.branchMaterials.filter(bm => bm.branchId === branchId && bm.status === 'active');
  sel.innerHTML = rows.length
    ? rows.map(bm => { const m = SEED.lookup.matById(bm.matId); return `<option value="${bm.matId}">${m?.name || bm.matId}</option>`; }).join('')
    : `<option value="" disabled selected>Bu filialda faol material yo'q</option>`;
};

function currentBranchScope() {
  const v = document.getElementById('br-filter').value;
  return (!v || v === 'all') ? MY_BR : [v];
}

window.renderStock = () => {
  const tbody = document.getElementById('stock-body');
  if (NO_BRANCHES) {
    tbody.innerHTML = `<tr><td colspan="6">${stEmpty('Filial biriktirilmagan — ustaxona egasiga murojaat qiling')}</td></tr>`;
    return;
  }
  const ds = demoState();
  if (ds === 'loading') { tbody.innerHTML = skRows(6, 6); return; }
  if (ds === 'error') { tbody.innerHTML = `<tr><td colspan="6">${stError()}</td></tr>`; return; }

  const scope = currentBranchScope();
  const q = (document.getElementById('m-search').value || '').trim().toLowerCase();
  const lowOnly = document.getElementById('low-only').classList.contains('on');
  const rows = SEED.branchMaterials.filter(bm => {
    if (!scope.includes(bm.branchId)) return false;
    if (bm.status !== 'active') return false;
    const m = SEED.lookup.matById(bm.matId);
    if (q && !(m?.name || '').toLowerCase().includes(q)) return false;
    if (lowOnly && !(bm.onHand <= bm.minStock)) return false;
    return true;
  });
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6">${stEmpty('Bu filialda material tanlanmagan', 'Bu filialga material qo\'shing.')}</td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(bm => {
    const m = SEED.lookup.matById(bm.matId);
    const br = SEED.lookup.branchById(bm.branchId);
    const low = bm.onHand <= bm.minStock;
    const dims = m.kind === 'edge' ? `${m.thickness} mm · krom (metr)` : `${m.thickness} mm · ${m.sheetLen}×${m.sheetWid}`;
    return `<tr class="clickable" onclick="toast('${m.name} — ${br.name} · tranzaksiyalar tabida')">
      <td><div style="display:flex;align-items:center;gap:11px"><div class="sw ${m.sw}"></div><div><div class="nm">${m.name}</div><small style="color:var(--ink-6);font:400 11px var(--f-mono)">${dims}</small></div></div></td>
      <td>${br.name}</td>
      <td class="amt" style="${low ? 'color:var(--warn)' : 'color:var(--ink-12)'}">${bm.onHand} <small>${unit(m)}</small></td>
      <td class="amt muted">${bm.minStock}</td>
      <td>${low ? '<span class="pill p-warn"><span class="pd"></span>Past</span>' : '<span class="pill p-ok"><span class="pd"></span>OK</span>'}</td>
      <td onclick="event.stopPropagation()">${canMutate(bm.branchId) ? `
        <div class="menu-wrap">
          <button class="menu-btn" data-menu-toggle aria-label="Amallar">⋯</button>
          <div class="menu">
            <button class="mi" onclick="openStockIn('${bm.branchId}','${bm.matId}')">Kirim yozish</button>
            <button class="mi" onclick="openAdjust('${bm.branchId}','${bm.matId}')">Tuzatish</button>
          </div>
        </div>` : '<span class="muted" style="font-size:11px">faqat o\'qish</span>'}
      </td>
    </tr>`;
  }).join('');
};

window.openStockIn = (branchId, matId) => {
  const bs = document.getElementById('si-branch');
  if (branchId) bs.value = branchId;
  fillMatSelect('mat-select', bs.value);
  if (matId) document.getElementById('mat-select').value = matId;
  openModal('m-stockin');
};
window.openAdjust = (branchId, matId) => {
  const bs = document.getElementById('adj-branch');
  if (branchId) bs.value = branchId;
  fillMatSelect('adj-mat', bs.value);
  if (matId) document.getElementById('adj-mat').value = matId;
  openModal('m-adjust');
};

// PU6: a believable, reconciling transactions log DERIVED from the order +
// stock seed. consume/restore carry a SYSTEM actor + an order link and no
// human actor; no contradictory consume+restore pair on the same order; no
// orphan adjust. Stock-in rows mirror the action-log seed.
function buildTransactions() {
  const tx = [];
  // consume rows: every order whose Cutting done was stamped consumed its
  // shop sheets (one row per material). Banding done consumed edge metres.
  SEED.orders.forEach(o => {
    if (!MY_BR.includes(o.branchId)) return;
    if (o.cutCompletedAt && o.sheetsUsed) {
      Object.entries(o.sheetsUsed).forEach(([matId, qty]) => {
        const m = SEED.lookup.matById(matId);
        tx.push({ t: o.cutCompletedAt, type: 'consume', matName: m?.name || matId, branchId: o.branchId, qty: -qty, order: o.id, actor: 'System · order' });
      });
    }
    if (o.edgeCompletedAt && o.edgeLengthByThickness) {
      const total = Object.values(o.edgeLengthByThickness).reduce((a, b) => a + b, 0) / 1000;
      tx.push({ t: o.edgeCompletedAt, type: 'consume', matName: 'Krom (PVC)', branchId: o.branchId, qty: -Math.round(total * 10) / 10, order: o.id, actor: 'System · order' });
    }
  });
  // stock-in rows from the action log (inventory.stock_in).
  SEED.auditLog.filter(a => a.action === 'inventory.stock_in').forEach(a => {
    const mm = /^(\S+\s?\S*)\s·\s\+(\d+)/.exec(a.detail) || [];
    tx.push({ t: a.t, type: 'stock_in', matName: (mm[1] || a.detail), branchId: 'yunusobod', qty: +(mm[2] || 0), supplier: 'Egger partiya', actor: SEED.lookup.userById(a.actor)?.name || a.actor });
  });
  // one believable adjust (a write-off with a note — never an orphan).
  if (MY_BR.includes('yunusobod')) tx.push({ t: '14-may 09:00', type: 'adjust', matName: 'LDSP 0011 PR · Oq baxmal', branchId: 'yunusobod', qty: -3, note: 'Yorilgan partiya hisobdan chiqarildi', actor: 'Hasan Karimov' });
  return tx.sort((a, b) => (b.t || '').localeCompare(a.t || ''));
}

const TYPE_PILL = { consume: 'p-bad', stock_in: 'p-ok', restore: 'p-conf', adjust: 'p-warn' };
window.renderTx = () => {
  const tb = document.getElementById('tx-body');
  if (NO_BRANCHES) { tb.innerHTML = `<tr><td colspan="8">${stEmpty('Filial biriktirilmagan')}</td></tr>`; return; }
  const ds = demoState();
  if (ds === 'loading') { tb.innerHTML = skRows(8, 6); return; }
  if (ds === 'error') { tb.innerHTML = `<tr><td colspan="8">${stError()}</td></tr>`; return; }
  const rows = buildTransactions();
  tb.innerHTML = rows.length ? rows.map(r => {
    const br = SEED.lookup.branchById(r.branchId);
    const pos = r.qty >= 0;
    return `<tr>
      <td class="num" style="font-size:11.5px;color:var(--ink-6)">${r.t}</td>
      <td><span class="pill ${TYPE_PILL[r.type] || 'p-conf'}" style="font-size:10.5px"><span class="pd"></span>${r.type}</span></td>
      <td class="nm">${r.matName}</td>
      <td>${br?.name || r.branchId}</td>
      <td class="amt" style="color:${pos ? 'var(--success)' : 'var(--danger)'}">${pos ? '+' : ''}${r.qty}</td>
      <td class="num muted">—</td>
      <td>${r.order ? `<a class="id" href="order-detail.html?id=${r.order}" style="color:var(--accent);text-decoration:none">${r.order}</a>` : `<span class="muted">${r.ref || r.supplier || r.note || '—'}</span>`}</td>
      <td><small style="color:var(--ink-8)">${r.actor}</small></td>
    </tr>`;
  }).join('') : `<tr><td colspan="8">${stEmpty('Tranzaksiya yo\'q')}</td></tr>`;
};

window.onBranchChange = () => { renderStock(); };

renderStock();
renderTx();

function renderSuppliers() {
  const sel = document.getElementById('sup-select');
  sel.innerHTML = SEED.suppliers.filter(s => s.status === 'active').map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  document.getElementById('sup-body').innerHTML = SEED.suppliers.map(s => `<tr>
    <td class="nm">${s.name}</td>
    <td><small style="color:var(--ink-8);font:400 12px var(--f-mono)">${s.phone || '—'}</small></td>
    <td><small style="color:var(--ink-8)">${s.note || '—'}</small></td>
    <td>${s.status === 'active' ? '<span class="pill p-ok"><span class="pd"></span>Faol</span>' : '<span class="pill p-dn"><span class="pd"></span>Faol emas</span>'}</td>
    <td><div class="menu-wrap"><button class="menu-btn" data-menu-toggle>⋯</button><div class="menu"><button class="mi" onclick="openModal('m-supplier')">Tahrirlash</button><button class="mi danger" onclick="confirmAction({title:'Faol emas qilish',msg:'Yangi kirimda ko\\'rinmaydi.',okText:'Tasdiqlash'},()=>toast('Holat o\\'zgartirildi'))">Faol emas qilish</button></div></div></td>
  </tr>`).join('');
}
renderSuppliers();

// Initial modal material selects, scoped to the first available branch (PU6).
if (!NO_BRANCHES) {
  fillMatSelect('mat-select', document.getElementById('si-branch').value);
  fillMatSelect('adj-mat', document.getElementById('adj-branch').value);
}

window.addSupplierInline = () => {
  const name = document.getElementById('new-sup-name').value.trim();
  if (!name) { toast('Nom kiriting', 'warn'); return; }
  const sel = document.getElementById('sup-select');
  const opt = document.createElement('option');
  opt.textContent = name; opt.selected = true;
  sel.appendChild(opt);
  document.getElementById('new-sup-wrap').hidden = true;
  document.getElementById('new-sup-name').value = '';
  toast('Yetkazib beruvchi qo\'shildi');
};
</script>
</body>
</html>
