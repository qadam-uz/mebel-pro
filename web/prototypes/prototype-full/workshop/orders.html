<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Buyurtmalar — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Buyurtmalar</h1>
        <p class="sub">Barcha filiallar bo'yicha buyurtmalar oqimi.</p>
      </div>
      <div class="tools">
        <button class="btn btn-outline btn-sm" id="mode-board" type="button" onclick="setMode('board')"><i class="ic" data-icon="grid"></i> Taxta</button>
        <button class="btn btn-outline btn-sm" id="mode-table" type="button" onclick="setMode('table')"><i class="ic" data-icon="list"></i> Jadval</button>
        <button class="btn btn-outline btn-sm" type="button" onclick="toast('CSV yuklanmoqda')">CSV</button>
      </div>
    </div>

    <div id="ord-filters" class="filters">
      <div class="chips">
        <button class="chip on" data-state="all" onclick="setStateFilter('all')">Hammasi</button>
        <button class="chip" data-state="active" onclick="setStateFilter('active')">Faol</button>
        <button class="chip" data-state="new" onclick="setStateFilter('new')">Yangi</button>
        <button class="chip" data-state="confirmed" onclick="setStateFilter('confirmed')">Tasdiqlangan</button>
        <button class="chip" data-state="cutting" onclick="setStateFilter('cutting')">Kesilmoqda</button>
        <button class="chip" data-state="edge_banding" onclick="setStateFilter('edge_banding')">Kromda</button>
        <button class="chip" data-state="ready" onclick="setStateFilter('ready')">Tayyor</button>
        <button class="chip" data-state="completed" onclick="setStateFilter('completed')">Tugatilgan</button>
        <button class="chip" data-state="cancelled" onclick="setStateFilter('cancelled')">Bekor qilingan</button>
      </div>
      <label class="filter-label" for="search">Qidirish</label>
      <div class="input">
        <input id="search" aria-label="Buyurtma ID yoki mijoz nomi" placeholder="ID yoki mijoz nomi..." oninput="render()" />
      </div>
      <select id="date-filter" aria-label="Sana filtri" onchange="render()">
        <option value="all">Barcha sanalar</option>
        <option value="today">Bugun</option>
        <option value="week">Oxirgi 7 kun</option>
        <option value="month">May oyi</option>
      </select>
      <select id="branch-filter" aria-label="Filial filtri" onchange="render()"></select>
    </div>

    <!-- BOARD -->
    <section id="board-view">
      <div class="board" id="board"></div>
    </section>

    <!-- TABLE -->
    <section id="table-view" hidden>
      <div class="card">
        <table class="tbl">
          <thead>
            <tr>
              <th>ID</th><th>Mijoz</th><th>Filial</th><th>Holat</th><th>Mas'ul</th><th class="right">Summa</th><th>Vaqt</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

let mode = 'board', stateFilter = 'all';
// v1 board: linear pickup-only flow, no payment / delivery columns.
const COLS = ['new', 'confirmed', 'cutting', 'edge_banding', 'ready'];
const TERMINAL = ['completed', 'cancelled'];

// CR4: branches the user can see; whether they can act vs. only view.
const MY_BR = typeof operationalBranchIds === 'function'
  ? operationalBranchIds()
  : myBranches().filter(id => SEED.lookup.branchById(id)?.status !== 'inactive');
const canActOn = bid => isOwner() || can('manage_orders', bid);

// Populate the branch filter from MY_BR only (never offer a branch the user
// can't scope to).
(() => {
  const sel = document.getElementById('branch-filter');
  const brs = SEED.branches.filter(b => MY_BR.includes(b.id));
  sel.innerHTML = (brs.length > 1 ? `<option value="all">${isOwner() ? 'Barcha filiallar' : 'Mening filiallarim'}</option>` : '') +
    brs.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
})();

const NO_BRANCHES = MY_BR.length === 0;

function syncModeUi() {
  document.getElementById('board-view').hidden = mode !== 'board';
  document.getElementById('table-view').hidden = mode !== 'table';
  document.getElementById('mode-board').classList.toggle('on', mode === 'board');
  document.getElementById('mode-table').classList.toggle('on', mode === 'table');
}
function setMode(m) {
  if (m === 'board' && TERMINAL.includes(stateFilter)) {
    toast('Tugatilgan va bekor qilingan buyurtmalar jadvalda ko\'rsatiladi', 'warn');
    mode = 'table';
  } else {
    mode = m;
  }
  syncModeUi();
  render();
}
function setStateFilter(s) {
  stateFilter = s;
  document.querySelectorAll('[data-state]').forEach(b => b.classList.toggle('on', b.dataset.state === s));
  if (TERMINAL.includes(s) && mode === 'board') {
    mode = 'table';
    toast('Terminal holatlar jadval rejimida ochildi');
  }
  syncModeUi();
  render();
}

function matchDate(o, f) {
  if (f === 'all') return true;
  const d = (o.placedAt || '').toLowerCase();
  if (f === 'today') return d.includes('16-may');
  if (f === 'week') return /1[0-6]-may/.test(d);
  if (f === 'month') return d.includes('-may');
  return true;
}

function itemCount(o) {
  const c = SEED.lookup.cuttingById(o.cuttingId);
  return c?.parts || null;
}

function getOrders() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const br = document.getElementById('branch-filter').value;
  const df = document.getElementById('date-filter').value;
  return SEED.orders.filter(o => {
    if (!MY_BR.includes(o.branchId)) return false; // CR4 branch scoping
    if (br && br !== 'all' && o.branchId !== br) return false;
    if (!matchDate(o, df)) return false;
    if (stateFilter !== 'all' && stateFilter !== 'active' && o.state !== stateFilter) return false;
    if (stateFilter === 'active' && !COLS.includes(o.state)) return false;
    if (q) {
      const cl = SEED.lookup.clientById(o.clientId);
      if (!o.id.toLowerCase().includes(q) && !cl?.name.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function render() {
  // Zero branches → canonical orders.md copy; nothing actionable.
  if (NO_BRANCHES) {
    document.getElementById('ord-filters').hidden = true;
    document.getElementById('table-view').hidden = true;
    document.querySelector('.page .tools').hidden = true;
    document.getElementById('board-view').hidden = false;
    document.getElementById('board').innerHTML = stEmpty(
      'Filial biriktirilmagan — ustaxona egasiga murojaat qiling',
      'Filial biriktirilgach, buyurtmalar shu yerda ko\'rinadi.');
    return;
  }
  // PU11 demo states.
  const ds = demoState();
  const host = mode === 'board' ? document.getElementById('board') : document.getElementById('tbody');
  if (ds === 'loading') {
    host.innerHTML = mode === 'board' ? skCards(6) : skRows(8, 7);
    return;
  }
  if (ds === 'error') {
    host.innerHTML = mode === 'board'
      ? stError()
      : `<tr><td colspan="8">${stError()}</td></tr>`;
    return;
  }
  const orders = getOrders();
  if (mode === 'board') renderBoard(orders);
  else renderTable(orders);
}

// Status actions available on a card by state (no drag between columns).
// Only a manage_orders grant on THAT order's branch (or owner) may act.
function cardActions(o) {
  const items = [];
  if (!canActOn(o.branchId)) {
    return `<a class="mi" href="order-detail.html?id=${o.id}">Tafsilotlar</a>`;
  }
  if (o.state === 'new') {
    items.push(`<button class="mi" onclick="ev();confirmAction({title:'Tasdiqlash',msg:'${o.id} tasdiqlanadi (→ Tasdiqlangan).'},()=>{toast('Tasdiqlandi · ${o.id}')})">Tasdiqlash</button>`);
    items.push(`<button class="mi danger" onclick="ev();confirmAction({title:'Bekor qilish',msg:'Sabab kiriting.',reasonField:true,danger:true,okText:'Bekor qilish'},()=>toast('Bekor qilindi · ${o.id}'))">Bekor qilish</button>`);
  } else if (o.state === 'confirmed') {
    items.push(`<button class="mi" onclick="ev();confirmAction({title:'Kesuvchi tayinlash',msg:'${o.id} kesuvchiga tayinlanadi (→ Kesilmoqda).'},()=>toast('Kesuvchi tayinlandi · ${o.id}'))">Kesuvchi tayinlash</button>`);
    items.push(`<button class="mi danger" onclick="ev();confirmAction({title:'Bekor qilish',msg:'Sabab kiriting.',reasonField:true,danger:true,okText:'Bekor qilish'},()=>toast('Bekor qilindi · ${o.id}'))">Bekor qilish</button>`);
  } else if (o.state === 'cutting') {
    items.push(`<button class="mi" onclick="ev();confirmAction({title:'Kesish tugadi',msg:'Material ombordan chiqariladi.'},()=>toast('Kesish tugadi · ${o.id}'))">Kesish tugadi</button>`);
    items.push(`<button class="mi danger" onclick="ev();confirmAction({title:'Tasdiqlanganga qaytarish',msg:'Sabab kiriting.',reasonField:true,danger:true,okText:'Qaytarish'},()=>toast('Qaytarildi · ${o.id}'))">Tasdiqlanganga qaytarish</button>`);
  } else if (o.state === 'edge_banding') {
    items.push(`<button class="mi" onclick="ev();confirmAction({title:'Krom tugadi',msg:'${o.id} tayyor holatga o\\'tadi.'},()=>toast('Krom tugadi · ${o.id}'))">Krom tugadi</button>`);
    items.push(`<button class="mi danger" onclick="ev();confirmAction({title:'Kesishga qaytarish',msg:'Sabab kiriting.',reasonField:true,danger:true,okText:'Qaytarish'},()=>toast('Qaytarildi · ${o.id}'))">Kesishga qaytarish</button>`);
  } else if (o.state === 'ready') {
    items.push(`<button class="mi" onclick="ev();confirmAction({title:'Olib ketildi',msg:'Mijoz hammasini olib ketdimi? (→ Tugallandi)',okText:'Ha, olib ketdi'},()=>toast('Olib ketildi · ${o.id}'))">Mijoz olib ketdi</button>`);
    items.push(`<button class="mi danger" onclick="ev();confirmAction({title:'Kromga qaytarish',msg:'Sabab kiriting.',reasonField:true,danger:true,okText:'Qaytarish'},()=>toast('Qaytarildi · ${o.id}'))">Kromga qaytarish</button>`);
  }
  items.push(`<div class="sep"></div><a class="mi" href="order-detail.html?id=${o.id}">Tafsilotlar</a>`);
  return items.join('');
}
window.ev = () => {};

function workerChip(o) {
  const chips = [];
  if (o.assignedCutter) chips.push(`<span class="pill p-cut" style="font-size:9.5px">${window.icon('scissors',{size:11})} ${SEED.lookup.userById(o.assignedCutter)?.initials || ''}</span>`);
  if (o.assignedEdger) chips.push(`<span class="pill p-eb" style="font-size:9.5px">${window.icon('layers',{size:11})} ${SEED.lookup.userById(o.assignedEdger)?.initials || ''}</span>`);
  return chips.join(' ');
}

function renderBoard(orders) {
  const board = document.getElementById('board');
  if (orders.length === 0) {
    board.innerHTML = stEmpty("Filial(lar)ingizda buyurtma yo'q",
      'Tanlangan filtrga mos buyurtma yo\'q.');
    return;
  }
  const activeOrders = orders.filter(o => COLS.includes(o.state));
  if (activeOrders.length === 0) {
    board.innerHTML = stEmpty('Bu filtrda faol taxta kartalari yo\'q',
      'Tugatilgan yoki bekor qilingan buyurtmalarni jadval rejimida ko\'ring.');
    return;
  }
  board.innerHTML = COLS.map(c => {
    const cards = activeOrders.filter(o => o.state === c).sort((a, b) => (b.priority || 0) - (a.priority || 0));
    return `<div class="board-col">
      <h4>${SEED.STATE_LABELS[c]} <span class="ct">${cards.length}</span></h4>
      ${cards.map(o => {
        const cl = SEED.lookup.clientById(o.clientId);
        const n = itemCount(o);
        return `
        <article class="board-card" onclick="if(!event.target.closest('.menu-wrap'))location.href='order-detail.html?id=${o.id}'">
          <div class="top"><span class="id">${o.id}</span><span class="amt">${fmtTiyin(o.totalTiyin)}</span></div>
          <div class="who">${cl?.name || ''}</div>
          <div class="meta">
            ${n ? `<span style="font-size:10.5px;color:var(--ink-6)">${n} qism</span>` : ''}
            <span style="font-size:10.5px;color:var(--ink-6)">${o.placedAt || ''}</span>
            ${workerChip(o)}
          </div>
          <div class="meta" style="margin-top:6px">
            <div class="menu-wrap" style="margin-left:auto">
              <button class="btn btn-outline btn-sm" type="button" data-menu-toggle aria-label="${o.id} holat amallari">Holat <i data-icon="more-horizontal"></i></button>
              <div class="menu">${cardActions(o)}</div>
            </div>
          </div>
        </article>`;
      }).join('')}
      ${cards.length === 0 ? `<div style="color:var(--ink-6);font-size:11.5px;padding:14px 6px;text-align:center">bo'sh</div>` : ''}
    </div>`;
  }).join('');
}

function renderTable(orders) {
  const tb = document.getElementById('tbody');
  if (orders.length === 0) { tb.innerHTML = `<tr><td colspan="8">${stEmpty("Filial(lar)ingizda buyurtma yo'q", 'Tanlangan filtrga mos buyurtma yo\'q.')}</td></tr>`; return; }
  tb.innerHTML = orders.map(o => {
    const cl = SEED.lookup.clientById(o.clientId);
    const br = SEED.lookup.branchById(o.branchId);
    return `<tr class="clickable" onclick="location.href='order-detail.html?id=${o.id}'">
      <td class="id">${o.id}</td>
      <td class="nm">${cl?.name || '—'}</td>
      <td>${br?.name || ''}</td>
      <td><span class="pill ${SEED.STATE_PILL[o.state]}"><span class="pd"></span>${SEED.STATE_LABELS[o.state]}</span></td>
      <td>${workerChip(o) || '<span class="muted">—</span>'}</td>
      <td class="amt">${fmtTiyin(o.totalTiyin)}</td>
      <td style="font-size:11.5px;color:var(--ink-6);font-family:var(--f-mono)">${o.placedAt}</td>
      <td onclick="event.stopPropagation()">
        <div class="menu-wrap">
          <button class="menu-btn" type="button" data-menu-toggle aria-label="${o.id} amallari"><i data-icon="more-horizontal"></i></button>
          <div class="menu">${cardActions(o)}</div>
        </div>
      </td>
    </tr>`;
  }).join('');
}

window.addEventListener('branchchange', (e) => {
  const sel = document.getElementById('branch-filter');
  const id = e.detail?.id;
  if (id && [...sel.options].some(o => o.value === id)) sel.value = id;
  else if ([...sel.options].some(o => o.value === 'all')) sel.value = 'all';
  render();
});

setMode('board');
</script>
</body>
</html>
