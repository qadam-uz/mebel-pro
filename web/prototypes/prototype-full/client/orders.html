<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mening buyurtmalarim — Mebel Pro · Mijoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
<style>
  .ord-card { background: var(--elev); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 12px; cursor: pointer; transition: border-color .12s, transform .12s; }
  .ord-card:hover { border-color: var(--ink-12); transform: translateY(-1px); }
  .ord-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 12px; }
  .ord-card .id { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-6); letter-spacing: .04em; }
  .ord-card h3 { font-family: var(--f-display); font-size: 18px; font-weight: 600; margin: 4px 0; letter-spacing: -.01em; }
  .ord-card .meta { font-size: 13px; color: var(--ink-8); }
  .ord-card .meta b { color: var(--ink-12); font-weight: 600; }
  .ord-card .foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); }
  .ord-card .total { font-family: var(--f-mono); font-size: 15px; font-weight: 600; }
  .ord-card .total small { font: 500 11px var(--f-ui); color: var(--ink-6); }
</style>
</head>
<body>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/client-shell.js"></script>
<script>renderClientHeader('orders.html');</script>

<main class="container" style="padding: 24px 0 64px">
  <div class="page-head">
    <div>
      <h1>Mening buyurtmalarim</h1>
      <p class="sub">Faol va tugatilgan buyurtmalaringiz.</p>
    </div>
    <div class="tools">
      <a class="btn btn-acc" href="cutting-drafts.html"><i class="ic" data-icon="plus"></i> Yangi buyurtma</a>
    </div>
  </div>

  <div class="filters">
    <div class="chips">
      <button class="chip on" data-filter="all" onclick="setFilter('all')">Hammasi</button>
      <button class="chip" data-filter="active" onclick="setFilter('active')">Faol</button>
      <button class="chip" data-filter="completed" onclick="setFilter('completed')">Tugatilgan</button>
      <button class="chip" data-filter="cancelled" onclick="setFilter('cancelled')">Bekor qilingan</button>
    </div>
    <div class="input">
      <input id="search" placeholder="Buyurtma raqami..." oninput="render()" />
    </div>
  </div>

  <div id="orders"></div>
</main>

<script>
/* Pricing is frozen at placement — the order card shows the frozen total
   from the very first status (never "price after confirm").
   Client status uses CLIENT_PHASES (5 phases). ?state= for the demo. */
const ACTIVE = ['new','confirmed','cutting','edge_banding','ready'];
let filter = 'all';
const clientId = 'c01';
const forced = new URLSearchParams(location.search).get('state');
let loaded = false;
let dataEmpty = false;

function setFilter(f) {
  filter = f;
  document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('on', b.dataset.filter === f));
  render();
}

function clientFacingState(o) { return SEED.CLIENT_PHASES[o.state]; }

function nextAction(o) {
  if (o.state === 'new') return `<span class="btn btn-outline btn-sm" onclick="event.stopPropagation();cancelOrder('${o.id}')">Bekor qilish</span>`;
  if (['confirmed','cutting','edge_banding'].includes(o.state)) return `<span class="btn btn-acc btn-sm" onclick="event.stopPropagation();location.href='order-detail.html?id=${o.id}'">Kuzatish</span>`;
  if (o.state === 'ready') return `<span class="btn btn-acc btn-sm" onclick="event.stopPropagation();location.href='order-detail.html?id=${o.id}'">Olishga tayyor</span>`;
  if (o.state === 'completed') return `<span class="btn btn-outline btn-sm" onclick="event.stopPropagation();location.href='order-detail.html?id=${o.id}'">Tafsilot</span>`;
  return '';
}

function skeleton() {
  document.getElementById('orders').innerHTML = Array.from({ length: 4 }).map(() => `
    <div class="ord-card">
      <div class="sk sk-line" style="width:30%"></div>
      <div class="sk sk-line" style="width:55%;margin-top:10px;height:18px"></div>
      <div class="sk sk-line" style="width:38%;margin-top:18px"></div>
    </div>`).join('');
}

function errorState() {
  document.getElementById('orders').innerHTML = `
    <div class="st-error">
      <div class="ic"><i data-icon="alert"></i></div>
      <h3>Buyurtmalarni yuklab bo'lmadi</h3>
      <p>Ulanishda xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring.</p>
      <p class="trace">trace_id: tr-${Math.random().toString(16).slice(2,8)}</p>
      <button class="btn btn-outline" type="button" onclick="boot()"><i class="ic" data-icon="refresh"></i> Qayta urinish</button>
    </div>`;
}

function render() {
  if (!loaded) return;
  const q = document.getElementById('search').value.trim().toLowerCase();
  const all = dataEmpty ? [] : SEED.orders.filter(o => o.clientId === clientId);
  const orders = all.filter(o => {
    if (filter === 'active' && !ACTIVE.includes(o.state)) return false;
    if (filter === 'completed' && o.state !== 'completed') return false;
    if (filter === 'cancelled' && o.state !== 'cancelled') return false;
    if (q && !o.id.toLowerCase().includes(q)) return false;
    return true;
  });
  const wrap = document.getElementById('orders');
  if (orders.length === 0) {
    const msg = (filter === 'all' && !q)
      ? 'Hali buyurtma bermagansiz — chizmadan boshlang.'
      : 'Bu so\'rovga mos buyurtma topilmadi.';
    wrap.innerHTML = `<div class="st-empty"><div class="ic"><i data-icon="inbox"></i></div><h3>Buyurtma yo'q</h3><p>${msg}</p><a class="btn btn-acc" href="cutting-drafts.html"><i class="ic" data-icon="plus"></i> Yangi buyurtma</a></div>`;
    return;
  }
  wrap.innerHTML = orders.map(o => {
    const br = SEED.lookup.branchById(o.branchId);
    const action = nextAction(o);
    return `
      <article class="ord-card" onclick="location.href='order-detail.html?id=${o.id}'">
        <div class="top">
          <div>
            <h3>${o.id}</h3>
            <div class="meta">${br?.city} ${br?.name} · ${o.placedAt}${o.dueAt && o.state !== 'cancelled' ? ` · olib ketish ${o.dueAt}` : ''}</div>
          </div>
          <span class="pill ${SEED.STATE_PILL[o.state]}"><span class="pd"></span>${clientFacingState(o)}</span>
        </div>
        <div class="foot">
          <div class="total">${fmtTiyin(o.totalTiyin)} <small>jami narx</small></div>
          <div>${action}</div>
        </div>
      </article>
    `;
  }).join('');
}

function cancelOrder(id) {
  confirmAction({
    title: 'Buyurtmani bekor qilish',
    msg: 'Buyurtma bekor qilinadi. Bu amal qaytarilmaydi.',
    reasonField: true, reasonLabel: 'Sabab',
    okText: 'Bekor qilish', danger: true
  }, () => { toast('Buyurtma bekor qilindi'); render(); });
}

function boot() {
  loaded = false;
  if (forced === 'error') { errorState(); return; }
  if (forced === 'empty') { dataEmpty = true; loaded = true; render(); return; }
  skeleton();
  setTimeout(() => { loaded = true; render(); }, forced === 'loading' ? 100000 : 450);
}
boot();
</script>
</body>
</html>
