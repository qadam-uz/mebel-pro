<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Buyurtma — Mebel Pro · Mijoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
<style>
  .od-grid { display: grid; gap: 18px; grid-template-columns: 1fr; }
  @media (min-width: 1024px) { .od-grid { grid-template-columns: 1.4fr .85fr; gap: 24px; } }
  .od-head { background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; margin-bottom: 18px; }
  .od-head .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .od-head h1 { font-family: var(--f-display); font-size: 28px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; }
  .od-head .id { font-family: var(--f-mono); font-size: 12px; color: var(--ink-6); letter-spacing: .04em; }
  .od-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .totals { background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; font-size: 13px; }
  .totals .r { display: flex; justify-content: space-between; padding: 4px 0; color: var(--ink-8); }
  .totals .r .num { color: var(--ink-12); font-weight: 500; }
  .totals .grand { padding-top: 8px; margin-top: 6px; border-top: 1px solid var(--ink-12); font-size: 15px; font-weight: 600; }
  .totals .grand .num { font-family: var(--f-display); font-size: 22px; }
</style>
</head>
<body>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/client-shell.js"></script>
<script>renderClientHeader('orders.html');</script>

<main class="container" style="padding: 24px 0 64px">
  <button class="back" type="button" onclick="history.back()">← Buyurtmalar</button>

  <div id="new-banner" class="banner success" style="display: none">
    <div class="ic">✓</div>
    <div class="grow">Buyurtma berildi — ustaxona ko'rib chiqib siz bilan bog'lanadi.</div>
  </div>

  <div id="od-wrap"></div>
</main>

<script>
/* One money rule (CR7): the frozen total + full price breakdown is on the
   Overview tab from placement onward (pricing is frozen at creation —
   nothing to hide). The settlement figures (to'langan / qoldiq) live on a
   dedicated Finance tab that is gated to ready/completed only.
   Client status uses CLIENT_PHASES. ?state=loading|error for the demo. */
const id = new URLSearchParams(location.search).get('id') || 'ORD-2026-000091';
const isNew = new URLSearchParams(location.search).get('new') === '1';
const forced = new URLSearchParams(location.search).get('state');
if (isNew) document.getElementById('new-banner').style.display = '';
const wrap = document.getElementById('od-wrap');

// Single source for the client-facing phase label.
function clientFacingState(o) { return SEED.CLIENT_PHASES[o.state]; }

function notFound() {
  document.getElementById('new-banner').style.display = 'none';
  wrap.innerHTML = `<div class="st-empty">
    <div class="ic">∅</div>
    <h3>Buyurtma topilmadi</h3>
    <p>Bunday raqamli buyurtma yo'q yoki sizga tegishli emas.</p>
    <a class="btn btn-acc" href="orders.html">Buyurtmalarim</a>
  </div>`;
}

function skeleton() {
  wrap.innerHTML = `
    <div class="od-head">
      <div class="sk sk-line" style="width:28%"></div>
      <div class="sk sk-line" style="width:55%;margin-top:12px;height:26px"></div>
      <div class="sk sk-line" style="width:40%;margin-top:18px;height:30px"></div>
    </div>
    <div class="sk sk-line" style="width:100%;height:200px;border-radius:12px"></div>`;
}

function errorState() {
  wrap.innerHTML = `
    <div class="st-error">
      <div class="ic">!</div>
      <h3>Buyurtmani yuklab bo'lmadi</h3>
      <p>Ulanishda xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring.</p>
      <p class="trace">trace_id: tr-${Math.random().toString(16).slice(2,8)}</p>
      <button class="btn btn-outline" type="button" onclick="boot()">Qayta urinish</button>
    </div>`;
}

function renderOrder(o) {
  const br = SEED.lookup.branchById(o.branchId);
  const tl = buildTimeline(o);
  const cutting = SEED.lookup.cuttingById(o.cuttingId);
  const banded = SEED.lookup.isBanded(cutting || {});
  const cuttingInvalidated = cutting && cutting.status === 'invalidated';
  const fin = SEED.lookup.orderFinance(o);
  const financeOpen = ['ready', 'completed'].includes(o.state);

  // Frozen price breakdown — always shown on Overview from placement on.
  const itemsRows = [
    { lbl: 'Chizma xizmati', val: fmtTiyin(o.subtotalCuttingTiyin) },
    { lbl: 'Material', val: fmtTiyin(o.subtotalMaterialsTiyin) }
  ];
  if (o.subtotalEdgeBandingTiyin) itemsRows.push({ lbl: 'Krom yopishtirish', val: fmtTiyin(o.subtotalEdgeBandingTiyin) });
  if (o.discountTiyin) itemsRows.push({ lbl: `Chegirma${o.discountReason ? ' · ' + o.discountReason : ''}`, val: '− ' + fmtTiyin(o.discountTiyin) });

  wrap.innerHTML = `
    <div class="od-head">
      <div class="top">
        <div>
          <div class="id">${o.id} · ${br?.city} ${br?.name}</div>
          <h1>${o.title}</h1>
          <div class="muted">${o.placedAt} · ustaxonadan olib ketish</div>
        </div>
        <div style="text-align: right">
          <span class="pill ${SEED.STATE_PILL[o.state]}"><span class="pd"></span>${clientFacingState(o)}</span>
          <div class="num" style="margin-top: 6px; font-size: 18px; font-weight: 600">${fmtTiyin(o.totalTiyin)}</div>
          <div style="font:500 11px var(--f-ui);color:var(--ink-6)">jami narx (qat'iy)</div>
        </div>
      </div>
      <div class="actions">
        ${detailActions(o)}
      </div>
    </div>

    ${o.state === 'cancelled' ? `
      <div class="banner warn" style="margin-bottom: 18px">
        <div class="ic">!</div>
        <div class="grow">Buyurtma bekor qilindi${o.cancelledAt ? ` · ${o.cancelledAt}` : ''}.${o.cancelReason ? ` Sabab: <b>${o.cancelReason}</b>` : ''}</div>
      </div>
    ` : ''}

    <div class="tabs" data-tabs="od">
      <button class="tab on" data-target="t-overview" onclick="switchTab('od','t-overview')">Umumiy</button>
      <button class="tab" data-target="t-cutting" onclick="switchTab('od','t-cutting')">Chizma</button>
      <button class="tab" data-target="t-finance" onclick="onFinanceTab(${financeOpen})">To'lov</button>
      <button class="tab" data-target="t-timeline" onclick="switchTab('od','t-timeline')">Tarix</button>
    </div>

    <div class="od-grid">
      <div>
        <section id="t-overview" data-panel-group="od">
          <div class="card">
            <div class="card-h"><h2>Buyurtma tarkibi</h2></div>
            <div class="card-b" style="padding-top: 0">
              <div class="row-item"><div><div class="nm">Chizma</div><small style="color:var(--ink-6)">${o.cuttingId}</small></div><div class="meta">${fmtTiyin(o.subtotalCuttingTiyin)}</div></div>
              <div class="row-item"><div><div class="nm">Material</div><small style="color:var(--ink-6)">ustaxona materiali</small></div><div class="meta">${fmtTiyin(o.subtotalMaterialsTiyin)}</div></div>
              ${o.subtotalEdgeBandingTiyin ? `<div class="row-item"><div><div class="nm">Krom yopishtirish</div></div><div class="meta">${fmtTiyin(o.subtotalEdgeBandingTiyin)}</div></div>` : ''}
              ${o.discountTiyin ? `<div class="row-item"><div><div class="nm">Chegirma</div><small style="color:var(--ink-6)">${o.discountReason || ''}</small></div><div class="meta success-text">− ${fmtTiyin(o.discountTiyin)}</div></div>` : ''}
            </div>
          </div>

          <div class="card" style="margin-top: 14px">
            <div class="card-h"><h2>Narx</h2></div>
            <div class="card-b" style="padding-top: 0">
              <div class="totals" style="margin-top:4px">
                ${itemsRows.map(r => `<div class="r"><span>${r.lbl}</span><span class="num">${r.val}</span></div>`).join('')}
                <div class="r grand"><span>Jami</span><span class="num">${fmtTiyin(o.totalTiyin)}</span></div>
              </div>
              <p class="muted" style="font-size:12.5px;margin:10px 2px 0">Narx buyurtma berilganda qat'iy belgilangan — keyin o'zgarmaydi.</p>
            </div>
          </div>

          <div class="card" style="margin-top: 14px">
            <div class="card-h"><h2>Olib ketish</h2></div>
            <div class="card-b" style="padding-top: 0">
              <div class="row-item">
                <div>
                  <div class="nm">${br?.city} · ${br?.name}</div>
                  <small style="color:var(--ink-6)">${br?.addr || ''}</small>
                </div>
                <div class="meta">${br?.phone || ''}</div>
              </div>
              <div class="row-item"><div><div class="nm">Ish vaqti</div></div><div class="meta">${br?.hours || ''}</div></div>
              ${o.dueAt ? `<div class="row-item"><div><div class="nm">Taxminiy sana</div></div><div class="meta">${o.dueAt}</div></div>` : ''}
            </div>
          </div>
        </section>

        <section id="t-cutting" data-panel-group="od" hidden>
          ${cuttingInvalidated ? `
            <div class="banner warn" style="margin-bottom:14px">
              <div class="ic">!</div>
              <div class="grow">Bu buyurtmaga yangiroq chizma natijasi biriktirilgan. Quyidagi tugma orqali joriy natijani ko'ring.</div>
            </div>` : ''}
          <div class="card">
            <div class="card-h">
              <h2>Chizma</h2>
              <a class="more" href="cutting.html?id=${o.cuttingId}">To'liq ko'rish →</a>
            </div>
            <div class="card-b" style="padding-top: 0">
              <p class="muted" style="font-size:13px;margin:0 0 14px">Chizma · ${o.cuttingId}${banded ? ' · krom yopishtirish bor' : ''}</p>
              <button class="btn btn-outline btn-block" type="button" onclick="toast('PDF tayyorlanmoqda')">⬇ Chizmani PDF olish</button>
            </div>
          </div>
        </section>

        <section id="t-finance" data-panel-group="od" hidden>
          ${financeOpen ? `
          <div class="card">
            <div class="card-h"><h2>To'lov</h2></div>
            <div class="card-b" style="padding-top: 0">
              <div class="totals" style="margin-top:4px">
                <div class="r"><span>Jami</span><span class="num">${fmtTiyin(fin.total)}</span></div>
                <div class="r"><span>To'langan</span><span class="num success-text">− ${fmtTiyin(fin.paid)}</span></div>
                <div class="r grand"><span>Qoldiq</span><span class="num">${fmtTiyin(fin.balance)}</span></div>
              </div>
              <p class="muted" style="font-size:12.5px;margin:12px 2px 0">To'lov ustaxonada qabul qilinadi. Agar to'lov bo'yicha nomuvofiqlik bo'lsa — to'lov bo'yicha ustaxonaga murojaat qiling.</p>
            </div>
          </div>` : `
          <div class="card">
            <div class="card-b">
              <div class="st-empty" style="border:0;padding:32px 16px">
                <div class="ic">🔒</div>
                <h3>To'lov ma'lumotlari hali yopiq</h3>
                <p>To'lov ma'lumotlari buyurtma tayyor bo'lganda ochiladi.</p>
              </div>
            </div>
          </div>`}
        </section>

        <section id="t-timeline" data-panel-group="od" hidden>
          <div class="card">
            <div class="card-h"><h2>Holatlar tarixi</h2></div>
            <div class="card-b" style="padding: 14px 22px 22px">
              <ol class="tl">${tl}</ol>
            </div>
          </div>
        </section>
      </div>

      <aside>
        <div class="card">
          <div class="card-h"><h2 style="font-size: 16px">Ustaxonaga aloqa</h2></div>
          <div class="card-b" style="padding-top: 0; font-size: 13px">
            <div class="row-item"><div><div class="nm">Furniture House</div></div><div class="meta">${br?.phone || ''}</div></div>
            <div class="row-item"><div><div class="nm">${br?.city} ${br?.name}</div><small style="color:var(--ink-6)">${br?.addr || ''}</small></div><div></div></div>
            <div class="row-item"><div><div class="nm">Ish vaqti</div></div><div class="meta">${br?.hours || ''}</div></div>
          </div>
        </div>
      </aside>
    </div>
  `;
}

// Finance tab is gated to ready/completed — clicking it before then keeps
// the locked panel visible and explains when it opens.
function onFinanceTab(open) {
  switchTab('od', 't-finance');
  if (!open) toast("To'lov ma'lumotlari buyurtma tayyor bo'lganda ochiladi", 'warn');
}

function detailActions(o) {
  const actions = [];
  if (o.state === 'new') {
    actions.push(`<button class="btn btn-danger btn-sm" type="button" onclick="cancelOrder('${o.id}')">Bekor qilish</button>`);
  } else if (['confirmed','cutting','edge_banding','ready'].includes(o.state)) {
    actions.push(`<button class="btn btn-outline btn-sm" type="button" onclick="switchTab('od','t-timeline');document.getElementById('t-timeline').scrollIntoView({behavior:'smooth'})">Holatni kuzatish</button>`);
    actions.push(`<button class="btn btn-outline btn-sm" type="button" onclick="toast('PDF tayyorlanmoqda')">Hujjatlar (PDF)</button>`);
  } else if (o.state === 'completed') {
    actions.push(`<button class="btn btn-outline btn-sm" type="button" onclick="toast('PDF tayyorlanmoqda')">Hujjatlar (PDF)</button>`);
  }
  return actions.join('');
}

function buildTimeline(o) {
  if (o.state === 'cancelled') {
    return `<li class="step done"><span class="when">${o.placedAt}</span>${SEED.CLIENT_PHASES.new}</li>
            <li class="step bad"><span class="when">${o.cancelledAt || '—'}</span>${SEED.CLIENT_PHASES.cancelled}${o.cancelReason ? ` · <span class="who">${o.cancelReason}</span>` : ''}</li>`;
  }
  // 5 client phases from CLIENT_PHASES. "Ishlab chiqarishda" covers internal
  // cutting + edge_banding; the sub-text names the current internal step.
  const prodWhen = o.cutCompletedAt || '—';
  let prodSub = '';
  if (o.state === 'cutting') prodSub = 'Kesilmoqda';
  else if (o.state === 'edge_banding') prodSub = 'Krom yopishtirilmoqda';
  const steps = [
    { label: SEED.CLIENT_PHASES.new, phase: 0, when: o.placedAt },
    { label: SEED.CLIENT_PHASES.confirmed, phase: 1, when: o.confirmedAt || '—' },
    { label: SEED.CLIENT_PHASES.cutting, phase: 2, when: prodWhen, who: prodSub },
    { label: SEED.CLIENT_PHASES.ready, phase: 3, when: o.edgeCompletedAt || o.cutCompletedAt || '—' },
    { label: SEED.CLIENT_PHASES.completed, phase: 4, when: o.pickedUpAt || '—' }
  ];
  const phaseOf = { new: 0, confirmed: 1, cutting: 2, edge_banding: 2, ready: 3, completed: 4 };
  const cur = phaseOf[o.state] ?? 0;
  return steps.map(s => {
    const cls = s.phase < cur ? 'done' : s.phase === cur ? 'now' : '';
    return `<li class="step ${cls}"><span class="when">${s.when}</span>${s.label}${s.who ? ` · <span class="who">${s.who}</span>` : ''}</li>`;
  }).join('');
}

function cancelOrder(id) {
  confirmAction({
    title: 'Buyurtmani bekor qilish',
    msg: 'Buyurtma bekor qilinadi. Bu amal qaytarilmaydi.',
    reasonField: true, reasonLabel: 'Sabab',
    okText: 'Bekor qilish', danger: true
  }, () => { toast('Buyurtma bekor qilindi'); setTimeout(() => location.href = 'orders.html', 700); });
}

function boot() {
  if (forced === 'error') { errorState(); return; }
  const o = SEED.lookup.orderById(id);
  if (!o) { notFound(); return; }
  skeleton();
  setTimeout(() => { renderOrder(o); }, forced === 'loading' ? 100000 : 400);
}
boot();
</script>
</body>
</html>
