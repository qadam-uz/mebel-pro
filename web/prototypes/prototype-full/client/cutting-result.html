<title>Yo'naltirilmoqda… — Mebel Pro</title>
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<script>
/* A confirmed/invalidated cutting result is just the cutting workspace in
   its read-only mode — there is no separate result screen. Preserve the id
   (no default that would mask a bad link) and hand off to cutting.html,
   which renders the bound, read-only view (or a not-found state). */
const id = new URLSearchParams(location.search).get('id');
location.replace('cutting.html' + (id ? '?id=' + encodeURIComponent(id) : ''));
</script>
