<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bildirishnomalar — Mebel Pro · Mijoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
<style>
  .note-card { display: grid; grid-template-columns: 38px 1fr auto; gap: 14px; padding: 14px 18px; background: var(--elev); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; align-items: center; cursor: pointer; transition: border-color .12s; text-align: left; width: 100%; box-sizing: border-box; }
  .note-card:hover { border-color: var(--ink-12); }
  .note-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note-card.unread { background: var(--accent-soft); border-color: var(--accent-tint); }
  .note-card .ic { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; font: 700 14px var(--f-display); color: #fff; }
  .note-card .ic.order { background: var(--accent); }
  .note-card .ic.ready { background: var(--success); }
  .note-card .ic.cancel { background: var(--danger); }
  .note-card .nm { font: 600 14px var(--f-ui); color: var(--ink-12); }
  .note-card .body { font-size: 12.5px; color: var(--ink-8); margin-top: 2px; }
  .note-card .t { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-6); white-space: nowrap; }
  .sk-note { display: grid; grid-template-columns: 38px 1fr 64px; gap: 14px; padding: 14px 18px; background: var(--elev); border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px; align-items: center; }
  .sk-note .sk { width: 38px; height: 38px; border-radius: 8px; }
</style>
</head>
<body>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/client-shell.js"></script>
<script>renderClientHeader('');</script>

<main class="container" style="padding: 24px 0 64px">
  <button class="back" type="button" onclick="history.back()"><i class="ic" data-icon="arrow-left"></i> Orqaga</button>

  <div class="page-head">
    <div>
      <h1>Bildirishnomalar</h1>
      <p class="sub">Buyurtma o'zgarishlari va ustaxonadan xabarlar.</p>
    </div>
    <div class="tools">
      <button class="btn btn-outline" type="button" onclick="markAllRead()">Hammasini o'qildi deb belgilash</button>
    </div>
  </div>

  <div class="filters" style="margin-bottom: 14px">
    <div class="chips">
      <button class="chip on" data-filter="all" onclick="setFilter('all')">Hammasi</button>
      <button class="chip" data-filter="unread" onclick="setFilter('unread')">O'qilmagan</button>
      <button class="chip" data-filter="read" onclick="setFilter('read')">O'qilgan</button>
    </div>
  </div>

  <div id="notes" style="max-width: 760px"></div>
</main>

<script>
/* The notification inbox shares the client's notification store from
   client-shell.js, so the bell badge and this page never drift.
   ?state=loading|error|empty toggles the data-screen states for the demo. */
const items = window.clientNotifications || [];
let filter = 'all';
const forced = new URLSearchParams(location.search).get('state');

function setFilter(f) {
  filter = f;
  document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('on', b.dataset.filter === f));
  render();
}

function skeleton() {
  const wrap = document.getElementById('notes');
  wrap.innerHTML = Array.from({ length: 5 }).map(() => `
    <div class="sk-note">
      <div class="sk"></div>
      <div><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:85%;margin-top:8px"></div></div>
      <div class="sk sk-line" style="width:48px"></div>
    </div>`).join('');
}

function errorState() {
  document.getElementById('notes').innerHTML = `
    <div class="st-error">
      <div class="ic"><i data-icon="alert"></i></div>
      <h3>Bildirishnomalarni yuklab bo'lmadi</h3>
      <p>Ulanishda xatolik. Birozdan so'ng qayta urinib ko'ring.</p>
      <p class="trace">trace_id: tr-${Math.random().toString(16).slice(2,8)}</p>
      <button class="btn btn-outline" type="button" onclick="boot()"><i class="ic" data-icon="refresh"></i> Qayta urinish</button>
    </div>`;
}

function render() {
  const list = items.filter(n =>
    filter === 'all' ||
    (filter === 'unread' && !n.read) ||
    (filter === 'read' && n.read));
  const wrap = document.getElementById('notes');
  if (list.length === 0) {
    const msg = filter === 'unread'
      ? "O'qilmagan bildirishnoma yo'q — hammasini ko'rib chiqdingiz."
      : filter === 'read'
      ? "O'qilgan bildirishnoma yo'q."
      : "Hozircha bildirishnoma yo'q — buyurtma holati o'zgarsa shu yerda ko'rinadi.";
    wrap.innerHTML = `<div class="st-empty"><div class="ic"><i data-icon="check"></i></div><h3>Bildirishnoma yo'q</h3><p>${msg}</p></div>`;
    return;
  }
  wrap.innerHTML = list.map(n => `
    <button class="note-card ${n.read ? '' : 'unread'}" type="button" onclick="openNote('${n.id}', '${n.link}')">
      <div class="ic ${n.kind}">${n.kind[0].toUpperCase()}</div>
      <div>
        <div class="nm">${n.title}</div>
        <div class="body">${n.body}</div>
      </div>
      <div class="t">${n.t}</div>
    </button>
  `).join('');
}

function openNote(id, link) {
  const it = items.find(n => n.id === id);
  if (it) it.read = true;
  location.href = link;
}

function markAllRead() {
  items.forEach(n => n.read = true);
  toast('Hammasi o\'qildi deb belgilandi');
  render();
}

function boot() {
  if (forced === 'error') { errorState(); return; }
  if (forced === 'empty') { items.length = 0; render(); return; }
  skeleton();
  // Simulated fetch — never an infinite spinner.
  setTimeout(() => {
    render();
  }, forced === 'loading' ? 100000 : 450);
}
boot();
</script>
</body>
</html>
