<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Chizmalar — Mebel Pro · Mijoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
<style>
  .hero { padding: 40px 0 28px; }
  .hero h1 { font: 600 32px var(--f-display); color: var(--ink-12); margin: 0 0 10px; letter-spacing: -.02em; }
  .hero p { font: 400 15.5px/1.55 var(--f-ui); color: var(--ink-8); margin: 0; max-width: 56ch; }
  .hero .cta { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }

  .drafts-hd { display: flex; align-items: baseline; justify-content: space-between; padding: 0 0 12px; border-bottom: 1px solid var(--line); margin: 12px 0 18px; }
  .drafts-hd h2 { font: 600 18px var(--f-display); margin: 0; color: var(--ink-12); }
  .drafts-hd .ct { font: 500 13px var(--f-mono); color: var(--ink-6); }

  .draft-card { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; background: var(--elev); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: border-color .12s, transform .12s; }
  .draft-card:hover { border-color: var(--ink-10); transform: translateY(-1px); }
  .draft-card .nm { font: 500 14.5px var(--f-ui); color: var(--ink-12); margin-bottom: 4px; }
  .draft-card .meta { font: 400 12px var(--f-mono); color: var(--ink-6); }
  .draft-card .stats { display: flex; gap: 14px; flex-wrap: wrap; font: 500 12px var(--f-ui); color: var(--ink-10); margin-top: 6px; }
  .draft-card .stats b { font: 600 13px var(--f-mono); color: var(--ink-12); }
  .draft-card .right { display: flex; align-items: center; gap: 8px; }
  .open-aff { display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px var(--f-ui); color: var(--accent); white-space: nowrap; }
  .open-aff svg { width: 14px; height: 14px; transition: transform .12s; }
  .draft-card:hover .open-aff svg { transform: translateX(2px); }
</style>
</head>
<body>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/client-shell.js"></script>
<script>renderClientHeader('cutting-drafts.html');</script>

<main class="container" style="padding: 28px 0 64px">
  <div class="page-head">
    <div>
      <h1>Saqlangan chizmalar</h1>
      <p class="sub">Saqlangan chizmani oching yoki yangi chizma boshlang.</p>
    </div>
    <div class="tools">
      <a class="btn btn-acc" href="cutting.html?id=new">+ Yangi chizma</a>
    </div>
  </div>

  <div class="drafts-hd">
    <h2>Hammasi</h2>
    <span class="ct" id="drafts-ct">0 ta</span>
  </div>

  <div id="drafts"></div>
</main>

<script>
function renderDrafts() {
  const drafts = SEED.cuttings.filter(c => c.status === 'draft');
  document.getElementById('drafts-ct').textContent = drafts.length + ' ta';
  const wrap = document.getElementById('drafts');
  if (drafts.length === 0) {
    wrap.innerHTML = `<div class="empty">
      <div class="ic">∅</div>
      <h3>Saqlangan chizma yo&#39;q</h3>
      <p>Yangi chizmadan boshlang.</p>
      <a class="btn btn-acc" href="cutting.html?id=new">+ Yangi chizma</a>
    </div>`;
    return;
  }
  wrap.innerHTML = drafts.map(c => {
    const matIds = [...new Set(c.partList.map(p => p.matId).filter(Boolean))];
    const matLabels = matIds.map(id => SEED.lookup.matById(id)?.name.split('·')[0].trim() || id).filter(Boolean);
    const matLabel = matLabels.slice(0, 2).join(' + ') + (matLabels.length > 2 ? ` +${matLabels.length - 2}` : '');
    const algo = SEED.lookup.chosenAlgo(c);
    const sheets = algo ? Object.values(algo.sheetsByMat).reduce((a,b)=>a+b,0) : 0;
    const totalQty = c.partList.reduce((a,p) => a + (p.qty || 0), 0);
    return `
      <article class="draft-card" onclick="location.href='cutting.html?id=${c.id}'">
        <div>
          <div class="nm">${c.id} · ${matLabel || 'Material tanlanmagan'}</div>
          <div class="stats">
            <span><b>${totalQty}</b> qism</span>
            <span><b>${sheets || '—'}</b> list</span>
            ${algo ? `<span><b>${algo.wastePct}%</b> chiqim</span>` : ''}
            <span style="color:var(--ink-6)">${c.when} · tahrirlangan</span>
          </div>
        </div>
        <div class="right">
          <span class="open-aff">Ochish<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
        </div>
      </article>
    `;
  }).join('');
}
renderDrafts();
</script>
</body>
</html>
