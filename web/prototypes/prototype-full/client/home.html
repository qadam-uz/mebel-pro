<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bosh sahifa — Mebel Pro · Mijoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
<style>
  .home-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .home-top h1 { font: 600 26px var(--f-display); letter-spacing: -.02em; margin: 0; color: var(--ink-12); }

  /* Status chips — scannable counts, each a jump-off to its tab. */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 18px; }
  .stat { display: flex; align-items: center; gap: 12px; background: var(--elev); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 13px 16px; text-decoration: none; transition: border-color .12s ease, transform .12s ease; }
  .stat:hover { border-color: var(--ink-10); transform: translateY(-1px); }
  .stat .si { width: 34px; height: 34px; border-radius: 9px; background: var(--sunk); color: var(--ink-7); display: grid; place-items: center; flex: none; }
  .stat .si svg { width: 17px; height: 17px; }
  .stat .v { display: block; font: 700 22px var(--f-mono); color: var(--ink-12); line-height: 1; }
  .stat .l { display: block; font: 500 12px var(--f-ui); color: var(--ink-7); margin-top: 5px; }
  .stat.hot .si { background: var(--accent-soft); color: var(--accent); }
  .stat.hot .v { color: var(--accent); }

  /* Create CTA — the primary action, kept prominent. */
  .new-cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: linear-gradient(135deg, var(--accent), var(--accent-h)); color: #fff; border-radius: var(--r-lg); padding: 18px 22px; margin-bottom: 20px; box-shadow: var(--sh-2); }
  .new-cta .t { font: 600 17px var(--f-display); }
  .new-cta .s { font: 400 12.5px var(--f-ui); opacity: .82; margin-top: 3px; }
  .new-cta .btn { background: #fff; color: var(--accent-h); border: 0; font-weight: 600; }

  /* Dashboard — the two lists side by side, not stacked. */
  .dash { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; align-items: start; }
  .sec-hd { display: flex; align-items: baseline; justify-content: space-between; padding: 0 0 11px; border-bottom: 1px solid var(--line); margin: 0 0 14px; }
  .sec-hd h2 { font: 600 16px var(--f-display); margin: 0; color: var(--ink-12); }
  .sec-hd a { font: 500 12.5px var(--f-ui); color: var(--ink-8); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .sec-hd a:hover { color: var(--ink-12); }
  .sec-hd a svg { width: 13px; height: 13px; }

  /* Active order card + client pipeline stepper. */
  .ao { background: var(--elev); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; margin-bottom: 12px; cursor: pointer; transition: border-color .12s ease, transform .12s ease; }
  .ao:hover { border-color: var(--ink-12); transform: translateY(-1px); }
  .ao .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .ao h3 { font: 600 16px var(--f-mono); margin: 0; letter-spacing: -.01em; color: var(--ink-12); }
  .ao .meta { font: 400 12px var(--f-ui); color: var(--ink-7); margin-top: 3px; }
  .ao .meta b { color: var(--ink-12); font-weight: 600; }

  .step { display: flex; align-items: center; gap: 0; margin: 14px 0 12px; }
  .step .node { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; }
  .step .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--elev); box-sizing: border-box; }
  .step .node.done .dot { background: var(--accent); border-color: var(--accent); }
  .step .node.cur .dot { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-ring); }
  .step .node .cap { font: 500 10px var(--f-ui); color: var(--ink-6); white-space: nowrap; }
  .step .node.done .cap, .step .node.cur .cap { color: var(--ink-10); font-weight: 600; }
  .step .bar { flex: 1 1 auto; height: 2px; background: var(--line); margin: 0 6px; margin-bottom: 22px; }
  .step .bar.done { background: var(--accent); }

  .ao .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
  .ao .total { font: 600 14px var(--f-mono); color: var(--ink-12); }
  .ao .total small { font: 500 11px var(--f-ui); color: var(--ink-6); }

  /* Recent draft rows. */
  .dr { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 13px 15px; background: var(--elev); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px; cursor: pointer; transition: border-color .12s ease, transform .12s ease; }
  .dr:hover { border-color: var(--ink-10); transform: translateY(-1px); }
  .dr .nm { font: 600 13px var(--f-mono); color: var(--ink-12); }
  .dr .st { font: 400 11.5px var(--f-ui); color: var(--ink-6); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .dr .st b { color: var(--ink-12); font-weight: 600; font-family: var(--f-mono); }
  .open-aff { display: inline-flex; align-items: center; color: var(--accent); }
  .open-aff svg { width: 16px; height: 16px; transition: transform .12s ease; }
  .dr:hover .open-aff svg { transform: translateX(2px); }

  @media (max-width: 860px) {
    .dash { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .step .node .cap { display: none; }
    .step .bar { margin-bottom: 0; }
  }
</style>
</head>
<body>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/client-shell.js"></script>
<script>renderClientHeader('home.html');</script>

<main class="container" style="padding: 22px 0 56px">
  <div class="home-top">
    <h1>Bosh sahifa</h1>
    <a class="btn btn-acc" href="cutting.html?id=new"><i class="ic" data-icon="plus"></i> Yangi kesim chizmasi</a>
  </div>

  <div class="stats" id="stats"></div>

  <div class="new-cta">
    <div>
      <div class="t">Yangi kesim chizmasi</div>
      <div class="s">Qism o'lchamlarini kiriting — tizim listlarga optimal joylashtiradi va ustaxona narxini hisoblaydi.</div>
    </div>
    <a class="btn" href="cutting.html?id=new"><i class="ic" data-icon="plus"></i> Boshlash</a>
  </div>

  <div class="dash">
    <section class="col-main">
      <div class="sec-hd">
        <h2>Faol buyurtmalar</h2>
        <a href="orders.html">Barchasi <i class="ic" data-icon="arrow-right"></i></a>
      </div>
      <div id="active"></div>
    </section>
    <aside class="col-side">
      <div class="sec-hd">
        <h2>So'nggi chizmalar</h2>
        <a href="cutting-drafts.html">Barchasi <i class="ic" data-icon="arrow-right"></i></a>
      </div>
      <div id="drafts"></div>
    </aside>
  </div>
</main>

<script>
const clientId = 'c01';
const ACTIVE = ['new', 'confirmed', 'cutting', 'edge_banding', 'ready'];
const forced = new URLSearchParams(location.search).get('state');

const myOrders = SEED.orders.filter(o => o.clientId === clientId);
let active = myOrders.filter(o => ACTIVE.includes(o.state));
let drafts = SEED.cuttings.filter(c => c.status === 'draft');

// 5 client phases: Joylashtirildi · Tasdiqlandi · Ishlab chiqarishda · Tayyor · Topshirildi
function stageIndex(state) {
  if (state === 'new') return 0;
  if (state === 'confirmed') return 1;
  if (['cutting', 'edge_banding'].includes(state)) return 2;
  if (state === 'ready') return 3;
  return 4;
}

function stepper(o) {
  const cur = stageIndex(o.state);
  const labels = [SEED.CLIENT_PHASES.new, SEED.CLIENT_PHASES.confirmed, SEED.CLIENT_PHASES.cutting, SEED.CLIENT_PHASES.ready];
  let h = '<div class="step">';
  labels.forEach((lb, i) => {
    const cls = i < cur ? 'done' : (i === cur ? 'cur' : '');
    h += `<div class="node ${cls}"><span class="dot"></span><span class="cap">${lb}</span></div>`;
    if (i < labels.length - 1) h += `<span class="bar ${i < cur ? 'done' : ''}"></span>`;
  });
  return h + '</div>';
}

function clientFacingState(o) { return SEED.CLIENT_PHASES[o.state]; }

function nextAction(o) {
  if (o.state === 'new')
    return `<span class="btn btn-outline btn-sm" onclick="event.stopPropagation();location.href='order-detail.html?id=${o.id}'">Tafsilot</span>`;
  if (o.state === 'ready')
    return `<span class="btn btn-acc btn-sm" onclick="event.stopPropagation();location.href='order-detail.html?id=${o.id}'">Olishga tayyor</span>`;
  if (['confirmed', 'cutting', 'edge_banding'].includes(o.state))
    return `<span class="btn btn-acc btn-sm" onclick="event.stopPropagation();location.href='order-detail.html?id=${o.id}'">Kuzatish</span>`;
  return '';
}

function renderStats() {
  const kProd = active.filter(o => ['cutting', 'edge_banding'].includes(o.state)).length;
  const kReady = active.filter(o => o.state === 'ready').length;
  const items = [
    { ic: 'orders', v: active.length, l: 'Faol buyurtma', href: 'orders.html', hot: false },
    { ic: 'factory', v: kProd, l: 'Ishlab chiqarishda', href: 'orders.html', hot: false },
    { ic: 'package', v: kReady, l: 'Olishga tayyor', href: 'orders.html', hot: kReady > 0 },
    { ic: 'scissors', v: drafts.length, l: 'Saqlangan chizma', href: 'cutting-drafts.html', hot: false },
  ];
  document.getElementById('stats').innerHTML = items.map(s => `
    <a class="stat ${s.hot ? 'hot' : ''}" href="${s.href}">
      <span class="si">${icon(s.ic, { size: 17 })}</span>
      <span><span class="v">${s.v}</span><span class="l">${s.l}</span></span>
    </a>`).join('');
}

function renderActive() {
  const aw = document.getElementById('active');
  if (active.length === 0) {
    aw.innerHTML = `<div class="st-empty"><div class="ic"><i data-icon="inbox"></i></div><h3>Faol buyurtma yo'q</h3><p>Hali buyurtma bermagansiz — chizmadan boshlang.</p><a class="btn btn-acc" href="cutting.html?id=new"><i class="ic" data-icon="plus"></i> Yangi chizma</a></div>`;
    return;
  }
  aw.innerHTML = active.map(o => {
    const br = SEED.lookup.branchById(o.branchId);
    return `
      <article class="ao" onclick="location.href='order-detail.html?id=${o.id}'">
        <div class="top">
          <div>
            <h3>${o.id}</h3>
            <div class="meta">${br ? br.name + ' · ' : ''}${o.placedAt}${o.dueAt ? ` · olib ketish ${o.dueAt}` : ''}</div>
          </div>
          <span class="pill ${SEED.STATE_PILL[o.state]}"><span class="pd"></span>${clientFacingState(o)}</span>
        </div>
        ${stepper(o)}
        <div class="foot">
          <div class="total">${fmtTiyin(o.totalTiyin)} <small>jami narx</small></div>
          <div>${nextAction(o)}</div>
        </div>
      </article>`;
  }).join('');
}

function renderDrafts() {
  const dw = document.getElementById('drafts');
  if (drafts.length === 0) {
    dw.innerHTML = `<div class="st-empty"><div class="ic"><i data-icon="inbox"></i></div><h3>Saqlangan chizma yo'q</h3><p>Yangisini boshlang.</p><a class="btn btn-acc" href="cutting.html?id=new"><i class="ic" data-icon="plus"></i> Yangi chizma</a></div>`;
    return;
  }
  dw.innerHTML = drafts.slice(0, 4).map(c => {
    const matIds = [...new Set(c.partList.map(p => p.matId).filter(Boolean))];
    const matLabels = matIds.map(id => SEED.lookup.matById(id)?.name.split('·')[0].trim() || id).filter(Boolean);
    const matLabel = matLabels.slice(0, 2).join(' + ') + (matLabels.length > 2 ? ` +${matLabels.length - 2}` : '');
    const algo = SEED.lookup.chosenAlgo(c);
    const panels = algo ? Object.values(algo.panelsByMat).reduce((a, b) => a + b, 0) : 0;
    const totalQty = c.partList.reduce((a, p) => a + (p.qty || 0), 0);
    return `
      <article class="dr" onclick="location.href='cutting.html?id=${c.id}'">
        <div>
          <div class="nm">${c.id} · ${matLabel || 'Material tanlanmagan'}</div>
          <div class="st">
            <span><b>${totalQty}</b> qism</span>
            <span><b>${panels || '—'}</b> panel</span>
            ${algo ? `<span><b>${algo.wastePct}%</b> chiqim</span>` : ''}
            <span>${c.when}</span>
          </div>
        </div>
        <span class="open-aff" aria-hidden="true">${icon('arrow-right', { size: 16 })}</span>
      </article>`;
  }).join('');
}

function renderAll() { renderStats(); renderActive(); renderDrafts(); }

function skeleton() {
  document.getElementById('stats').innerHTML = Array.from({ length: 4 }).map(() =>
    `<div class="stat"><span class="sk sk-line" style="width:34px;height:34px;border-radius:9px"></span><span style="flex:1"><div class="sk sk-line" style="width:40px;height:20px"></div><div class="sk sk-line" style="width:80%;margin-top:8px"></div></span></div>`).join('');
  document.getElementById('active').innerHTML = Array.from({ length: 2 }).map(() => `
    <div class="ao">
      <div class="sk sk-line" style="width:30%"></div>
      <div class="sk sk-line" style="width:55%;margin-top:10px;height:16px"></div>
      <div class="sk sk-line" style="width:100%;margin-top:16px;height:30px"></div>
      <div class="sk sk-line" style="width:40%;margin-top:14px"></div>
    </div>`).join('');
  document.getElementById('drafts').innerHTML = Array.from({ length: 3 }).map(() =>
    `<div class="dr"><div><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:80%;margin-top:8px"></div></div><div class="sk sk-line" style="width:18px"></div></div>`).join('');
}

function errorState() {
  document.getElementById('stats').innerHTML = '';
  document.getElementById('drafts').innerHTML = '';
  document.getElementById('active').innerHTML = `
    <div class="st-error">
      <div class="ic"><i data-icon="alert"></i></div>
      <h3>Ma'lumotni yuklab bo'lmadi</h3>
      <p>Ulanishda xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring.</p>
      <p class="trace">trace_id: tr-${Math.random().toString(16).slice(2, 8)}</p>
      <button class="btn btn-outline" type="button" onclick="boot()"><i class="ic" data-icon="refresh"></i> Qayta urinish</button>
    </div>`;
}

function boot() {
  if (forced === 'error') { errorState(); return; }
  if (forced === 'empty') { active = []; drafts = []; renderAll(); return; }
  skeleton();
  setTimeout(() => renderAll(), forced === 'loading' ? 100000 : 450);
}
boot();
</script>
</body>
</html>
