<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bosh sahifa — Mebel Pro · Mijoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
<style>
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 28px 0 30px; }
  .kpi { background: var(--elev); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; text-decoration: none; transition: border-color .12s, transform .12s; }
  .kpi:hover { border-color: var(--ink-10); transform: translateY(-1px); }
  .kpi .v { font: 700 24px var(--f-mono); color: var(--ink-12); line-height: 1; }
  .kpi .v small { font: 600 12px var(--f-ui); color: var(--ink-6); }
  .kpi .l { font: 500 12px var(--f-ui); color: var(--ink-7); margin-top: 7px; }
  .kpi.hot .v { color: var(--acc, #b4530a); }

  .sec-hd { display: flex; align-items: baseline; justify-content: space-between; padding: 0 0 12px; border-bottom: 1px solid var(--line); margin: 26px 0 16px; }
  .sec-hd h2 { font: 600 18px var(--f-display); margin: 0; color: var(--ink-12); }
  .sec-hd a { font: 500 13px var(--f-ui); color: var(--ink-8); text-decoration: none; }
  .sec-hd a:hover { color: var(--ink-12); }

  .ao { background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; cursor: pointer; transition: border-color .12s, transform .12s; }
  .ao:hover { border-color: var(--ink-12); transform: translateY(-1px); }
  .ao .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .ao .id { font: 500 11.5px var(--f-mono); color: var(--ink-6); letter-spacing: .04em; }
  .ao h3 { font: 600 17px var(--f-display); margin: 4px 0 0; letter-spacing: -.01em; color: var(--ink-12); }
  .ao .meta { font: 400 12.5px var(--f-ui); color: var(--ink-7); margin-top: 3px; }
  .ao .meta b { color: var(--ink-12); font-weight: 600; }

  .step { display: flex; align-items: center; gap: 0; margin: 16px 0 14px; }
  .step .node { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 0 0 auto; }
  .step .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--line); background: var(--elev); box-sizing: border-box; }
  .step .node.done .dot { background: var(--ink-12); border-color: var(--ink-12); }
  .step .node.cur .dot { border-color: var(--ink-12); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink-12) 14%, transparent); }
  .step .node .cap { font: 500 10.5px var(--f-ui); color: var(--ink-6); white-space: nowrap; }
  .step .node.done .cap, .step .node.cur .cap { color: var(--ink-12); font-weight: 600; }
  .step .bar { flex: 1 1 auto; height: 2px; background: var(--line); margin: 0 6px; margin-bottom: 22px; }
  .step .bar.done { background: var(--ink-12); }

  .ao .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--line); }
  .ao .total { font: 600 14.5px var(--f-mono); color: var(--ink-12); }
  .ao .total small { font: 500 11px var(--f-ui); color: var(--ink-6); }

  .dr { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; background: var(--elev); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: border-color .12s, transform .12s; }
  .dr:hover { border-color: var(--ink-10); transform: translateY(-1px); }
  .dr .nm { font: 500 14px var(--f-ui); color: var(--ink-12); }
  .dr .st { font: 400 12px var(--f-mono); color: var(--ink-6); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .dr .st b { color: var(--ink-12); font-weight: 600; }
  .open-aff { display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px var(--f-ui); color: var(--accent); white-space: nowrap; }
  .open-aff svg { width: 14px; height: 14px; transition: transform .12s; }
  .dr:hover .open-aff svg { transform: translateX(2px); }

  .new-cta { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--ink-12); color: #fff; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
  .new-cta .t { font: 600 17px var(--f-display); }
  .new-cta .s { font: 400 13px var(--f-ui); opacity: .8; margin-top: 3px; }
  .new-cta .btn { background: #fff; color: var(--ink-12); border: 0; font-weight: 600; }

  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .step .node .cap { display: none; }
    .step .bar { margin-bottom: 0; }
  }
</style>
</head>
<body>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/client-shell.js"></script>
<script>renderClientHeader('home.html');</script>

<main class="container">
  <div class="kpis" id="kpis"></div>

  <div class="new-cta">
    <div>
      <div class="t">Yangi kesim chizmasi</div>
      <div class="s">Qism o'lchamlarini kiriting — tizim listlarga optimal joylashtiradi va ustaxona narxini hisoblaydi.</div>
    </div>
    <a class="btn" href="cutting.html?id=new">+ Yangi chizma</a>
  </div>

  <div class="sec-hd">
    <h2>Faol buyurtmalar</h2>
    <a href="orders.html">Barcha buyurtmalar →</a>
  </div>
  <div id="active"></div>

  <div class="sec-hd">
    <h2>So'nggi chizmalar</h2>
    <a href="cutting-drafts.html">Barcha chizmalar →</a>
  </div>
  <div id="drafts"></div>
</main>

<script>
const clientId = 'c01';
const ACTIVE = ['new','confirmed','cutting','edge_banding','ready'];
const forced = new URLSearchParams(location.search).get('state');

const myOrders = SEED.orders.filter(o => o.clientId === clientId);
let active = myOrders.filter(o => ACTIVE.includes(o.state));
let drafts = SEED.cuttings.filter(c => c.status === 'draft');

// ---- Active orders with pipeline progress ----
// 5 client phases: Joylashtirildi · Tasdiqlandi · Ishlab chiqarishda · Tayyor · Topshirildi
function stageIndex(state) {
  if (state === 'new') return 0;
  if (state === 'confirmed') return 1;
  if (['cutting','edge_banding'].includes(state)) return 2;
  if (state === 'ready') return 3;
  return 4; // completed
}

function stepper(o) {
  const cur = stageIndex(o.state);
  // Labels from CLIENT_PHASES — never hardcode the phase text.
  const labels = [
    SEED.CLIENT_PHASES.new,
    SEED.CLIENT_PHASES.confirmed,
    SEED.CLIENT_PHASES.cutting,
    SEED.CLIENT_PHASES.ready
  ];
  let h = '<div class="step">';
  labels.forEach((lb, i) => {
    const cls = i < cur ? 'done' : (i === cur ? 'cur' : '');
    h += `<div class="node ${cls}"><span class="dot"></span><span class="cap">${lb}</span></div>`;
    if (i < labels.length - 1) h += `<span class="bar ${i < cur ? 'done' : ''}"></span>`;
  });
  h += '</div>';
  return h;
}

// Single source for the client-facing phase label.
function clientFacingState(o) { return SEED.CLIENT_PHASES[o.state]; }

function nextAction(o) {
  if (o.state === 'new')
    return `<span class="btn btn-outline btn-sm" onclick="event.stopPropagation();location.href='order-detail.html?id=${o.id}'">Tafsilot</span>`;
  if (o.state === 'ready')
    return `<span class="btn btn-acc btn-sm" onclick="event.stopPropagation();location.href='order-detail.html?id=${o.id}'">Olishga tayyor</span>`;
  if (['confirmed','cutting','edge_banding'].includes(o.state))
    return `<span class="btn btn-acc btn-sm" onclick="event.stopPropagation();location.href='order-detail.html?id=${o.id}'">Kuzatish</span>`;
  return '';
}

// ---- KPI strip ----
function renderKpis() {
  const kReady = active.filter(o => o.state === 'ready').length;
  const kProd = active.filter(o => ['cutting','edge_banding'].includes(o.state)).length;
  const kpis = [
    { v: active.length, l: 'Faol buyurtma', href: 'orders.html', hot: false },
    { v: kProd, l: 'Ishlab chiqarishda', href: 'orders.html', hot: false },
    { v: kReady, l: 'Olishga tayyor', href: 'orders.html', hot: kReady > 0 },
    { v: drafts.length, l: 'Saqlangan chizma', href: 'cutting-drafts.html', hot: false },
  ];
  document.getElementById('kpis').innerHTML = kpis.map(k => `
    <a class="kpi ${k.hot ? 'hot' : ''}" href="${k.href}">
      <div class="v">${k.v}<small> ta</small></div>
      <div class="l">${k.l}</div>
    </a>`).join('');
}

function skeleton() {
  document.getElementById('kpis').innerHTML = Array.from({ length: 4 }).map(() =>
    `<div class="kpi"><div class="sk sk-line" style="width:40px;height:24px"></div><div class="sk sk-line" style="width:70%;margin-top:10px"></div></div>`).join('');
  document.getElementById('active').innerHTML = Array.from({ length: 2 }).map(() => `
    <div class="ao">
      <div class="sk sk-line" style="width:30%"></div>
      <div class="sk sk-line" style="width:55%;margin-top:10px;height:18px"></div>
      <div class="sk sk-line" style="width:100%;margin-top:18px;height:32px"></div>
      <div class="sk sk-line" style="width:40%;margin-top:16px"></div>
    </div>`).join('');
  document.getElementById('drafts').innerHTML = Array.from({ length: 2 }).map(() =>
    `<div class="dr"><div><div class="sk sk-line" style="width:50%"></div><div class="sk sk-line" style="width:70%;margin-top:8px"></div></div><div class="sk sk-line" style="width:56px"></div></div>`).join('');
}

function errorState(targetId) {
  document.getElementById(targetId).innerHTML = `
    <div class="st-error">
      <div class="ic">!</div>
      <h3>Ma'lumotni yuklab bo'lmadi</h3>
      <p>Ulanishda xatolik yuz berdi. Birozdan so'ng qayta urinib ko'ring.</p>
      <p class="trace">trace_id: tr-${Math.random().toString(16).slice(2,8)}</p>
      <button class="btn btn-outline" type="button" onclick="boot()">Qayta urinish</button>
    </div>`;
}

function renderActive() {
  const aw = document.getElementById('active');
  if (active.length === 0) {
    aw.innerHTML = `<div class="st-empty"><div class="ic">∅</div><h3>Faol buyurtma yo'q</h3><p>Hali buyurtma bermagansiz — chizmadan boshlang.</p><a class="btn btn-acc" href="cutting.html?id=new">+ Yangi chizma</a></div>`;
    return;
  }
  aw.innerHTML = active.map(o => {
    const br = SEED.lookup.branchById(o.branchId);
    return `
      <article class="ao" onclick="location.href='order-detail.html?id=${o.id}'">
        <div class="top">
          <div>
            <div class="id">${o.id} · ${br ? br.name : ''}</div>
            <h3>${o.title}</h3>
            <div class="meta">${o.placedAt}${o.dueAt ? ` · olib ketish <b>${o.dueAt}</b>` : ''}</div>
          </div>
          <span class="pill ${SEED.STATE_PILL[o.state]}"><span class="pd"></span>${clientFacingState(o)}</span>
        </div>
        ${stepper(o)}
        <div class="foot">
          <div class="total">${fmtTiyin(o.totalTiyin)} <small>jami narx</small></div>
          <div>${nextAction(o)}</div>
        </div>
      </article>`;
  }).join('');
}

function renderDrafts() {
  const dw = document.getElementById('drafts');
  if (drafts.length === 0) {
    dw.innerHTML = `<div class="st-empty"><div class="ic">∅</div><h3>Saqlangan chizma yo'q</h3><p>Saqlangan chizma yo'q — yangisini boshlang.</p><a class="btn btn-acc" href="cutting.html?id=new">+ Yangi chizma</a></div>`;
    return;
  }
  dw.innerHTML = drafts.slice(0, 3).map(c => {
    const matIds = [...new Set(c.partList.map(p => p.matId).filter(Boolean))];
    const matLabels = matIds.map(id => SEED.lookup.matById(id)?.name.split('·')[0].trim() || id).filter(Boolean);
    const matLabel = matLabels.slice(0, 2).join(' + ') + (matLabels.length > 2 ? ` +${matLabels.length - 2}` : '');
    const algo = SEED.lookup.chosenAlgo(c);
    const sheets = algo ? Object.values(algo.sheetsByMat).reduce((a, b) => a + b, 0) : 0;
    const totalQty = c.partList.reduce((a, p) => a + (p.qty || 0), 0);
    return `
      <article class="dr" onclick="location.href='cutting.html?id=${c.id}'">
        <div>
          <div class="nm">${c.id} · ${matLabel || 'Material tanlanmagan'}</div>
          <div class="st">
            <span><b>${totalQty}</b> qism</span>
            <span><b>${sheets || '—'}</b> list</span>
            ${algo ? `<span><b>${algo.wastePct}%</b> chiqim</span>` : ''}
            <span style="color:var(--ink-6)">${c.when}</span>
          </div>
        </div>
        <span class="open-aff">Ochish<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </article>`;
  }).join('');
}

function renderAll() {
  renderKpis();
  renderActive();
  renderDrafts();
}

function boot() {
  if (forced === 'error') {
    document.getElementById('kpis').innerHTML = '';
    errorState('active');
    document.getElementById('drafts').innerHTML = '';
    return;
  }
  if (forced === 'empty') { active = []; drafts = []; renderAll(); return; }
  skeleton();
  setTimeout(() => { renderAll(); }, forced === 'loading' ? 100000 : 450);
}
boot();
</script>
</body>
</html>
