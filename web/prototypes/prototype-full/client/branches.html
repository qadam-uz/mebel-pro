<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ustaxonalar — Mebel Pro · Mijoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#F4F6F8" />
<style>
  .br-card { display: grid; grid-template-columns: 50px 1fr auto; gap: 14px; align-items: center; padding: 18px 22px; background: var(--elev); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; }
  .br-card.closed { opacity: .65; }
  .br-card .ic { width: 50px; height: 50px; border-radius: 8px; background: var(--accent-tint); color: var(--accent-h); display: grid; place-items: center; font: 700 18px var(--f-display); }
  .br-card.closed .ic { background: var(--warn-tint); color: var(--warn); }
  .br-card .nm { font: 600 16px var(--f-display); color: var(--ink-12); margin: 0; }
  .br-card .meta { font: 400 12.5px var(--f-mono); color: var(--ink-6); margin-top: 4px; }
  .br-card .mats { font: 500 12px var(--f-ui); color: var(--ink-8); margin-top: 6px; }
  .br-card .badge { padding: 4px 10px; font: 600 10.5px var(--f-ui); text-transform: uppercase; letter-spacing: .04em; background: var(--sunk); border-radius: 999px; color: var(--ink-8); white-space: nowrap; }
  .search-input { background: var(--elev); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 14px; width: 100%; max-width: 380px; margin-bottom: 18px; outline: 0; }
  .search-input:focus { border-color: var(--ink-12); }
  .info-banner { padding: 14px 18px; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; font: 500 13.5px/1.45 var(--f-ui); color: var(--ink-10); margin: 8px 0 20px; }
  .info-banner b { color: var(--ink-12); }
</style>
</head>
<body>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/client-shell.js"></script>
<script>renderClientHeader('branches.html');</script>

<main class="container" style="padding: 24px 0 64px">
  <div class="page-head" style="margin-bottom: 6px">
    <div>
      <h1>Ustaxonalar</h1>
      <p class="sub">Faol ustaxonalar va ularda mavjud materiallar.</p>
    </div>
  </div>

  <div class="info-banner">
    Bu ro'yxat shunchaki ma'lumot uchun. Buyurtma uchun chizmadan boshlang.
  </div>

  <label class="filter-label" for="branch-search" style="display:inline-block;margin-bottom:8px">Qidirish</label><br>
  <input class="search-input" id="branch-search" aria-label="Ustaxona yoki shahar nomi" placeholder="Ustaxona yoki shahar nomi bo'yicha qidirish..." oninput="filterBranches(this.value)" />

  <div id="br-list"></div>
</main>

<script>
function matLabelsForBranch(branchId) {
  const matIds = SEED.branchMaterials.filter(bm => bm.branchId === branchId && bm.status === 'active').map(bm => bm.matId);
  const names = matIds.map(id => {
    const m = SEED.lookup.matById(id);
    return m ? m.name.split('·')[0].trim() : null;
  }).filter(Boolean);
  return names;
}

function render() {
  const wrap = document.getElementById('br-list');
  wrap.innerHTML = SEED.branches.map(b => {
    const closed = b.status !== 'active';
    const mats = matLabelsForBranch(b.id);
    const matsLine = mats.length > 0
      ? `<div class="mats">Materiallar: <b style="font-weight:600">${mats.slice(0,4).join(' · ')}</b>${mats.length > 4 ? ` +${mats.length-4}` : ''}</div>`
      : '';
    return `
      <article class="br-card ${closed ? 'closed' : ''}" data-name="${b.name.toLowerCase()} ${b.city.toLowerCase()}">
        <div class="ic">${b.name[0]}</div>
        <div>
          <div class="nm">${b.city} · ${b.name}</div>
          <div class="meta">${b.addr} · ${b.hours} · ${b.phone}</div>
          ${matsLine}
          ${closed ? `<div class="meta" style="color:var(--warn);margin-top:6px">${window.icon('alert',{size:12})} ${b.closedReason || 'Vaqtincha yopiq'}</div>` : ''}
        </div>
        <div>
          ${closed ? `<span class="badge" style="background:var(--warn-tint);color:var(--warn)">Vaqtincha yopiq</span>` : `<span class="badge" style="background:var(--success-tint);color:var(--success)">Faol</span>`}
        </div>
      </article>`;
  }).join('');
}

function filterBranches(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('.br-card').forEach(c => {
    c.style.display = !q || c.dataset.name.includes(q) ? '' : 'none';
  });
}

render();
</script>
</body>
</html>
