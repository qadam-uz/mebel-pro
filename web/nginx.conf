# Server block for the `web` container: serves the built SPA.
# (The edge reverse proxy in deploy/nginx/default.conf sits in front of this
#  and forwards /api to the backend.)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /client/ {
        try_files $uri $uri/ /client/index.html;
    }

    location /workshop/ {
        try_files $uri $uri/ /workshop/index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = / {
        try_files /landing/index.html =404;
    }

    # Apex/static fallback for the landing surface.
    location / {
        try_files $uri $uri/ /landing/index.html;
    }
}
