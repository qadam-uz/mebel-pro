# Server block for the `web` container: serves the built SPAs.
# (The edge reverse proxy in deploy/nginx/default.conf sits in front of this
#  and forwards /api to the backend.)
#
# The build emits four entries — landing/index.html, client.html, workshop.html
# and admin.html (see vite.config.ts). In prod the Caddy edge routes each
# subdomain to its SPA (apex → landing, app.* → client, workshop.* → workshop,
# admin.* → admin — see docs/architecture.md). Per-host root/fallback selection
# is owned by the deploy layer; this container's default fallback is the client
# SPA so a bare request still resolves to a real app shell.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index client.html;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- TEMPORARY: static design-prototype gallery -------------------------
    # Serves web/prototypes/ (baked into the image by Dockerfile) as plain
    # static files under /prototypes, reachable at admin.<domain>/prototypes.
    # Directory requests resolve to their index.html; unknown prototype paths
    # 404 here instead of falling back to the Vue SPA shell.
    # REMOVE this block (and the matching Dockerfile COPY) once a design
    # system is chosen and committed to web/DESIGN.md.
    location /prototypes/ {
        try_files $uri $uri/ =404;
    }
    # --- end TEMPORARY ------------------------------------------------------

    # HTML5 history mode: unknown paths fall back to the client SPA shell.
    # (The deploy edge overrides the fallback target per subdomain.)
    location / {
        try_files $uri $uri/ /client.html;
    }
}
