# Server block for the `web` container: serves the built SPA.
# (The edge reverse proxy in deploy/nginx/default.conf sits in front of this
#  and forwards /api to the backend.)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA shells must NOT be cached. They carry the content-hashed script
    # names for the current deploy, and they were served with no Cache-Control at
    # all — so browsers applied heuristic caching and, after a deploy, asked for a
    # chunk that no longer existed. That 404s the entry <script> before the app
    # mounts, so `staleChunkRecovery` (a router guard) can never fire: the user
    # gets a blank page until a hard reload.
    # `no-cache` still allows a conditional request — the ETag makes an unchanged
    # shell a 304, so this costs a revalidation round trip, not a re-download.
    location ~ ^/(client|workshop|admin)/index\.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /client/ {
        try_files $uri $uri/ /client/index.html;
    }

    location /workshop/ {
        try_files $uri $uri/ /workshop/index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location = / {
        try_files /landing/index.html =404;
    }

    # Apex/static fallback for the landing surface.
    location / {
        try_files $uri $uri/ /landing/index.html;
    }
}
