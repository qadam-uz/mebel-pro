<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f1f2f4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint. As a plain stylesheet this
         gated every pixel on a THIRD-PARTY chain — DNS + TCP + TLS to
         fonts.googleapis.com, the CSS, then the font files — which on the links
         this app is used over cost 300-600 ms of blank screen. `preload as=style`
         fetches at high priority without blocking, and the onload swap promotes it
         the moment it lands. `display=swap` (already in the URL) means text paints
         in the fallback face immediately and reflows once, so nothing is hidden
         while it arrives. Both families are VARIABLE (one file each covers
         400-800) and both ship a real cyrillic subset, so the whole system is
         two families in a single request. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400..800&family=Wix+Madefor+Text:wght@400..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400..800&family=Wix+Madefor+Text:wght@400..800&display=swap" /></noscript>
    <title>Mebel Pro · Client</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/apps/client/main.ts"></script>
  </body>
</html>
