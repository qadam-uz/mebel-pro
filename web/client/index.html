<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f1f2f4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The two variable faces the first paint needs, self-hosted and
         content-hashed: the @font-face rules live in `src/assets/fonts.css`,
         which `main.css` pulls in. Nothing is fetched from a third party any
         more — the old setup gated every glyph on DNS + TCP + TLS to
         fonts.googleapis.com and then again to fonts.gstatic.com, which on the
         links this app is used over cost 300-600 ms.
         Preloaded because a font in a stylesheet is only discovered once that
         stylesheet has parsed, which is a second round trip on every cold load.
         `latin` is the subset the default locale paints; a Cyrillic locale
         picks its own subset up from the same stylesheet. `crossorigin` is
         required even same-origin — fonts are always fetched in CORS mode, and
         without it the browser preloads one copy and then fetches another.
         Vite rewrites both hrefs to the same hashed assets the CSS resolves to,
         so preload and @font-face are one request. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/wix-madefor-text/files/wix-madefor-text-latin-wght-normal.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/wix-madefor-display/files/wix-madefor-display-latin-wght-normal.woff2"
    />
    <title>Mebel Pro · Client</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/apps/client/main.ts"></script>
  </body>
</html>
