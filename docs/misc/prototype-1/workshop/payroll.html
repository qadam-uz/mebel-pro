<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Maoshlar — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Maoshlar</h1>
        <p class="sub">Oylik maosh va piece-rate to'lovlar · yopilgan oylar va joriy loyiha.</p>
      </div>
      <div class="tools">
        <button class="btn btn-acc" type="button" onclick="openModal('m-new')">+ Yangi oylik to'lov</button>
      </div>
    </div>

    <div class="card">
      <table class="tbl">
        <thead><tr><th>Davr</th><th>Holat</th><th class="right">Entry</th><th class="right">Gross</th><th class="right">To'langan</th><th class="right">Qolgan</th><th>Yaratdi</th><th></th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal" id="m-new">
  <div class="modal-h"><h3>Yangi maosh davri</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <div class="field-row">
      <div class="field"><label>Boshlanish</label><input type="date" value="2026-05-01" /></div>
      <div class="field"><label>Tugash</label><input type="date" value="2026-05-31" /></div>
    </div>
    <div class="banner info"><div class="ic">i</div><div class="grow">Tizim har xodimni avtomatik hisoblaydi (oylik, list, chizma, metr, yetkazma, komissiya). Tekshirib chiqib, finalize qilasiz.</div></div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-new');toast('Loyiha yaratildi');setTimeout(()=>location.href='payroll-detail.html?id=pr-2026-05',700)">Yaratish</button></div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

document.getElementById('body').innerHTML = SEED.payrollRuns.map(r => `
  <tr class="clickable" onclick="location.href='payroll-detail.html?id=${r.id}'">
    <td class="nm">${r.period}<small>${r.id}</small></td>
    <td>${r.status === 'draft' ? '<span class="pill p-warn"><span class="pd"></span>Loyiha</span>' : '<span class="pill p-ok"><span class="pd"></span>Yopilgan</span>'}</td>
    <td class="amt">${r.entries}</td>
    <td class="amt">${fmtTiyin(r.grossTiyin)}</td>
    <td class="amt success-text">${fmtTiyin(r.paidTiyin)}</td>
    <td class="amt ${r.grossTiyin - r.paidTiyin > 0 ? 'warn-text' : ''}">${fmtTiyin(r.grossTiyin - r.paidTiyin)}</td>
    <td><small style="color:var(--ink-8);font-size:12px">${SEED.lookup.userById(r.generatedBy)?.name || '—'}</small></td>
    <td onclick="event.stopPropagation()">
      <div class="menu-wrap">
        <button class="menu-btn" data-menu-toggle>⋯</button>
        <div class="menu">
          <a class="mi" href="payroll-detail.html?id=${r.id}">Ko'rish</a>
          <button class="mi" onclick="toast('CSV yuklanmoqda')">CSV eksport</button>
          ${r.status === 'finalized' ? `<div class="sep"></div><button class="mi danger" onclick="confirmAction({title:'Egasi · maoshni qaytarish',msg:'Yopilgan oyni qaytarish — istisno amal. Sabab kerak (uzun).',reasonField:true,danger:true,okText:'Qaytarish'},()=>toast('Yopilgan davr qaytarildi'))">Qaytarish · egasi-only</button>` : ''}
        </div>
      </div>
    </td>
  </tr>
`).join('');
</script>
</body>
</html>
