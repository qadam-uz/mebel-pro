<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yetkazma navbati — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Yetkazma navbati</h1>
        <p class="sub">Balans to'langan tayyor buyurtmalar.</p>
      </div>
    </div>

    <div class="queue-grid">
      <section class="queue-col">
        <h2>Navbatda <span class="ct">1</span></h2>
        <div id="queue"></div>
      </section>
      <section class="queue-col">
        <h2>Yo'lda <span class="ct">1</span></h2>
        <div id="active"></div>
      </section>
    </div>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

const queue = SEED.orders.filter(o => o.state === 'ready' && o.deliveryType === 'delivery');
const active = SEED.orders.filter(o => o.state === 'in_delivery');

document.getElementById('queue').innerHTML = queue.length === 0
  ? `<div class="empty" style="border-style:dashed"><div class="ic">∅</div><p>Navbat bo'sh.</p></div>`
  : queue.map(o => {
    const cl = SEED.lookup.clientById(o.clientId);
    return `<div class="q-card ${o.balanceUnpaid ? '' : ''}">
      <div class="top">
        <div>
          <div class="id">${o.id}</div>
          <h4>${o.title}</h4>
          <div class="meta">${cl?.name} · <b>${o.address}</b></div>
          <div class="meta" style="margin-top:4px">Belgilangan vaqt: <b>${o.dueAt || '—'}</b></div>
        </div>
        ${o.balanceUnpaid ? '<span class="pill p-warn"><span class="pd"></span>Balans kutilmoqda</span>' : ''}
      </div>
      <div class="act">
        <button class="btn btn-acc" type="button" ${o.balanceUnpaid ? 'disabled title="Balans yozilmagan"' : ''} onclick="confirmAction({title:'Yetkazmani boshlash'},()=>{toast('Yetkazma boshlandi');setTimeout(()=>location.reload(),700)})">▶ Yo'lga chiqish</button>
        <a class="btn btn-outline" href="order-detail.html?id=${o.id}">Manzil va telefon</a>
      </div>
    </div>`;
  }).join('');

document.getElementById('active').innerHTML = active.length === 0
  ? `<div class="empty" style="border-style:dashed"><div class="ic">∅</div><p>Yo'lda hech kim yo'q.</p></div>`
  : active.map(o => {
    const cl = SEED.lookup.clientById(o.clientId);
    return `<div class="q-card">
      <div class="top">
        <div><div class="id">${o.id}</div><h4>${o.title}</h4><div class="meta">${cl?.name} · <b>${o.address}</b></div></div>
        <span class="pill p-del"><span class="pd"></span>Yo'lda</span>
      </div>
      <div class="meta" style="margin-top:6px">Boshlandi: ${o.driverStartedAt}</div>
      <div class="act">
        <button class="btn btn-acc" type="button" onclick="openModal('delivered-${o.id}')">✓ Yetkazildi</button>
        <a class="btn btn-outline" href="tel:${SEED.lookup.clientById(o.clientId)?.phone || ''}">📞 Mijoz</a>
      </div>
    </div>
    <div class="modal" id="delivered-${o.id}">
      <div class="modal-h"><h3>Yetkazildi · ${o.id}</h3><button class="x" data-close-modal>✕</button></div>
      <div class="modal-b">
        <div class="field"><label>Chek skani (ixtiyoriy)</label><input type="file" accept="image/*" /></div>
      </div>
      <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('delivered-${o.id}');toast('Yetkazildi');setTimeout(()=>location.reload(),700)">Tasdiqlash</button></div>
    </div>`;
  }).join('');
</script>

<div id="scrim" class="scrim"></div>
</body>
</html>
