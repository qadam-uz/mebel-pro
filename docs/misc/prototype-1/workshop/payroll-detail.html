<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Maosh davri — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <button class="back" type="button" onclick="location.href='payroll.html'">← Maoshlar</button>
    <div id="wrap"></div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal" id="m-pay">
  <div class="modal-h"><h3>Xodimga to'lov yozish</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <div class="field-row">
      <div class="field"><label>Xodim</label><input value="Bahodir Tursunov" readonly /></div>
      <div class="field"><label>Qolgan</label><input value="1 100 000" readonly /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Usul</label><select><option>Naqd</option><option>Bank o'tkazma</option></select></div>
      <div class="field"><label>Summa</label><input value="1 100 000" /></div>
    </div>
    <div class="field"><label>Izoh (kassa raqami / bank ref) *</label><input placeholder="Naqd kassa #245" /></div>
    <div class="field"><label>Sana</label><input type="date" value="2026-05-31" /></div>
    <div class="field"><label>Chek skani (ixtiyoriy)</label><input type="file" /></div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-pay');toast('To\'lov yozildi')">Yozish</button></div>
</div>

<div class="modal" id="m-adj">
  <div class="modal-h"><h3>Korreksiya · bonus yoki ushlanma</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <div class="field-row">
      <div class="field"><label>Imzo</label><select><option value="1">+ Bonus</option><option value="-1">− Ushlanma</option></select></div>
      <div class="field"><label>Summa</label><input value="100 000" /></div>
    </div>
    <div class="field"><label>Sabab *</label><textarea rows="2" placeholder="Mehnat sifati bonusi"></textarea></div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-adj');toast('Korreksiya qo\'shildi')">Qo'shish</button></div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

const id = new URLSearchParams(location.search).get('id') || 'pr-2026-05';
const r = SEED.payrollRuns.find(x => x.id === id);
const wrap = document.getElementById('wrap');

if (!r) {
  wrap.innerHTML = `<div class="empty"><div class="ic">∅</div><h3>Maosh davri topilmadi</h3></div>`;
} else {
  // Build mock entries
  const entries = [
    { user: 'u01', name: 'Hasan Karimov', role: 'Egasi', breakdown: 'salary · 12M', grossTiyin: 1200000000, paidTiyin: 0 },
    { user: 'u02', name: 'Aziza Rasulova', role: 'Office', breakdown: 'salary + commission', grossTiyin: 540000000, paidTiyin: 0 },
    { user: 'u03', name: 'Bahodir Tursunov', role: 'Kesuvchi', breakdown: 'per_sheet × 22 list', grossTiyin: 110000000, paidTiyin: 0 },
    { user: 'u04', name: 'Olim Hojiyev', role: 'Kromchi', breakdown: 'per_metre × 142 m', grossTiyin: 21300000, paidTiyin: 0 },
    { user: 'u05', name: 'Sherzod Aliyev', role: 'Haydovchi', breakdown: 'per_delivery × 8', grossTiyin: 24000000, paidTiyin: 0 },
    { user: 'u06', name: "Dilshod Yo'ldoshev", role: 'Office · Chilonzor', breakdown: 'salary', grossTiyin: 420000000, paidTiyin: 0 },
    { user: 'u07', name: 'Komron Saidov', role: 'Kesuvchi · Chilonzor', breakdown: 'per_sheet × 14 list', grossTiyin: 67200000, paidTiyin: 0 },
  ];
  const totalGross = entries.reduce((s, e) => s + e.grossTiyin, 0);

  wrap.innerHTML = `
    <div class="page-head" style="margin-top: 8px">
      <div>
        <h1>${r.period}</h1>
        <p class="sub">${r.entries} ta entry · yaratdi: ${SEED.lookup.userById(r.generatedBy)?.name || '—'} · ${r.generatedAt}</p>
        <div style="margin-top: 6px">${r.status === 'draft' ? '<span class="pill p-warn"><span class="pd"></span>Loyiha</span>' : '<span class="pill p-ok"><span class="pd"></span>Yopilgan</span>'}</div>
      </div>
      <div class="tools">
        <button class="btn btn-outline btn-sm" type="button" onclick="toast('CSV yuklanmoqda')">CSV</button>
        ${r.status === 'draft' ? `
          <button class="btn btn-outline" type="button" onclick="confirmAction({title:'Qaytadan hisoblash',msg:'Tizim manbalardan qaytadan hisoblaydi. Korreksiyalar saqlanadi.'},()=>toast('Qaytadan hisoblandi'))">↻ Qaytadan hisoblash</button>
          <button class="btn btn-acc" type="button" onclick="confirmAction({title:'Yopish',msg:'Yopilgandan keyin tarif va summalarni o\'zgartirib bo\'lmaydi. Davom etasizmi?',okText:'Yopish'},()=>{toast('Davr yopildi');setTimeout(()=>location.reload(),700)})">Yopish</button>
        ` : ''}
      </div>
    </div>

    <div class="kpis" style="grid-template-columns: repeat(3, 1fr)">
      <div class="kpi"><div class="lbl">Jami gross</div><div class="v num">${fmtTiyin(totalGross)}</div></div>
      <div class="kpi"><div class="lbl">To'langan</div><div class="v num success-text">0</div></div>
      <div class="kpi"><div class="lbl">Qolgan</div><div class="v num warn-text">${fmtTiyin(totalGross)}</div></div>
    </div>

    <div class="card">
      <div class="card-h"><h2>Entry'lar</h2></div>
      <table class="tbl">
        <thead><tr><th>Xodim</th><th>Tarif</th><th class="right">Gross</th><th class="right">To'langan</th><th class="right">Qolgan</th><th>Holat</th><th></th></tr></thead>
        <tbody>${entries.map(e => `
          <tr>
            <td class="nm">${e.name}<small>${e.role}</small></td>
            <td><small style="color:var(--ink-8);font-size:12px">${e.breakdown}</small></td>
            <td class="amt">${fmtTiyin(e.grossTiyin)}</td>
            <td class="amt muted">0</td>
            <td class="amt warn-text">${fmtTiyin(e.grossTiyin)}</td>
            <td><span class="pill p-warn"><span class="pd"></span>To'lanmagan</span></td>
            <td>
              <div class="menu-wrap">
                <button class="menu-btn" data-menu-toggle>⋯</button>
                <div class="menu">
                  ${r.status === 'finalized' ? `<button class="mi" onclick="openModal('m-pay')">+ To'lov yozish</button>` : `<button class="mi" onclick="openModal('m-adj')">± Korreksiya</button>`}
                  <button class="mi" onclick="location.href='user-detail.html?id=${e.user}'">Xodim sahifasi</button>
                </div>
              </div>
            </td>
          </tr>
        `).join('')}</tbody>
      </table>
    </div>
  `;
}
</script>
</body>
</html>
