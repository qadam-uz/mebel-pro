<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Material katalogi — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Filial material katalogi</h1>
        <p class="sub">Filial qaysi materiallarni sotadi va qanday narxda — mijozlar shu ro'yxatdan ko'radi.</p>
      </div>
      <div class="tools">
        <button class="btn btn-acc" type="button" onclick="openModal('m-add')">+ Material qo'shish</button>
      </div>
    </div>

    <div class="filters">
      <select id="br-filter" onchange="render()">
        <option value="all">Barcha filiallar</option>
        <option value="yunusobod">Yunusobod</option>
        <option value="chilonzor">Chilonzor</option>
        <option value="yangiyol">Yangiyo'l</option>
      </select>
      <div class="chips">
        <button class="chip on">Hammasi</button>
        <button class="chip">Faol</button>
        <button class="chip">Inactive</button>
      </div>
    </div>

    <div class="card">
      <table class="tbl">
        <thead>
          <tr><th>Material</th><th>Filial</th><th class="right">Narx / list</th><th class="right">Min zaxira</th><th>Holat</th><th></th></tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal" id="m-add">
  <div class="modal-h"><h3>Filialga material qo'shish</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <div class="field"><label>Filial</label><select><option>Yunusobod</option><option>Chilonzor</option><option>Yangiyo'l</option></select></div>
    <div class="field"><label>Platforma katalogidan tanlash</label>
      <select id="m-pick"></select>
    </div>
    <div class="field-row">
      <div class="field"><label>Narx (so'm / list)</label><input type="text" placeholder="410 000" /></div>
      <div class="field"><label>Min zaxira</label><input type="number" value="20" /></div>
    </div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-add');toast('Material qo\'shildi')">Qo'shish</button></div>
</div>

<div class="modal" id="m-edit">
  <div class="modal-h"><h3>Tahrirlash</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <div class="field-row">
      <div class="field"><label>Narx (so'm / list)</label><input type="text" value="410 000" /></div>
      <div class="field"><label>Min zaxira</label><input type="number" value="20" /></div>
    </div>
    <p class="muted" style="font-size:12.5px;margin:0">Eski buyurtmalardagi narx o'zgarmaydi (snapshot).</p>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-edit');toast('Saqlandi')">Saqlash</button></div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

function render() {
  const br = document.getElementById('br-filter').value;
  const rows = SEED.branchMaterials.filter(bm => br === 'all' || bm.branchId === br);
  document.getElementById('body').innerHTML = rows.map(bm => {
    const m = SEED.lookup.matById(bm.matId);
    const b = SEED.lookup.branchById(bm.branchId);
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:11px"><div class="sw ${m.sw}"></div><div><div class="nm">${m.name}</div><small style="color:var(--ink-6);font:400 11px var(--f-mono)">${m.thickness} mm · ${m.color}</small></div></div></td>
      <td>${b.name}</td>
      <td class="amt">${fmtTiyin(bm.priceTiyin)}</td>
      <td class="amt">${bm.minStock}</td>
      <td><span class="pill ${bm.status === 'active' ? 'p-ok' : 'p-dn'}"><span class="pd"></span>${bm.status === 'active' ? 'Faol' : 'Inactive'}</span></td>
      <td>
        <div class="menu-wrap">
          <button class="menu-btn" data-menu-toggle>⋯</button>
          <div class="menu">
            <button class="mi" onclick="openModal('m-edit')">Tahrirlash</button>
            <button class="mi" onclick="confirmAction({title:'${bm.status === 'active' ? 'Mijozlardan yashirish' : 'Mijozlarga ko\'rsatish'}',msg:'Mijozlar bu materialni ko\'rmaydi (lekin zaxira saqlanadi).'},()=>toast('Holat o\'zgartirildi'))">${bm.status === 'active' ? 'Yashirish' : 'Faol qilish'}</button>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
}
render();

const sel = document.getElementById('m-pick');
sel.innerHTML = SEED.materials.filter(m => m.status === 'active').map(m => `<option>${m.name} · ${m.thickness} mm</option>`).join('');
</script>
</body>
</html>
