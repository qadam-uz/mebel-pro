<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Filiallar — Mebel Pro · Boshqaruv</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<style>
  .br-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .br-card { background: var(--elev); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 14px; transition: all .15s; cursor: pointer; text-decoration: none; color: inherit; }
  .br-card:hover { border-color: var(--ink-12); transform: translateY(-2px); }
  .br-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .br-card .ic { font-family: var(--f-display); font-size: 28px; font-weight: 600; color: var(--accent); line-height: 1; }
  .br-card h3 { font-family: var(--f-display); font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .br-card .addr { font-size: 12.5px; color: var(--ink-6); font-family: var(--f-mono); margin-top: 2px; }
  .br-card .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .br-card .kpi-grid .l { font-size: 10.5px; color: var(--ink-6); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; margin-bottom: 3px; }
  .br-card .kpi-grid .v { font-family: var(--f-display); font-size: 22px; font-weight: 600; letter-spacing: -.01em; line-height: 1; }
  .br-card .kpi-grid .v small { font-size: 12px; color: var(--ink-6); font-weight: 500; font-family: var(--f-ui); }
</style>
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Filiallar</h1>
        <p class="sub">3 filial · 8 xodim · har birining materiali va narxi alohida.</p>
      </div>
      <div class="tools">
        <button class="btn btn-acc" type="button" onclick="openModal('m-add')">+ Yangi filial</button>
      </div>
    </div>

    <div class="br-grid" id="grid"></div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal" id="m-add">
  <div class="modal-h"><h3>Yangi filial</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <div class="field-row">
      <div class="field"><label>Nom</label><input placeholder="Sergeli" /></div>
      <div class="field"><label>Shahar / viloyat</label><input placeholder="Toshkent" /></div>
    </div>
    <div class="field"><label>Manzil</label><input placeholder="Sergeli 1-mavze 4" /></div>
    <div class="field-row">
      <div class="field"><label>Telefon</label><input placeholder="+998 ..." /></div>
      <div class="field"><label>Holat</label><select><option>Faol</option><option>Vaqtincha yopiq</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Lat</label><input value="41.2" /></div>
      <div class="field"><label>Lng</label><input value="69.3" /></div>
    </div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-add');toast('Filial yaratildi')">Yaratish</button></div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/workshop-shell.js"></script>
<script>
renderWorkshopShell();

const stats = {
  yunusobod: { orders: 5, low: 1, materials: 7, workers: 4 },
  chilonzor: { orders: 1, low: 1, materials: 4, workers: 3 },
  yangiyol: { orders: 0, low: 1, materials: 2, workers: 1 }
};

document.getElementById('grid').innerHTML = SEED.branches.map(b => {
  const s = stats[b.id] || { orders: 0, low: 0, materials: 0, workers: 0 };
  return `<a class="br-card" href="branch-detail.html?id=${b.id}">
    <div class="top">
      <div>
        <h3>${b.name}</h3>
        <div class="addr">${b.addr}</div>
      </div>
      <div>
        ${b.status === 'active' ? '<span class="pill p-ok"><span class="pd"></span>Faol</span>' :
          b.status === 'temporarily_closed' ? '<span class="pill p-warn"><span class="pd"></span>Vaqtincha yopiq</span>' :
          '<span class="pill p-dn"><span class="pd"></span>Faol emas</span>'}
      </div>
    </div>
    <div class="kpi-grid">
      <div><div class="l">Faol buyurtma</div><div class="v">${s.orders}</div></div>
      <div><div class="l">Past zaxira</div><div class="v" style="${s.low ? 'color:var(--warn)' : ''}">${s.low}</div></div>
      <div><div class="l">Materiallar</div><div class="v">${s.materials}</div></div>
      <div><div class="l">Xodimlar</div><div class="v">${s.workers}</div></div>
    </div>
  </a>`;
}).join('');
</script>
</body>
</html>
