<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ustaxonalar — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
<link rel="icon" href="../assets/brand/icon/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="../assets/brand/exports/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="../assets/brand/exports/apple-touch-icon-180.png" />
<meta name="theme-color" content="#FAF7F2" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Ustaxonalar</h1>
        <p class="sub">Platformada ro'yxatdan o'tgan barcha ustaxonalar.</p>
      </div>
      <div class="tools">
        <button class="btn btn-acc" type="button" onclick="openModal('m-new')">+ Yangi ustaxona</button>
      </div>
    </div>

    <div class="filters">
      <div class="input"><input placeholder="Ustaxona nomi yoki egasi..." /></div>
      <div class="chips">
        <button class="chip on">Hammasi</button>
        <button class="chip">Faol</button>
        <button class="chip">Bloklangan</button>
      </div>
    </div>

    <div class="card">
      <table class="tbl">
        <thead><tr><th>Ustaxona</th><th>Egasi</th><th>Filial</th><th>Buyurtma · 30 kun</th><th>Yaratildi</th><th>Holat</th><th></th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal wide" id="m-new">
  <div class="modal-h"><h3>Yangi ustaxona + egasi · atomik yaratish</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <h4 style="font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-6);margin:0 0 10px">Ustaxona ma'lumotlari</h4>
    <div class="field-row">
      <div class="field"><label>Ustaxona nomi</label><input placeholder="Furniture House" /></div>
      <div class="field"><label>Telefon</label><input placeholder="+998 71 ..." /></div>
    </div>
    <div class="field"><label>Manzil</label><input placeholder="Toshkent, ..." /></div>

    <h4 style="font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-6);margin:20px 0 10px">Egasi (atomik yaratiladi)</h4>
    <div class="field-row">
      <div class="field"><label>F.I.O</label><input placeholder="Hasan Karimov" /></div>
      <div class="field"><label>Telefon</label><input placeholder="+998 90 ..." /></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Login</label><input placeholder="hasan" /></div>
      <div class="field"><label>Vaqtinchalik parol</label>
        <div style="display:flex;gap:8px"><input value="TempPass2026!" style="flex:1" /><button class="btn btn-outline btn-sm" type="button" onclick="this.previousElementSibling.value='TempPass'+Math.random().toString(36).slice(2,8).toUpperCase()+'!';toast('Parol qaytarildi')">↻ Qayta</button></div>
      </div>
    </div>
    <div class="banner warn"><div class="ic">!</div><div class="grow">Parol bu yerda bir marta ko'rsatiladi · saqlab oling.</div></div>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Bekor</button><button class="btn btn-acc" onclick="closeModal('m-new');toast('Ustaxona va egasi yaratildi')">Yaratish</button></div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

document.getElementById('body').innerHTML = SEED.workshops.map(w => `
  <tr class="clickable" onclick="location.href='workshop-detail.html?id=${w.id}'">
    <td><div style="display:flex;align-items:center;gap:11px"><div style="width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,#A6471F,#8C3814);color:#fff;font:700 13px/1 var(--f-display);display:grid;place-items:center">${w.mk}</div><div class="nm">${w.name}</div></div></td>
    <td><div class="nm" style="font-weight:500">${w.ownerName}<small style="color:var(--ink-6);font:400 11px var(--f-mono)">${w.ownerPhone}</small></div></td>
    <td>${w.branches}</td>
    <td class="num">${w.orders30d}</td>
    <td class="num" style="font-size:11.5px;color:var(--ink-6)">${w.createdOn}</td>
    <td>${w.status === 'active' ? '<span class="pill p-ok"><span class="pd"></span>Faol</span>' : '<span class="pill p-bad"><span class="pd"></span>Bloklangan</span>'}</td>
    <td onclick="event.stopPropagation()">
      <div class="menu-wrap">
        <button class="menu-btn" data-menu-toggle>⋯</button>
        <div class="menu">
          <a class="mi" href="workshop-detail.html?id=${w.id}">Tafsilotlar</a>
          ${w.status === 'active' ? `<button class="mi danger" onclick="confirmAction({title:'Ustaxonani bloklash',msg:'Egasi va xodimlar sessiyalari yopiladi. Mijozlar ta\'sirlanmaydi. Buyurtmalar to\'xtaydi.',reasonField:true,danger:true,okText:'Bloklash'},()=>toast('Bloklandi'))">Bloklash</button>` : `<button class="mi" onclick="toast('Bloklash bekor qilindi')">Faollashtirish</button>`}
        </div>
      </div>
    </td>
  </tr>
`).join('');
</script>
</body>
</html>
