<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Buyurtmalar (cross) — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Cross-workshop buyurtmalar</h1>
        <p class="sub">Faqat ko'rinish · operator amallari mavjud emas (egasi va xodimlar amal qiladi).</p>
      </div>
      <div class="tools">
        <button class="btn btn-outline btn-sm" type="button" onclick="toast('CSV yuklanmoqda')">CSV</button>
      </div>
    </div>

    <div class="filters">
      <select id="ws"><option value="all">Barcha sehlar</option><option>Furniture House</option><option>Toshkent Mebel</option></select>
      <div class="chips">
        <button class="chip on">Hammasi</button>
        <button class="chip">Faol</button>
        <button class="chip">Tugatilgan</button>
      </div>
      <div class="input"><input placeholder="ID yoki mijoz..." /></div>
    </div>

    <div class="card">
      <table class="tbl">
        <thead><tr><th>ID</th><th>Seh / Filial</th><th>Mijoz</th><th>Holat</th><th class="right">Summa</th><th>Vaqt</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

document.getElementById('body').innerHTML = SEED.orders.map(o => {
  const cl = SEED.lookup.clientById(o.clientId);
  const br = SEED.lookup.branchById(o.branchId);
  return `<tr>
    <td class="id">${o.id}</td>
    <td><div class="nm">Furniture House<small style="color:var(--ink-6);font:400 11px var(--f-mono)">${br?.name}</small></div></td>
    <td>${cl?.name}</td>
    <td><span class="pill ${SEED.STATE_PILL[o.state]}"><span class="pd"></span>${SEED.STATE_LABELS[o.state]}</span></td>
    <td class="amt">${fmtTiyin(o.totalTiyin)}</td>
    <td><span class="num" style="font-size:11.5px;color:var(--ink-6)">${o.placedAt}</span></td>
  </tr>`;
}).join('');
</script>
</body>
</html>
