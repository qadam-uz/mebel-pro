<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Background ish — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Background ish · scheduler</h1>
        <p class="sub">Avtomatik ravishda ishlaydigan ishlar (in-process scheduler).</p>
      </div>
    </div>

    <div class="card">
      <table class="tbl">
        <thead><tr><th>Ish nomi</th><th>Jadval</th><th>Oxirgi ishlashi</th><th>Natija</th><th>Xulosa</th><th></th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</main>

<div id="scrim" class="scrim"></div>
<div class="modal" id="m-log">
  <div class="modal-h"><h3 id="log-title">Ish jurnali</h3><button class="x" data-close-modal>✕</button></div>
  <div class="modal-b">
    <pre id="log-body" style="background:var(--deep);color:#D6CDBE;padding:14px 16px;border-radius:8px;font:500 12px/1.5 var(--f-mono);overflow:auto;max-height:60vh"></pre>
  </div>
  <div class="modal-f"><button class="btn btn-outline" data-close-modal>Yopish</button><button class="btn btn-acc" onclick="closeModal('m-log');toast('Ish ishga tushdi')">Hozir ishga tushirish</button></div>
</div>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

const _jobsById = {};
SEED.jobs.forEach(j => _jobsById[j.id] = j);

document.getElementById('body').innerHTML = SEED.jobs.map(j => `
  <tr class="clickable" data-job="${j.id}">
    <td class="nm">${j.name}</td>
    <td><small style="color:var(--ink-8);font:400 12px var(--f-mono)">${j.schedule}</small></td>
    <td><span class="num" style="font-size:11.5px;color:var(--ink-6)">${j.lastRun}</span></td>
    <td>${j.lastResult === 'ok' ? '<span class="pill p-ok"><span class="pd"></span>Muvaffaqiyatli</span>' : '<span class="pill p-bad"><span class="pd"></span>Failed</span>'}</td>
    <td><small style="color:${j.lastResult === 'failed' ? 'var(--danger)' : 'var(--ink-8)'};font-size:12px">${j.summary}</small></td>
    <td onclick="event.stopPropagation()">
      <div class="menu-wrap">
        <button class="menu-btn" data-menu-toggle>⋯</button>
        <div class="menu">
          <button class="mi" data-action="log" data-job="${j.id}">Jurnalni ko'rish</button>
          <button class="mi" data-action="run">Hozir ishga tushirish</button>
        </div>
      </div>
    </td>
  </tr>
`).join('');

document.getElementById('body').addEventListener('click', e => {
  const action = e.target.dataset.action;
  const jobId = e.target.dataset.job || e.target.closest('tr')?.dataset.job;
  if (!jobId) return;
  if (action === 'run') {
    confirmAction({ title: 'Ishni hozir ishga tushirish' }, () => toast('Ish ishga tushdi'));
  } else {
    showLog(jobId);
  }
});

function showLog(id) {
  const j = _jobsById[id];
  if (!j) return;
  document.getElementById('log-title').textContent = j.id;
  document.getElementById('log-body').textContent = `[INFO] Job ${j.id} started at 08:00:00\n[INFO] Connecting to inventory DB...\n${j.error ? '[ERROR] ' + j.error + '\n[ERROR] Job aborted' : '[INFO] ' + j.summary + '\n[INFO] Completed in 184ms'}`;
  openModal('m-log');
}
</script>
</body>
</html>
