<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Audit log — Mebel Pro · Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
<main class="page-content">
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Audit log · platforma</h1>
        <p class="sub">Barcha sehlardagi muhim amallar.</p>
      </div>
      <div class="tools">
        <button class="btn btn-outline btn-sm" type="button" onclick="toast('CSV yuklanmoqda')">CSV</button>
      </div>
    </div>

    <div class="filters">
      <select><option>Barcha sehlar</option><option>Furniture House</option><option>Toshkent Mebel</option></select>
      <select><option>Hamma modullar</option><option>orders</option><option>inventory</option><option>identity</option><option>finance</option><option>workshop</option></select>
      <select><option>Oxirgi 24 soat</option><option>Oxirgi 7 kun</option></select>
      <div class="input"><input placeholder="Obyekt ID..." /></div>
    </div>

    <div class="card">
      <table class="tbl">
        <thead><tr><th>Vaqt</th><th>Seh</th><th>Modul</th><th>Amal</th><th>Xodim</th><th>Tafsilot</th></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/admin-shell.js"></script>
<script>
renderAdminShell();

document.getElementById('body').innerHTML = SEED.auditLog.map(a => {
  const actor = SEED.lookup.userById(a.actor) || SEED.lookup.clientById(a.actor);
  return `<tr>
    <td class="num" style="font-size:11.5px;color:var(--ink-6)">${a.t}</td>
    <td><small style="color:var(--ink-8)">Furniture House</small></td>
    <td><small style="color:var(--ink-8);font-size:12px">${a.module}</small></td>
    <td><span class="pill p-conf" style="font-size:10.5px"><span class="pd"></span>${a.action}</span></td>
    <td>${actor?.name || a.actor}</td>
    <td><small style="color:var(--ink-10);font-size:12.5px">${a.detail}</small></td>
  </tr>`;
}).join('');
</script>
</body>
</html>
