<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Loyihalar — Mebel Pro · Mijoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
<script src="../assets/app.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/client-shell.js"></script>
<script>renderClientHeader('cutting-drafts.html');</script>

<main class="container" style="padding: 24px 0 64px">
  <div class="page-head">
    <div>
      <h1>Kesim chizmalari</h1>
      <p class="sub">Saqlangan loyihalar 7 kun saqlanadi va keyin avtomatik o'chiriladi.</p>
    </div>
    <div class="tools">
      <a class="btn btn-acc" href="branches.html">+ Yangi kesim chizmasi</a>
    </div>
  </div>

  <div class="card">
    <table class="tbl">
      <thead>
        <tr>
          <th>ID</th><th>Material</th><th>Filial</th><th class="right">Qism</th><th class="right">List</th><th class="right">Qoldiq</th><th>Holat</th><th>Yaratildi</th><th></th>
        </tr>
      </thead>
      <tbody id="drafts-body"></tbody>
    </table>
  </div>
</main>

<script>
function render() {
  const tbody = document.getElementById('drafts-body');
  if (SEED.cuttings.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty"><div class="ic">∅</div><h3>Hozir loyihalar yo'q</h3><p>Yangi chizma yarating va shu yerda saqlanadi.</p><a class="btn btn-acc" href="branches.html">+ Boshlash</a></div></td></tr>`;
    return;
  }
  tbody.innerHTML = SEED.cuttings.map(c => {
    const mat = SEED.lookup.matById(c.matId);
    const br = SEED.lookup.branchById(c.branchId);
    const statusPill = c.status === 'confirmed' ? 'p-rdy' : c.status === 'invalidated' ? 'p-dn' : 'p-new';
    const statusLabel = c.status === 'confirmed' ? 'Buyurtma berildi' : c.status === 'invalidated' ? 'O\'tkazilgan' : 'Loyiha';
    return `
      <tr class="clickable" onclick="location.href='cutting-result.html?id=${c.id}'">
        <td class="id">${c.id}</td>
        <td class="nm">${mat?.name || '—'}<small>${mat?.thickness || ''} mm · ${c.source === 'shop' ? 'sehdan' : 'o\'zim olib kelaman'}</small></td>
        <td>${br?.city || ''} · ${br?.name || ''}</td>
        <td class="right num">${c.parts}</td>
        <td class="right num">${c.sheets}</td>
        <td class="right num" style="color: ${c.wastePct > 15 ? 'var(--warn)' : 'var(--ink-12)'}">${c.wastePct}%</td>
        <td><span class="pill ${statusPill}"><span class="pd"></span>${statusLabel}</span></td>
        <td class="num" style="font-size:11.5px;color:var(--ink-6)">${c.when}</td>
        <td onclick="event.stopPropagation()">
          <div class="menu-wrap">
            <button class="menu-btn" type="button" data-menu-toggle>⋯</button>
            <div class="menu">
              <a class="mi" href="cutting-result.html?id=${c.id}">Ko'rish</a>
              ${c.status === 'draft' ? `<a class="mi" href="order-new.html?cutting=${c.id}">Buyurtma berish →</a>` : ''}
              ${c.status === 'draft' ? `<button class="mi danger" onclick="confirmAction({title:'O\'chirish',msg:'Bu loyiha qaytarib bo\'lmaydi — davom etasizmi?',okText:'O\'chirish',danger:true},()=>{toast('Loyiha o\'chirildi'); setTimeout(render,400)})">O'chirish</button>` : ''}
            </div>
          </div>
        </td>
      </tr>`;
  }).join('');
}
render();
</script>
</body>
</html>
