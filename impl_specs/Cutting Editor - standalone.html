  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"b1766520-39a2-4391-94e9-5ca497a8b61c\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>\n@keyframes cutToastIn { from { opacity:0; transform: translate(-50%, 12px); } to { opacity:1; transform: translate(-50%,0); } }\n@keyframes cutPopIn { from { opacity:0; transform: translateY(-6px) scale(0.98); } to { opacity:1; transform: translateY(0) scale(1); } }\n@keyframes cutFadeIn { from { opacity:0; } to { opacity:1; } }\n@keyframes cutDialogIn { from { opacity:0; transform: translateY(8px) scale(0.97); } to { opacity:1; transform: translateY(0) scale(1); } }\nbody { margin:0; background:#f4f6f8; font-family: -apple-system, \"Segoe UI\", Roboto, Helvetica, Arial, sans-serif; color:#0f1b2a; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }\n* { box-sizing: border-box; }\ninput { font-family: inherit; }\ninput::placeholder { color:#9aa4b2; }\ninput:focus { outline: 2px solid #0f766e; outline-offset: 0px; border-color:#0f766e !important; }\nbutton:focus-visible { outline: 2px solid #0f766e; outline-offset: 2px; }\na { color:#0f766e; }\na:hover { color:#0b5b55; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#f4f6f8; padding:24px 32px 96px;\">\n\n  <!-- Top bar -->\n  <div style=\"max-width:1360px; margin:0 auto 20px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px;\">\n    <div style=\"display:flex; flex-direction:column; gap:4px;\">\n      <div style=\"font-size:11.5px; color:#5b6675; font-weight:600; letter-spacing:0.02em; text-transform:uppercase;\">Kesish loyihalari<\u002Fdiv>\n      <div style=\"display:flex; align-items:center; gap:12px;\">\n        <span style=\"font-size:23px; font-weight:700; letter-spacing:-0.02em;\">Loyiha #482<\u002Fspan>\n        <span style=\"font-size:11px; font-weight:700; color:#5b6675; background:#e5e9ef; padding:3px 9px; border-radius:999px;\">Qoralama<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:5px; background:#ffffff; border:1px solid #e5e9ef; border-radius:8px; padding:4px; box-shadow:0 1px 2px rgba(15,27,42,0.04);\">\n      <button sc-camel-on-click=\"{{ setViewportDesktop }}\" style=\"border:none; border-radius:6px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; background:{{ desktopSegBg }}; color:{{ desktopSegFg }};\">Desktop<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setViewportMobile }}\" style=\"border:none; border-radius:6px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; background:{{ mobileSegBg }}; color:{{ mobileSegFg }};\">Mobil<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1360px; margin:0 auto; display:flex; flex-direction:column; gap:20px;\">\n\n    <!-- Parts card -->\n    <div style=\"background:#ffffff; border:1px solid #e5e9ef; border-radius:12px; overflow:hidden; box-shadow:0 1px 2px rgba(15,27,42,0.04);\">\n\n      <!-- Card header -->\n      <div style=\"padding:18px 20px 16px; display:flex; align-items:center; flex-wrap:wrap; gap:14px; border-bottom:1px solid #e5e9ef;\">\n        <div style=\"display:flex; flex-direction:column; gap:3px;\">\n          <div style=\"font-size:15px; font-weight:700; letter-spacing:-0.01em;\">Detallar<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#5b6675; font-variant-numeric:tabular-nums;\">\n            {{ totalParts }} detal · {{ totalMaterials }} material · ~{{ totalM2 }} m²\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ errorCount }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ toggleErrorFilter }}\" style=\"border:1px solid {{ errorChipBorder }}; background:{{ errorChipBg }}; color:#be3a2b; font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; cursor:pointer; display: rder-radius:8px; cursor:pointer; color:#5b6675; font-size:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;\" style-hover=\"background:#e5e9ef;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"padding:12px; display:flex; flex-direction:column; gap:7px; max-height:52vh; overflow:auto;\">\n          <sc-for list=\"{{ materialModalOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ opt.onSelect }}\" style=\"display:flex; align-items:center; gap:13px; width:100%; text-align:left; border:1px solid {{ opt.border }}; background:{{ opt.bg }}; border-radius:10px; padding:13px 14px; cursor:pointer;\" style-hover=\"border-color:#c8e8e3;\">\n              <span style=\"width:36px; height:36px; border-radius:8px; background:{{ opt.swatch }}; box-shadow:inset 0 0 0 1px rgba(15,27,42,0.12); flex-shrink:0;\"><\u002Fspan>\n              <div style=\"flex:1;\">\n                <div style=\"font-size:13.5px; font-weight:600; color:#0f1b2a;\">{{ opt.name }}<\u002Fdiv>\n                <div style=\"font-size:11.5px; color:#5b6675; margin-top:2px;\">{{ opt.grainLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ opt.selected }}\" hint-placeholder-val=\"{{ false }}\">\n                <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:14px 22px; border-top:1px solid #e5e9ef; display:flex; justify-content:flex-end;\">\n          <button sc-camel-on-click=\"{{ closeMaterialModal }}\" style=\"border:1px solid #e5e9ef; background:#ffffff; color:#5b6675; font-weight:600; font-size:13px; padding:9px 18px; border-radius:8px; cursor:pointer; white-space:nowrap;\" style-hover=\"backgro v style=\"flex:1; display:flex; flex-wrap:wrap; gap:6px;\">\n                <sc-for list=\"{{ side.options }}\" as=\"opt\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ opt.onSelect }}\" style=\"display:flex; align-items:center; gap:6px; border:1px solid {{ opt.border }}; background:{{ opt.chipBg }}; color:{{ opt.chipFg }}; border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer;\">\n                    <sc-if value=\"{{ opt.hasNum }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"width:16px; height:16px; border-radius:50%; background:{{ opt.dotBg }}; color:{{ opt.dotFg }}; font-size:9.5px; font-weight:700; display:flex; align-items:center; justify-content:center;\">{{ opt.num }}<\u002Fspan>\n                    <\u002Fsc-if>\n                    {{ opt.name }}\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:14px 22px; border-top:1px solid #e5e9ef; display:flex; align-items:center; justify-content:space-between; gap:12px;\">\n          <button sc-camel-on-click=\"{{ kromModalApplyAll }}\" style=\"border:1px solid #c8e8e3; background:#e9f6f4; color:#0f766e; font-weight:700; font-size:12.5px; padding:9px 16px; border-radius:8px; cursor:pointer; white-space:nowrap;\">Д1 ni to'rt tomonga qo'llash<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeKromModal }}\" style=\"border:1px solid #e5e9ef; background:#ffffff; color:#5b6675; font-weight:600; font-size:13px; padding:9px 18px; border-radius:8px; cursor:pointer; white-space:nowrap;\" style-hover=\"background:#f4f6f8;\">Yopish<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Undo toast -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; bottom:82px; left:50%; transform:translateX(-50%); background:#0f1b2a; color:#ffffff; padding:11px 11px 11px 17px; border-radius:10px; display:flex; align-items:center; gap:16px; font-size:13px; z-index:50; animation: cutToastIn 0.18s cubic-bezier(0.16,1,0.3,1); box-shadow:0 12px 32px rgba(15,27,42,0.32);\">\n      <span>{{ toast.message }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ undoDelete }}\" style=\"border:none; background:rgba(200,232,227,0.14); color:#c8e8e3; font-weight:700; font-size:13px; cursor:pointer; padding:6px 12px; border-radius:7px;\">Qaytarish<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    viewport: 'desktop',\n    errorFilter: false,\n    collapsed: {},\n    activeTab: 'optimizer',\n    chosenTab: 'optimizer',\n    toast: null,\n    openRow: null,\n    registryReplace: null,\n    showAddTape: false,\n    materialModal: null,\n    kromModal: null,\n    tapeCatalog: [\n      { id: 't1', name: \"PVX Oq 0.4mm · Rehau\" },\n      { id: 't2', name: \"PVX Yong'oq 2mm · Egger\" },\n      { id: 't3', name: \"PVX Kulrang 1mm · Rehau\" },\n      { id: 't4', name: \"PVX Yashil 0.4mm · Egger\" }\n    ],\n    extraTapeIds: [],\n    materials: [\n      { id: 'm1', name: \"LDSP Oq gladkiy 16mm · Egger\", grained: true, swatch: '#efece4' },\n      { id: 'm2', name: \"MDF 18mm · Kronospan\", grained: false, swatch: '#dfe2e6' },\n      { id: 'm3', name: \"Kulrang Bardolino Eman · 2800×2070\", grained: true, swatch: '#8d7a63' }\n    ],\n    parts: [\n      { id: 'p1', materialId: 'm1', name: 'Yon devor', boy: '720', en: '500', soni: 2, tola: true, krom: { U: 't1', P: null, CH: 't1', O: null }, error: null },\n      { id: 'p2', materialId: 'm1', name: 'Tokcha', boy: '764', en: '480', soni: 3, tola: true, krom: { U: null, P: null, CH: null, O: null }, error: null },\n      { id: 'p3', materialId: 'm1', name: 'Eshik', boy: '2900', en: '600', soni: 1, tola: true, krom: { U: null, P: null, CH: null, O: null }, error: \"Ruxsat etilgan uzunlikdan katta (max 2800 mm)\" },\n      { id: 'p4', materialId: 'm1', name: 'Orqa devor', boy: '1200', en: '800', soni: 1, tola: false, krom: { U: null, P: null, CH: null, O: null }, error: null },\n      { id: 'p5', materialId: 'm2', name: 'Front', boy: '716', en: '396', soni: 4, tola: false, krom: { U: 't2', P: 't2', CH: 't2', O: 't2' }, error: null },\n      { id: 'p6', materialId: 'm3', name: '', boy: '894', en: '477', soni: 2, tola: true, krom: { U: null, P: null, CH: null, O: null }, error: null },\n      { id: 'p7', materialId: 'm3', name: '', boy: '928', en: '450', soni: 3, tola: true, krom: { U: null, P: null, CH: null, O: null }, error: null },\n      { id: 'p8', materialId: 'm3', name: '', boy: '1832', en: '482', soni: 2, tola: true, krom: { U: null, P: null, CH: null, O: null }, error: null }\n    ],\n    _focusRowId: null\n  };\n\n  componentDidUpdate(prevProps, prevState) {\n    if (this.state._focusRowId && this.state._focusRowId !== prevState._focusRowId) {\n      const id = this.state._focusRowId;\n      requestAnimationFrame(() => {\n        const el = document.querySelector('[data-row-id=\"' + id + '\"][data-field=\"boy\"]');\n        if (el) { el.focus(); el.select && el.select(); }\n      });\n      this.setState({ _focusRowId: null });\n    }\n  }\n\n  toggleGroup = (materialId) => {\n    this.setState(s => ({ collapsed: { ...s.collapsed, [materialId]: !s.collapsed[materialId] } }));\n  };\n\n  toggleErrorFilter = () => { this.setState(s => ({ errorFilter: !s.errorFilter })); };\n  setViewport = (v) => this.setState({ viewport: v });\n\n  updateField = (id, field, value) => {\n    this.setState(s => ({ parts: s.parts.map(p => p.id === id ? { ...p, [field]: value } : p) }));\n  };\n\n  setTola = (id, val) => this.setState(s => ({ parts: s.parts.map(p => p.id === id ? { ...p, tola: val } : p) }));\n\n  handleKeyDown = (e) => {\n    if (e.key !== 'Enter') return;\n    e.preventDefault();\n    const inputs = Array.from(document.querySelectorAll('[data-cutting-input=\"1\"]'));\n    const idx = inputs.indexOf(e.target);\n    if (idx === -1) return;\n    if (idx === inputs.length - 1) {\n      this.addRow(true);\n    } else {\n      inputs[idx + 1].focus();\n      inputs[idx + 1].select && inputs[idx + 1].select();\n    }\n  };\n\n  addRow = (focusAfter) => {\n    this.setState(s => {\n      const last = s.parts[s.parts.length - 1];\n      const id = 'p' + Date.now();\n      const newPart = { id, materialId: last ? last.materialId : null, name: '', boy: '', en: '', soni: 1, tola: last ? last.tola : false, krom: { U: null, P: null, CH: null, O: null }, error: null };\n      return { parts: [...s.parts, newPart], _focusRowId: focusAfter ? id : s._focusRowId };\n    });\n  };\n\n  duplicateRow = (id) => {\n    this.setState(s => {\n      const idx = s.parts.findIndex(p => p.id === id);\n      if (idx === -1) return {};\n      const src = s.parts[idx];\n      const newId = 'p' + Date.now();\n      const copy = { ...src, id: newId, krom: { ...src.krom } };\n      const parts = s.parts.slice();\n      parts.splice(idx + 1, 0, copy);\n      return { parts, _focusRowId: newId };\n    });\n  };\n\n  deleteRow = (id) => {\n    this.setState(s => {\n      const idx = s.parts.findIndex(p => p.id === id);\n      if (idx === -1) return {};\n      const part = s.parts[idx];\n      const parts = s.parts.filter(p => p.id !== id);\n      return { parts, toast: { message: '«' + (part.name || ('D' + (idx + 1))) + '» o\\'chirildi', part, index: idx } };\n    });\n    clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(() => { this.setState({ toast: null }); }, 6000);\n  };\n\n  undoDelete = () => {\n    clearTimeout(this._toastTimer);\n    this.setState(s => {\n      if (!s.toast) return {};\n      const parts = s.parts.slice();\n      parts.splice(s.toast.index, 0, s.toast.part);\n      return { parts, toast: null };\n    });\n  };\n\n  toggleRowMenu = (id) => {\n    this.setState(s => ({ openRow: (s.openRow && s.openRow.id === id && s.openRow.type === 'menu') ? null : { id, type: 'menu' } }));\n  };\n\n  changeMaterial = (id, materialId) => {\n    this.setState(s => ({ parts: s.parts.map(p => p.id === id ? { ...p, materialId } : p), openRow: null }));\n  };\n\n  openPartMaterialModal = (id) => this.setState({ materialModal: { type: 'part', id }, openRow: null });\n  openGroupMaterialModal = (key) => this.setState({ materialModal: { type: 'group', id: key }, openRow: null });\n  closeMaterialModal = () => this.setState({ materialModal: null });\n\n  applyMaterialModal = (newId) => {\n    this.setState(s => {\n      if (!s.materialModal) return { materialModal: null };\n      const mm = s.materialModal;\n      let parts;\n      if (mm.type === 'part') {\n        parts = s.parts.map(p => p.id === mm.id ? { ...p, materialId: newId } : p);\n      } else {\n        parts = s.parts.map(p => ((p.materialId || '__none__') === mm.id) ? { ...p, materialId: newId } : p);\n      }\n      return { parts, materialModal: null };\n    });\n  };\n\n  openKromModal = (id) => this.setState({ kromModal: { id }, openRow: null });\n  closeKromModal = () => this.setState({ kromModal: null });\n\n  setKrom = (id, side, tapeId) => {\n    this.setState(s => ({ parts: s.parts.map(p => p.id === id ? { ...p, krom: { ...p.krom, [side]: tapeId } } : p), openRow: null }));\n  };\n\n  applyAllSides = (id, tapeId) => {\n    this.setState(s => ({ parts: s.parts.map(p => p.id === id ? { ...p, krom: { U: tapeId, P: tapeId, CH: tapeId, O: tapeId } } : p), openRow: null }));\n  };\n\n  toggleRegistryReplace = (tapeId) => {\n    this.setState(s => ({ registryReplace: s.registryReplace === tapeId ? null : tapeId, showAddTape: false }));\n  };\n\n  replaceTape = (oldId, newId) => {\n    this.setState(s => ({\n      parts: s.parts.map(p => {\n        const krom = {};\n        ['U', 'P', 'CH', 'O'].forEach(side => { krom[side] = p.krom[side] === oldId ? newId : p.krom[side]; });\n        return { ...p, krom };\n      }),\n      registryReplace: null\n    }));\n  };\n\n  toggleAddTape = () => this.setState(s => ({ showAddTape: !s.showAddTape, registryReplace: null }));\n\n  addTapeToRegistry = (tapeId) => {\n    this.setState(s => ({ extraTapeIds: s.extraTapeIds.includes(tapeId) ? s.extraTapeIds : [...s.extraTapeIds, tapeId], showAddTape: false }));\n  };\n\n  setActiveTab = (tab) => this.setState({ activeTab: tab });\n  chooseResult = (tab) => this.setState({ chosenTab: tab, activeTab: tab });\n\n  renderVals() {\n    const s = this.state;\n    const COLORS = [\n      { fg: '#0f766e', bg: '#e9f6f4' },\n      { fg: '#1d62d8', bg: '#edf2fc' },\n      { fg: '#b45309', bg: '#fbf3e5' },\n      { fg: '#15803d', bg: '#ecf7f0' },\n      { fg: '#be3a2b', bg: '#fcedea' },\n      { fg: '#0f1b2a', bg: '#e5e9ef' }\n    ];\n    const tapeName = (id) => { const t = s.tapeCatalog.find(t => t.id === id); return t ? t.name : ''; };\n\n    const order = [];\n    s.parts.forEach(p => { ['U', 'P', 'CH', 'O'].forEach(side => { const v = p.krom[side]; if (v && !order.includes(v)) order.push(v); }); });\n    s.extraTapeIds.forEach(id => { if (!order.includes(id)) order.push(id); });\n\n    const registry = order.map((id, i) => ({\n      id, num: i + 1, name: tapeName(id), fg: COLORS[i % 6].fg, bg: COLORS[i % 6].bg,\n      isReplaceOpen: s.registryReplace === id,\n      onToggle: () => this.toggleRegistryReplace(id),\n      replaceChoices: s.tapeCatalog.filter(t => t.id !== id).map(t => ({ id: t.id, name: t.name, onSelect: () => this.replaceTape(id, t.id) }))\n    }));\n    const registryLookup = {};\n    registry.forEach(r => { registryLookup[r.id] = r; });\n    const addTapeChoices = s.tapeCatalog.filter(t => !order.includes(t.id)).map(t => ({ id: t.id, name: t.name, onSelect: () => this.addTapeToRegistry(t.id) }));\n\n    const buildSideBadge = (p, side) => {\n      const tapeId = p.krom[side];\n      const reg = tapeId ? registryLookup[tapeId] : null;\n      return {\n        display: reg ? String(reg.num) : '·',\n        fg: reg ? reg.fg : '#b8c0cb',\n        bg: reg ? reg.bg : '#ffffff'\n      };\n    };\n\n    const decoratedParts = s.parts.map((p, idx) => {\n      const material = s.materials.find(m => m.id === p.materialId) || null;\n      return {\n        ...p,\n        displayName: p.name || ('D' + (idx + 1)),\n        rowNum: idx + 1,\n        rowBg: p.error ? '#fdf4f2' : '#ffffff',\n        errBorder: p.error ? '#e0a79f' : '#e5e9ef',\n        tolaBorder: p.tola ? '#0f766e' : '#e5e9ef',\n        tolaBg: p.tola ? '#e9f6f4' : '#ffffff',\n        tolaFg: p.tola ? '#0f766e' : '#b8c0cb',\n        sideD1: buildSideBadge(p, 'U'), sideD2: buildSideBadge(p, 'P'), sideSh1: buildSideBadge(p, 'CH'), sideSh2: buildSideBadge(p, 'O'),\n        onOpenKromModal: () => this.openKromModal(p.id),\n        menuOpen: !!(s.openRow && s.openRow.id === p.id && s.openRow.type === 'menu'),\n        hasError: !!p.error,\n        showTola: material ? material.grained : false,\n        onChangeName: (e) => this.updateField(p.id, 'name', e.target.value),\n        onChangeBoy: (e) => this.updateField(p.id, 'boy', e.target.value),\n        onChangeEn: (e) => this.updateField(p.id, 'en', e.target.value),\n        onChangeSoni: (e) => this.updateField(p.id, 'soni', e.target.value),\n        onToggleTola: () => this.setTola(p.id, !p.tola),\n        onDuplicate: () => this.duplicateRow(p.id),\n        onDelete: () => this.deleteRow(p.id),\n        onToggleMenu: () => this.toggleRowMenu(p.id),\n        onOpenMaterialModal: () => this.openPartMaterialModal(p.id),\n        materialChoices: s.materials.map(m => ({ id: m.id, name: m.name, onSelect: () => this.changeMaterial(p.id, m.id) }))\n      };\n    });\n\n    const groupsMap = {};\n    const groupOrder = [];\n    decoratedParts.forEach(p => {\n      const key = p.materialId || '__none__';\n      if (!groupsMap[key]) { groupsMap[key] = []; groupOrder.push(key); }\n      groupsMap[key].push(p);\n    });\n    const orderedKeys = groupOrder.slice().sort((a, b) => (a === '__none__' ? -1 : b === '__none__' ? 1 : 0));\n\n    let groups = orderedKeys.map(key => {\n      const partsInGroup = groupsMap[key];\n      const material = key === '__none__' ? null : s.materials.find(m => m.id === key);\n      const m2 = partsInGroup.reduce((sum, p) => sum + ((parseFloat(p.boy) || 0) * (parseFloat(p.en) || 0) * (p.soni || 0)), 0) / 1e6;\n      const collapsedBool = !!s.collapsed[key];\n      return {\n        key,\n        materialName: material ? material.name : \"Material tanlanmagan\",\n        swatch: material ? material.swatch : '#d7dbe0',\n        summary: partsInGroup.length + ' detal · ' + m2.toFixed(1) + ' m²',\n        chevronRotate: collapsedBool ? 'rotate(-90deg)' : 'rotate(0deg)',\n        collapsedFalse: !collapsedBool,\n        onToggle: () => this.toggleGroup(key),\n        onOpenMaterialModal: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.openGroupMaterialModal(key); },\n        parts: partsInGroup\n      };\n    });\n\n    if (s.errorFilter) {\n      groups = groups.map(g => ({ ...g, parts: g.parts.filter(p => p.hasError) })).filter(g => g.parts.length > 0);\n    }\n\n    const totalParts = decoratedParts.length;\n    const totalMaterials = s.materials.length;\n    const totalM2 = (decoratedParts.reduce((sum, p) => sum + ((parseFloat(p.boy) || 0) * (parseFloat(p.en) || 0) * (p.soni || 0)), 0) / 1e6).toFixed(1);\n    const errorCount = decoratedParts.filter(p => p.hasError).length;\n\n    const isDesktop = s.viewport === 'desktop';\n    const isMobile = s.viewport === 'mobile';\n\n    const kromModalOpen = !!s.kromModal;\n    let kromModalSubtitle = '';\n    let kromModalSides = [];\n    let kromModalApplyAll = () => {};\n    if (s.kromModal) {\n      const idx = s.parts.findIndex(x => x.id === s.kromModal.id);\n      const kp = s.parts[idx];\n      if (kp) {\n        const nm = kp.name || ('D' + (idx + 1));\n        kromModalSubtitle = '\\u00ab' + nm + '\\u00bb detali uchun';\n        const sideDefs = [['U', \"Д1\"], ['P', \"Д2\"], ['CH', \"Ш1\"], ['O', \"Ш2\"]];\n        kromModalSides = sideDefs.map(([key, label]) => {\n          const tapeId = kp.krom[key];\n          const options = [];\n          options.push({ id: null, name: 'Kromsiz', hasNum: false, border: !tapeId ? '#0f766e' : '#e5e9ef', chipBg: !tapeId ? '#e9f6f4' : '#ffffff', chipFg: !tapeId ? '#0f766e' : '#5b6675', onSelect: () => this.setKrom(kp.id, key, null) });\n          registry.forEach(r => {\n            const selected = tapeId === r.id;\n            options.push({ id: r.id, name: r.name, hasNum: true, num: r.num, dotBg: r.bg, dotFg: r.fg, border: selected ? '#0f766e' : '#e5e9ef', chipBg: selected ? '#e9f6f4' : '#ffffff', chipFg: selected ? '#0f766e' : '#0f1b2a', onSelect: () => this.setKrom(kp.id, key, r.id) });\n          });\n          s.tapeCatalog.filter(t => !order.includes(t.id)).forEach(t => {\n            options.push({ id: t.id, name: t.name, hasNum: false, border: '#e5e9ef', chipBg: '#ffffff', chipFg: '#5b6675', onSelect: () => this.setKrom(kp.id, key, t.id) });\n          });\n          return { key, label, options };\n        });\n        kromModalApplyAll = () => this.applyAllSides(kp.id, kp.krom.U);\n      }\n    }\n\n    let materialModalSubtitle = '';\n    let materialModalOptions = [];\n    if (s.materialModal) {\n      const mm = s.materialModal;\n      let currentId = null;\n      if (mm.type === 'part') {\n        const idx = s.parts.findIndex(x => x.id === mm.id);\n        const p = s.parts[idx];\n        currentId = p ? p.materialId : null;\n        const nm = (p && p.name) ? p.name : ('D' + (idx + 1));\n        materialModalSubtitle = '«' + nm + '» detali uchun';\n      } else {\n        currentId = mm.id === '__none__' ? null : mm.id;\n        const cnt = s.parts.filter(x => (x.materialId || '__none__') === mm.id).length;\n        materialModalSubtitle = 'Ushbu guruhdagi ' + cnt + ' detal uchun';\n      }\n      materialModalOptions = s.materials.map(m => ({\n        id: m.id, name: m.name, swatch: m.swatch,\n        grainLabel: m.grained ? 'Tolali material' : 'Tolasiz material',\n        selected: m.id === currentId,\n        border: m.id === currentId ? '#0f766e' : '#e5e9ef',\n        bg: m.id === currentId ? '#f7fbfa' : '#ffffff',\n        onSelect: () => this.applyMaterialModal(m.id)\n      }));\n    }\n\n    const variants = {\n      imported: { price: \"1 550 000 so'm\", sheets: \"1\", waste: \"11.2%\", edge: \"11.3 m\" },\n      optimizer: { price: \"1 240 000 so'm\", sheets: \"1\", waste: \"6.8%\", edge: \"11.3 m\" }\n    };\n    const activeVariant = variants[s.activeTab];\n    const chosenVariant = variants[s.chosenTab];\n    const isImportedTab = s.activeTab === 'imported';\n    const isOptimizerTab = s.activeTab === 'optimizer';\n\n    return {\n      viewport: s.viewport, isDesktop, isMobile,\n      setViewportDesktop: () => this.setViewport('desktop'),\n      setViewportMobile: () => this.setViewport('mobile'),\n      desktopSegBg: isDesktop ? '#0f766e' : 'transparent',\n      desktopSegFg: isDesktop ? '#ffffff' : '#5b6675',\n      mobileSegBg: isMobile ? '#0f766e' : 'transparent',\n      mobileSegFg: isMobile ? '#ffffff' : '#5b6675',\n      groups, totalParts, totalMaterials, totalM2, errorCount, toggleErrorFilter: this.toggleErrorFilter,\n      errorChipBorder: s.errorFilter ? '#be3a2b' : '#f0c9c2',\n      errorChipBg: s.errorFilter ? '#fbe0db' : '#fcedea',\n      registry, showAddTape: s.showAddTape, toggleAddTape: this.toggleAddTape, addTapeChoices,\n      handleKeyDown: this.handleKeyDown, addRow: () => this.addRow(true),\n      toast: s.toast, undoDelete: this.undoDelete,\n      isImportedTab, isOptimizerTab,\n      importedTabColor: isImportedTab ? '#0f766e' : '#8592a1',\n      optimizerTabColor: isOptimizerTab ? '#0f766e' : '#8592a1',\n      importedTabBorder: isImportedTab ? '#0f766e' : 'transparent',\n      optimizerTabBorder: isOptimizerTab ? '#0f766e' : 'transparent',\n      importedCheckPrefix: s.chosenTab === 'imported' ? '✓ ' : '',\n      optimizerCheckPrefix: s.chosenTab === 'optimizer' ? '✓ ' : '',\n      activeTabChosen: s.activeTab === s.chosenTab,\n      activeTabNotChosen: s.activeTab !== s.chosenTab,\n      chooseActive: () => this.chooseResult(s.activeTab),\n      tabImported: () => this.setActiveTab('imported'),\n      tabOptimizer: () => this.setActiveTab('optimizer'),\n      viewingNonChosen: s.activeTab !== s.chosenTab,\n      activeVariant, chosenVariant, showSavingsBanner: true,\n      materialModalOpen: !!s.materialModal, materialModalSubtitle, materialModalOptions,\n      closeMaterialModal: this.closeMaterialModal, stopModalClick: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },\n      kromModalOpen, kromModalSubtitle, kromModalSides, kromModalApplyAll, closeKromModal: this.closeKromModal\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
