# Mebel Pro CI / CD
#
# Three layers:
#
#   1. Verify (PR + push to main)
#        - verify-backend : ruff check · ruff format --check · mypy · pytest,
#                           then the infra-gated suites (Postgres locking,
#                           pg_trgm search, MinIO contract) against Compose
#                           data services
#        - verify-web     : pnpm lint:check · format:check · typecheck · i18n:check · test · build
#        - verify-e2e     : pnpm typecheck · Playwright browser tests
#      These mirror the per-directory check gates documented in the repo
#      AGENTS.md. Run them locally before pushing; CI is the safety net.
#
#   2. Images (PR + main, after verify)
#        - Builds the three deployable images ONCE: backend, web, edge.
#          PRs: build all three, push nothing (a compile smoke test). main —
#          a push, or "Run workflow" on main — also pushes them to GHCR:
#            ghcr.io/qadam-uz/mebel-pro-{backend,web}:<full commit sha>
#            ghcr.io/qadam-uz/mebel-pro-edge:<content tag>
#          The edge's tag comes from deploy/scripts/edge-tag.sh (a hash of its
#          build inputs — the one place that formula lives), so a commit that
#          leaves the Caddyfile alone leaves the running edge alone.
#        - Tags are immutable: no `latest`, no moving tags, and an image whose
#          tag GHCR already has is not rebuilt or re-pushed. Re-pushing would
#          repoint the tag at a new digest (build timestamps aren't
#          reproducible), compose would recreate that container on the next
#          deploy — for the edge, needlessly — and a re-run would recompile
#          the backend for nothing. So the server runs exactly what CI built.
#        - Auth is the job's own GITHUB_TOKEN; the server pulls anonymously
#          (the packages are public — deploy/AGENTS.md → First-time setup).
#        - linux/amd64, the runner's own arch. An arm64 server needs this job
#          on `ubuntu-24.04-arm` instead — not QEMU, under which the
#          PackingSolver compile is impractical.
#
#   3. Deploy (main only — a push, or "Run workflow" on main to redeploy —
#      after every other job is green)
#        - SSHes to the VPS as the deploy user and runs
#            DEPLOY_REF=<sha> bash deploy/scripts/deploy.sh
#          which `git fetch && git reset --hard <sha>` (the checkout supplies
#          the compose file and the live docs), pulls that SHA's images,
#          migrates as a separate gated step while the old release keeps
#          serving, then swaps the containers. Nothing is built on the server.
#
# Required GitHub config — secrets of the `production` ENVIRONMENT, which the
# deploy job runs in (Settings → Environments → production → Environment
# secrets; not repository secrets — an environment secret also overrides a
# repository secret of the same name):
#   secrets.DEPLOY_SSH_HOST         host / IP of the prod server
#   secrets.DEPLOY_SSH_USER         SSH user (must be in the `docker` group)
#   secrets.DEPLOY_SSH_KEY          private key for that user (PEM, no passphrase)
#   secrets.DEPLOY_SSH_PORT         optional — SSH port (default 22)
#   secrets.DEPLOY_SSH_FINGERPRINT  optional, recommended — the server's SSH host
#                                   key fingerprint. Unset = the action skips host
#                                   key verification (accepts any server key).
#     Value: `SHA256:…` exactly as ssh-keygen prints it, prefix included, taken
#     ON the server from its ECDSA host key:
#       ssh-keygen -l -f /etc/ssh/ssh_host_ecdsa_key.pub | cut -d' ' -f2
#     ECDSA, not the ed25519 key the action's README example uses: the action's
#     Go SSH client (drone-ssh → golang.org/x/crypto) sets no host-key
#     preference, and x/crypto's default ranks plain host keys ECDSA first,
#     RSA next, Ed25519 last; the handshake settles on the first of those the
#     server holds — ECDSA on a stock Ubuntu box. (No ECDSA key there? Then RSA,
#     then ed25519.) The wrong key type fails the deploy with "ssh: host key
#     fingerprint mismatch".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded verify runs on the same PR, but never cancel a deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Image names are <prefix>-backend / -web / -edge — the same names
  # deploy/compose.prod.yaml pulls. Change both together.
  IMAGE_PREFIX: ghcr.io/qadam-uz/mebel-pro

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend gate — ruff (lint + format), mypy, pytest.
  # ---------------------------------------------------------------------------
  verify-backend:
    name: Backend · lint · types · tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.8.22
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `uv sync --frozen` resolves Python from backend/.python-version (3.12)
      # and pyproject.toml's requires-python, downloading it on demand.
      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest

      # The main suite is hermetic (in-memory SQLite, stubbed S3). The
      # infra-gated suites assert what SQLite/stubs can't: stock-adjustment row
      # locking on real Postgres, the catalog search's `pg_trgm` typo tier, and
      # the S3FileStorage round-trip against real MinIO. Without this step they
      # are skipped everywhere — a test that never runs is documentation, not a
      # test.
      - name: Start data services (Postgres + MinIO)
        working-directory: deploy
        run: |
          docker compose --env-file .env.dev.example -f compose.yaml up -d --wait postgres minio
          docker compose --env-file .env.dev.example -f compose.yaml run --rm createbuckets
          docker compose --env-file .env.dev.example -f compose.yaml exec -T postgres \
            psql -U mebel -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS mebel_ci WITH (FORCE);" \
            -c "CREATE DATABASE mebel_ci;"

      - name: Infra-gated tests (Postgres locking + pg_trgm + MinIO contract)
        env:
          POSTGRES_CONCURRENCY: "1"
          MINIO_CONTRACT: "1"
          DATABASE_URL: postgresql+asyncpg://mebel:mebel@localhost:5432/mebel_ci
        run: uv run pytest tests/test_inventory_postgres_concurrency.py tests/test_telegram_login_postgres_concurrency.py tests/test_sales_postgres_concurrency.py tests/test_catalog_search_postgres_trgm.py tests/test_files_minio_contract.py -q --no-cov

      - name: Stop data services
        if: always()
        working-directory: deploy
        run: docker compose --env-file .env.dev.example -f compose.yaml down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # 2. Web gate — eslint, prettier --check, vue-tsc, vitest, vite build.
  # ---------------------------------------------------------------------------
  verify-web:
    name: Web · lint · types · tests · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # No root package.json in this monorepo — point the action at web/'s
      # so it can read `packageManager: pnpm@10.x` from there.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint:check

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # A key spelled inside a template expression is a plain string to vue-tsc;
      # this resolves every literal t()/$t() against the uz catalog instead.
      - name: i18n keys
        run: pnpm i18n:check

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # 3. E2E gate — typecheck + full Playwright suite. The Playwright config
  #    boots the same dev stack used locally: Postgres/MinIO via Compose,
  #    migrated FastAPI backend, then Vite.
  # ---------------------------------------------------------------------------
  verify-e2e:
    name: E2E · browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.8.22
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # No root package.json — point the action at e2e/'s.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            e2e/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm install:browsers

      - name: Typecheck
        run: pnpm typecheck

      - name: Playwright tests
        run: pnpm test

      - name: Stop E2E data services
        if: always()
        working-directory: deploy
        run: docker compose --env-file .env.dev.example -f compose.yaml down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # 4. Images — build backend, web and edge once. PRs: build all, push none
  #    (smoke). main (push or "Run workflow"): push to GHCR whatever isn't
  #    there yet — backend/web under the commit SHA, the edge under its
  #    content tag — the exact images the deploy job has the server pull.
  # ---------------------------------------------------------------------------
  images:
    name: Docker · images
    runs-on: ubuntu-24.04
    needs: [verify-backend, verify-web, verify-e2e]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # Same condition as the deploy job's `if`: only main publishes.
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # backend and web are tagged with the commit SHA; the edge with its
      # content tag, from the same script deploy.sh pins it with.
      - name: Edge content tag
        id: tags
        run: |
          edge="$(bash deploy/scripts/edge-tag.sh)"
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
          echo "Edge image tag: $edge"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable tags: an image GHCR already has under its tag is neither
      # rebuilt nor re-pushed (see the header). Only a registry answer counts
      # as "not published" — not found, or denied/forbidden, which is how GHCR
      # answers for a package that doesn't exist yet (a real permission problem
      # then fails loudly at the push). Anything else, e.g. a network error,
      # stops the job rather than risk repointing a live tag.
      - name: Skip images GHCR already has
        id: published
        if: env.PUBLISH == 'true'
        env:
          EDGE_TAG: ${{ steps.tags.outputs.edge }}
        run: |
          check() {  # $1 = output key, $2 = image ref
            if out="$(docker buildx imagetools inspect "$2" 2>&1)"; then
              echo "$2 is already published; not rebuilding it."
              echo "$1=true" >> "$GITHUB_OUTPUT"
            elif grep -qiE 'not found|manifest unknown|name unknown|denied|unauthorized|forbidden' <<<"$out"; then
              echo "$2 is not published yet."
              echo "$1=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Could not check whether $2 exists: $out"
              exit 1
            fi
          }
          check backend "$IMAGE_PREFIX-backend:$GITHUB_SHA"
          check web "$IMAGE_PREFIX-web:$GITHUB_SHA"
          check edge "$IMAGE_PREFIX-edge:$EDGE_TAG"

      # The source label links each package to this repo on GHCR (and is what
      # deploy.sh's prune filter matches); the revision label records the
      # commit that built it.
      - name: Backend image
        if: steps.published.outputs.backend != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/qadam-uz/mebel-pro
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Web image
        if: steps.published.outputs.web != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/qadam-uz/mebel-pro
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Context is deploy/ — its .dockerignore lets only the Caddyfile in.
      - name: Edge image
        if: steps.published.outputs.edge != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/edge.Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE_PREFIX }}-edge:${{ steps.tags.outputs.edge }}
          labels: |
            org.opencontainers.image.source=https://github.com/qadam-uz/mebel-pro
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge

  # ---------------------------------------------------------------------------
  # 5. Deploy — SSH to the prod server and run deploy/scripts/deploy.sh.
  #    Only after every other job is green, and only on main: every push, or
  #    "Run workflow" on main to redeploy that commit.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-24.04
    environment: production
    needs: [verify-backend, verify-web, verify-e2e, images]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          # Empty (secret unset) = no host key verification; see the header.
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          # Nothing is built on the server any more — a deploy is a pull,
          # a migration and a container swap. 10m covers a cold first pull
          # plus both of deploy.sh's 120s `--wait` windows; the job's 15m
          # stays the backstop.
          command_timeout: 10m
          # The deploy script does:
          #   - git fetch + reset --hard $DEPLOY_REF (re-execs itself once)
          #   - refuses a deploy/.env with {{change-me}} left or values missing
          #   - pins IMAGE_TAG=<sha> + EDGE_IMAGE_TAG in deploy/.env, pulls
          #     backend/web/edge (never the data-service images)
          #   - starts postgres + minio, ensures the bucket exists
          #   - runs migrations in a one-off container (old release still serving)
          #   - up -d --wait --remove-orphans, re-registers the Telegram webhook
          #   - prunes mebel-pro's unused images
          # Pin to the exact commit CI verified.
          script: |
            DEPLOY_REF=${{ github.sha }} bash /opt/mebel-pro/deploy/scripts/deploy.sh
