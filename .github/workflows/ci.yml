# Mebel Pro CI / CD
#
# Three layers:
#
#   1. Verify (PR + push to main)
#        - verify-backend : ruff check · ruff format --check · mypy · pytest
#        - verify-web     : pnpm lint:check · format:check · typecheck · test · build
#        - verify-e2e     : pnpm typecheck · Playwright browser tests
#      These mirror the per-directory check gates documented in the repo
#      AGENTS.md. Run them locally before pushing; CI is the safety net.
#
#   2. Docker build smoke (PR + push to main, after verify)
#        - Just verifies the backend + web images still compile. No registry.
#
#   3. Deploy (push to main only, after every other job is green)
#        - SSHes to the VPS as the deploy user and runs
#            DEPLOY_REF=<sha> bash deploy/scripts/deploy.sh
#          which `git fetch && git reset --hard <sha>` and brings the prod
#          stack up. The repo is already cloned on the server. No registry,
#          no rsync, no docker push/pull.
#
# Required GitHub config (Settings → Secrets and variables → Actions):
#   secrets.DEPLOY_SSH_HOST     host / IP of the prod server
#   secrets.DEPLOY_SSH_USER     SSH user (must be in the `docker` group)
#   secrets.DEPLOY_SSH_KEY      private key for that user (PEM, no passphrase)
#   secrets.DEPLOY_SSH_PORT     optional — SSH port (default 22)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded verify runs on the same PR, but never cancel a deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend gate — ruff (lint + format), mypy, pytest.
  # ---------------------------------------------------------------------------
  verify-backend:
    name: Backend · lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.8.22
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `uv sync --frozen` resolves Python from backend/.python-version (3.12)
      # and pyproject.toml's requires-python, downloading it on demand.
      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Pytest
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # 2. Web gate — eslint, prettier --check, vue-tsc, vitest, vite build.
  # ---------------------------------------------------------------------------
  verify-web:
    name: Web · lint · types · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # No root package.json in this monorepo — point the action at web/'s
      # so it can read `packageManager: pnpm@10.x` from there.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint:check

      - name: Prettier
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # 3. E2E gate — typecheck + full Playwright suite. The Playwright config
  #    boots the same dev stack used locally: Postgres/MinIO via Compose,
  #    migrated FastAPI backend, then Vite.
  # ---------------------------------------------------------------------------
  verify-e2e:
    name: E2E · browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 0.8.22
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # No root package.json — point the action at e2e/'s.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: e2e/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            e2e/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm install:browsers

      - name: Typecheck
        run: pnpm typecheck

      - name: Playwright tests
        run: pnpm test

      - name: Stop E2E data services
        if: always()
        working-directory: deploy
        run: docker compose --env-file .env.dev.example -f compose.yaml down -v --remove-orphans

  # ---------------------------------------------------------------------------
  # 4. Docker build smoke — make sure the backend + web images still compile.
  #    No registry; CD does its own build on the server.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker · build smoke
    runs-on: ubuntu-latest
    needs: [verify-backend, verify-web, verify-e2e]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: false
          tags: mebel-pro-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          load: false
          tags: mebel-pro-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------------------------------------------------------------------
  # 5. Deploy — SSH to the prod server and run deploy/scripts/deploy.sh.
  #    Only after every other job is green and only on a push to main.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    needs: [verify-backend, verify-web, verify-e2e, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 25
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          # The deploy script does:
          #   - git fetch + reset --hard $DEPLOY_REF
          #   - verifies deploy/.env and the infra-net network exist
          #   - docker compose -f compose.prod.yaml up -d --build --remove-orphans
          #   - waits for the backend healthcheck
          #   - prunes dangling images
          # Pin to the exact commit CI verified.
          script: |
            DEPLOY_REF=${{ github.sha }} bash /opt/mebel-pro/deploy/scripts/deploy.sh
